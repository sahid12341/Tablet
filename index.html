      </div>
    </div>
    <div class="stat-grid" style="margin:24px 20px 30px;">
      <div class="stat-card"><div class="s-label">Status</div><div class="s-value" style="font-size:20px;">${esc(animal.status||"Active")}</div></div>
      <div class="stat-card"><div class="s-label">Gender</div><div class="s-value" style="font-size:20px;">${esc(animal.gender||"—")}</div></div>
      <div class="stat-card"><div class="s-label">Breed</div><div class="s-value" style="font-size:${animal.breed && animal.breed.length>14?"15px":"20px"};">${esc(animal.breed||"—")}</div></div>
      ${animal.skinType ? `<div class="stat-card"><div class="s-label">Skin Type</div><div class="s-value" style="font-size:20px;">${esc(animal.skinType)}</div></div>` : ""}
      <div class="stat-card"><div class="s-label">Age</div><div class="s-value" style="font-size:20px;">${calcAge(getEffectiveDOB(animal)) || "—"}</div><div class="s-sub">${animal.dob ? "Born" : "Since purchase"} ${esc(formatDateDMY(getEffectiveDOB(animal))||"—")}</div></div>
      <div class="stat-card"><div class="s-label">Current Weight</div><div class="s-value" style="font-size:20px;">${weights.length ? esc(weights[weights.length-1].weight)+" "+esc(weights[weights.length-1].unit||"Kg") : "—"}</div></div>
      <div class="stat-card"><div class="s-label">Current Height</div><div class="s-value" style="font-size:20px;">${heights.length ? esc(heights[heights.length-1].height)+" "+esc(heights[heights.length-1].unit||"cm") : "—"}</div></div>
      ${teethRecords.length ? `<div class="stat-card"><div class="s-label">Teeth</div><div class="s-value" style="font-size:20px;">${esc(teethRecords[teethRecords.length-1].teeth)}</div><div class="s-sub">as of ${esc(formatDateDMY(teethRecords[teethRecords.length-1].date)||"—")}</div></div>` : ""}
      ${!isMale ? `<div class="stat-card"><div class="s-label">Lifetime Milk</div><div class="s-value" style="font-size:20px;">${totalMilkAllTime.toFixed(0)} L</div></div>` : ""}
    </div>
    ${parentHtml}
    ${offspringHtml}
    ${tradeHtml ? section("Purchase / Sale", tradeHtml + profitHtml) : ""}
    ${!isMale ? section("Breeding History", breedingRows, "breeding", {femaleTag:tagId}) : ""}
    ${calvingAsCalf.length ? `<div class="eyebrow">Born From</div><div class="record-list" style="margin-bottom:28px;">${calvingAsCalf.map(c=>`<div class="record-card"><div class="rc-body"><div class="rc-id">Mother: ${esc(c.motherTag)}</div><div class="rc-fields"><div><span class="f-val">Born ${esc(formatDateDMY(c.date)||"—")}</span></div></div></div></div>`).join("")}</div>` : ""}
    ${!isMale ? section("Calving Records", calvingRows, "calving", {motherTag:tagId}) : ""}
    ${section("Medical History", medicalRows, "medical", {animalTag:tagId})}
    ${section("Deworming History", dewormingRows, "deworming", {animalTag:tagId})}
    ${!isMale ? section("Milk Production (last 30 entries)", milkRows, "milk", {animalTag:tagId}) : ""}
    ${buildWeightChartSVG(weights)}
    ${section("Weight History", weightRows, "weight", {animalTag:tagId})}
    ${buildHeightChartSVG(heights)}
    ${section("Height History", heightRows, "height", {animalTag:tagId})}
    ${section("Teeth History", teethRows, "teeth", {animalTag:tagId})}
  `;

}

/* ============================== HOME ============================== */
function renderHome(){
  const animals = DATA.animals || [];
  const activeAnimals = animals.filter(a=> a.status==="Active" || !a.status);
  const purchasesSoldCount = (DATA.purchases||[]).filter(p=>purchaseLinkedStatus(p)==="Sold").length;
  const herdCounts = {};
  activeAnimals.forEach(a=>{ const t = a.animalType||"Unspecified"; herdCounts[t] = (herdCounts[t]||0)+1; });
  const herdBreakdown = Object.entries(herdCounts).map(([t,c])=>c+" "+t).join(" · ") || "No animals yet";

  // Backup reminder: everything here lives only in this browser's local storage. Nudge for a
  // manual export (a plain JSON file the user saves anywhere — Files app, SD card, email/WhatsApp
  // to self — no account needed) if it's been a while since the last one. Gets visibly firmer
  // the longer it's been ignored, instead of staying the same gentle nudge forever.
  const lastBackupAt = localStorage.getItem("lastBackupAt");
  if(!localStorage.getItem("appFirstUsedAt")) localStorage.setItem("appFirstUsedAt", new Date().toISOString());
  // If a backup has never been made, measure urgency from when the app was first opened —
  // otherwise "never backed up" would stay stuck at the gentlest tier forever.
  const backupBaseline = lastBackupAt || localStorage.getItem("appFirstUsedAt");
  const daysSinceBackup = Math.floor((Date.now() - new Date(backupBaseline).getTime())/(1000*60*60*24));
  const hasAnyData = ["animals","purchases","sales"].some(m=>(DATA[m]||[]).length>0);
  // Tier 0 = no reminder. Tier 1 (7+ days) gentle, Tier 2 (14+ days) more insistent,
  // Tier 3 (30+ days) hardest to miss — and each tier lets itself be silenced for a
  // shorter stretch than the last, so it can't be waved away for a month at a time.
  const backupTier = daysSinceBackup>=30 ? 3 : daysSinceBackup>=14 ? 2 : daysSinceBackup>=7 ? 1 : 0;
  const backupTierDismissHours = {1:72, 2:24, 3:6}[backupTier] || 72;
  const backupDismissedAt = localStorage.getItem("backupReminderDismissedAt");
  const dismissedRecently = backupDismissedAt && (Date.now() - new Date(backupDismissedAt).getTime()) < (1000*60*60*backupTierDismissHours);
  const needsBackup = hasAnyData && backupTier>0 && !dismissedRecently;
  const backupTierStyle = {
    1: { border:"var(--hair)", titleColor:"var(--gold2)", icon:"", title:lastBackupAt ? "Time for a backup" : "No backup yet",
         body: lastBackupAt ? `Last backed up ${daysSinceBackup} days ago. ` : "All your data lives only on this device. " },
    2: { border:"#c99a3a", titleColor:"#e0b23f", icon:"⚠️ ", title:lastBackupAt ? "Backup overdue" : "Still no backup",
         body: `It's been ${daysSinceBackup} days${lastBackupAt ? " since your last backup" : " since you started using this app"} with no copy saved anywhere else. ` },
    3: { border:"var(--danger)", titleColor:"var(--danger)", icon:"🚨 ", title:lastBackupAt ? "Backup seriously overdue" : "No backup — please act",
         body: `Over ${daysSinceBackup} days${lastBackupAt ? " since your last backup" : ""} with your only copy sitting on this one device. If anything happens to this tablet, that data is gone for good. ` },
  }[backupTier] || {};
  const backupReminderHtml = needsBackup ? `
    <div class="alert-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
      background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid ${backupTierStyle.border};
      border-radius:10px; padding:14px 16px;">
      <div>
        <div style="font-weight:700;color:${backupTierStyle.titleColor};font-size:13px;">${backupTierStyle.icon}${esc(backupTierStyle.title)}</div>
        <div style="color:var(--muted2);font-size:11px;margin-top:3px;">
          ${esc(backupTierStyle.body)}
          Save a free copy — no account needed.
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <button id="backup-now-btn" style="background:var(--gradient-gold);border:none;color:#1a1a1a;border-radius:6px;
          padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;">Back Up Now</button>
        <button id="backup-dismiss-btn" style="background:none;border:1px solid var(--hair);color:var(--muted);border-radius:6px;
          padding:8px 12px;font-size:11px;font-weight:600;cursor:pointer;">${backupTierDismissHours<24 ? `Remind in ${backupTierDismissHours}h` : "Later"}</button>
      </div>
    </div>` : "";

  // Data now lives in IndexedDB, which shares a much larger quota than the
  // old ~5MB localStorage ceiling — so warn based on the device's *actual*
  // reported quota (via STORAGE_INFO, refreshed after loads/saves) rather
  // than a fixed KB number. Falls back to a generous fixed threshold on
  // browsers that don't support the storage estimate API.
  const storagePct = STORAGE_INFO.pct;
  const storageIsWarn = storagePct !== null ? storagePct >= 0.75 : storageUsedKB() >= 51200;
  const storageIsDanger = storagePct !== null ? storagePct >= 0.90 : storageUsedKB() >= 76800;
  const storageDetail = storagePct !== null
    ? `Using ${Math.round(storagePct*100)}% of this device's available storage (about ${(STORAGE_INFO.usedKB/1024).toFixed(1)} MB of ${(STORAGE_INFO.quotaKB/1024).toFixed(0)} MB) — mostly photos.`
    : `Using about ${(storageUsedKB()/1024).toFixed(1)} MB on this device — mostly photos.`;
  const storageWarningHtml = storageIsWarn ? `
    <div class="alert-row" style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;
      background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid ${storageIsDanger?'var(--danger)':'#c99a3a'};
      border-radius:10px; padding:14px 16px;">
      <div>
        <div style="font-weight:700;color:${storageIsDanger?'var(--danger)':'#e0b23f'};font-size:13px;">${storageIsDanger?"🚨 Storage almost full":"⚠️ Storage getting full"}</div>
        <div style="color:var(--muted2);font-size:11px;margin-top:3px;">
          ${storageDetail} Free up space now before it blocks new entries.
        </div>
      </div>
      <button id="free-space-banner-btn" style="background:var(--gradient-gold);border:none;color:#1a1a1a;border-radius:6px;
        padding:8px 14px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;">Free Up Space</button>
    </div>` : "";

  const thisMonth = new Date().toISOString().slice(0,7);
  const purchasesThisMonth = (DATA.purchases||[]).filter(p=>(p.date||"").startsWith(thisMonth));
  const salesThisMonth = (DATA.sales||[]).filter(s=>(s.date||"").startsWith(thisMonth));
  const purchaseTotal = purchasesThisMonth.reduce((s,p)=>s+(Number(p.price)||0),0);
  const purchaseTransportTotal = purchasesThisMonth.reduce((s,p)=>s+(Number(p.transportCost)||0),0);
  const saleTotal = salesThisMonth.reduce((s,p)=>s+(Number(p.price)||0),0);
  const allTimeSalesTotal = (DATA.sales||[]).reduce((s,p)=>s+(Number(p.price)||0),0);
  const lowMed = (DATA.medStock||[]).filter(m=>Number(m.quantity) <= Number(m.lowStockThreshold||0));
  const lowFeed = (DATA.feedStock||[]).filter(f=>Number(f.quantity) <= Number(f.lowStockThreshold||0));
  const today = new Date(); const in30 = new Date(); in30.setDate(today.getDate()+30);
  const upcomingCalvings = (DATA.breeding||[]).filter(b=>{
    if(!b.expectedCalvingDate) return false;
    const d = new Date(b.expectedCalvingDate);
    return d>=today && d<=in30 && b.status!=="Failed";
  });
  const pendingSalary = (DATA.salary||[]).filter(s=>s.status==="Pending");
  const activeEmployees = (DATA.employees||[]).filter(e=>e.status==="Active" || !e.status);

  // Milk production
  const todayStr = new Date().toISOString().slice(0,10);
  const milkToday = (DATA.milk||[]).filter(m=>m.date===todayStr).reduce((s,m)=>s+(Number(m.quantity)||0),0);
  const milkThisMonth = (DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).reduce((s,m)=>s+(Number(m.quantity)||0),0);
  const milkDaysThisMonth = new Set((DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).map(m=>m.date)).size || 1;
  const milkAvgPerDay = milkThisMonth / milkDaysThisMonth;

  const milkByAnimalThisMonth = {};
  (DATA.milk||[]).filter(m=>(m.date||"").startsWith(thisMonth)).forEach(m=>{
    const tag = m.animalTag || "Unknown";
    milkByAnimalThisMonth[tag] = (milkByAnimalThisMonth[tag]||0) + (Number(m.quantity)||0);
  });
  let topProducer = null, topProducerAmt = 0;
  Object.entries(milkByAnimalThisMonth).forEach(([tag,amt])=>{ if(amt>topProducerAmt){ topProducer=tag; topProducerAmt=amt; } });

  // Recent activity across all modules
  let recentActivity = [];
  MODULES.forEach(m=>{
    (DATA[m.id]||[]).forEach(r=>{
      const rawPrimary = r[m.fields[0].key]||"—";
      const primary = (m.fields[0].type==="date" && rawPrimary!=="—") ? formatDateDMY(rawPrimary) : rawPrimary;
      recentActivity.push({ moduleId:m.id, moduleLabel:m.label, primary, createdAt:r.createdAt||"" });
    });
  });
  recentActivity.sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  recentActivity = recentActivity.slice(0,6);
  function timeAgo(iso){
    if(!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins<1) return "just now";
    if(mins<60) return mins+"m ago";
    const hrs = Math.floor(mins/60);
    if(hrs<24) return hrs+"h ago";
    const days = Math.floor(hrs/24);
    if(days<30) return days+"d ago";
    return new Date(iso).toISOString().slice(0,10);
  }

  // Upcoming medical follow-ups (7 days)
  const in7 = new Date(); in7.setDate(today.getDate()+7);
  const upcomingFollowUps = (DATA.medical||[]).filter(m=>{
    if(!m.followUpDate) return false;
    const d = new Date(m.followUpDate);
    return d>=today && d<=in7;
  });
  const upcomingDeworming = (DATA.deworming||[]).filter(m=>{
    if(!m.nextDueDate) return false;
    const d = new Date(m.nextDueDate);
    return d>=today && d<=in7;
  });
  const upcomingInspections = (DATA.inspection||[]).filter(m=>{
    if(!m.nextInspectionDate) return false;
    const d = new Date(m.nextInspectionDate);
    return d>=today && d<=in7;
  });

  // Tasks: overdue and due today
  const openTasks = (DATA.tasks||[]).filter(t=>t.status!=="Done");
  const overdueTasks = openTasks.filter(t=> t.dueDate && new Date(t.dueDate) < today);
  const dueTodayTasks = openTasks.filter(t=> t.dueDate===todayStr);

  // Financial summary (all-time)
  const totalSalesRevenue = (DATA.sales||[]).reduce((s,r)=>s+(Number(r.price)||0),0);
  const pendingReceivables = (DATA.sales||[]).reduce((s,r)=>{
    const outstanding = (Number(r.price)||0) - (Number(r.amountReceived)||0);
    return s + Math.max(0, outstanding);
  }, 0);
  const totalPurchaseCost = (DATA.purchases||[]).reduce((s,r)=>s+(Number(r.price)||0),0);
  const totalPurchaseAdditionalCost = (DATA.purchases||[]).reduce((s,r)=>s+(Number(r.additionalCost)||0),0);
  // Transport cost entered on a Purchase is auto-mirrored into the Transport module (see saveModal),
  // so totalTransportCost below already includes it — don't add it again here.
  const totalTransportCost = (DATA.transport||[]).reduce((s,r)=>s+(Number(r.cost)||0),0);
  const totalMedicalCost = (DATA.medical||[]).reduce((s,r)=>s+(Number(r.cost)||0),0);
  const totalMedStockCost = (DATA.medStock||[]).reduce((s,r)=>s+(Number(r.cost)||0),0);
  const totalFeedStockCost = (DATA.feedStock||[]).reduce((s,r)=>s+(Number(r.cost)||0),0);
  const totalSalaryPaid = (DATA.salary||[]).filter(s=>s.status==="Paid").reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalOtherExpenses = (DATA.otherExpenses||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);
  const totalExpenses = totalPurchaseCost+totalPurchaseAdditionalCost+totalTransportCost+totalMedicalCost+totalMedStockCost+totalFeedStockCost+totalSalaryPaid+totalOtherExpenses;
  const netPosition = totalSalesRevenue - totalExpenses;

  const statCard = (label, value, sub, screen) => `
    <div class="stat-card" data-goto="${screen}">
      <div class="s-label">${esc(label)}</div>
      <div class="s-value">${value}</div>
      ${sub ? `<div class="s-sub">${esc(sub)}</div>` : ""}
    </div>`;

  const alertRow = (text, screen) => `
    <div class="alert-row" data-goto="${screen.mid}">
      <div class="a-text">${esc(text)}</div>
      <div class="a-chev">›</div>
    </div>`;

  let alertsHtml = "";
  overdueTasks.forEach(t=> alertsHtml += alertRow(`Overdue task — ${t.title} (was due ${formatDateDMY(t.dueDate)})`, {mid:"tasks"}));
  dueTodayTasks.forEach(t=> alertsHtml += alertRow(`Due today — ${t.title}`, {mid:"tasks"}));
  lowMed.forEach(m=> alertsHtml += alertRow(`Low stock — ${m.medicineName} (${m.quantity} ${m.unit||""})`, {mid:"medStock"}));
  lowFeed.forEach(f=> alertsHtml += alertRow(`Low stock — ${f.feedType} (${f.quantity} ${f.unit||""})`, {mid:"feedStock"}));
  upcomingCalvings.forEach(b=> alertsHtml += alertRow(`Calving due — ${b.femaleTag} on ${formatDateDMY(b.expectedCalvingDate)}`, {mid:"breeding"}));
  upcomingFollowUps.forEach(m=> alertsHtml += alertRow(`Follow-up due — ${m.animalTag} on ${formatDateDMY(m.followUpDate)}`, {mid:"medical"}));
  upcomingDeworming.forEach(m=> alertsHtml += alertRow(`Deworming due — ${m.animalTag} on ${formatDateDMY(m.nextDueDate)}`, {mid:"deworming"}));
  upcomingInspections.forEach(m=> alertsHtml += alertRow(`Inspection due — ${m.animalTag} on ${formatDateDMY(m.nextInspectionDate)}`, {mid:"inspection"}));
  pendingSalary.forEach(s=> alertsHtml += alertRow(`Salary pending — ${s.employeeName} (${s.month||""})`, {mid:"salary"}));

  let totalPhotoCount = 0;
  { const seenGallerySrc = new Set();
    MODULES.forEach(m=> (DATA[m.id]||[]).forEach(r=> (r.photos||[]).forEach(p=>{
      if(seenGallerySrc.has(p)) return;
      seenGallerySrc.add(p);
      totalPhotoCount++;
    })));
  }
  const uniqueCustomerCount = computeCustomers().length;

  document.getElementById("content").innerHTML = `
    <div class="hero">
      <div class="hero-badge"><img src="${LOGO_SRC}" alt="" /></div>
      <h1 class="serif">S.Z. Dairy Farm</h1>
      <div class="tagline">Where Freshness Meets Nature</div>
      <div class="est">SINCE 2010</div>
    </div>

    <div style="padding:0 20px 20px;">
      <button data-goto="showcase" style="width:100%; background:linear-gradient(135deg, #3a2f14 0%, #1c1710 100%);
        border:1px solid var(--gold3); color:var(--gold2); border-radius:12px; padding:16px; font-size:14px;
        font-weight:700; cursor:pointer; letter-spacing:.03em;">✦ Show Farm to Customer</button>
    </div>

    <div class="search-wrap" style="padding:0 20px 24px;">
      <input type="text" id="global-search" placeholder="Search animals, records, employees..." value="${esc(SEARCH.global||"")}" />
    </div>
    <div id="search-results"></div>
    <div id="normal-home">

    ${backupReminderHtml}
    ${storageWarningHtml}
    <div class="eyebrow">Overview</div>
    <div class="stat-grid">
      ${statCard("Active Animals", activeAnimals.length, herdBreakdown, "animals")}
      ${statCard("Purchases", (DATA.purchases||[]).length+"", (purchasesSoldCount>0 ? purchasesSoldCount+" sold" : "All-time entries"), "purchases")}
      ${statCard("Sales", allTimeSalesTotal.toLocaleString("en-IN"), "All-time revenue", "sales")}
      ${statCard("Employees", activeEmployees.length, "On roll", "employees")}
    </div>

    ${alertsHtml ? `<div class="eyebrow">Attention Needed</div><div class="alert-strip">${alertsHtml}</div>` : ""}

    <div class="eyebrow">Recent Activity</div>
    <div class="alert-strip">
      ${recentActivity.length ? recentActivity.map(a=>`
        <div class="alert-row" data-goto="${a.moduleId}">
          <div class="a-text">${esc(a.moduleLabel)} — ${esc(a.primary)}</div>
          <div style="color:var(--muted2);font-size:11px;">${timeAgo(a.createdAt)}</div>
        </div>`).join("") : `<div class="empty-note">No activity yet — add your first record.</div>`}
    </div>

    <div class="eyebrow">Milk Production</div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card" data-goto="milk"><div class="s-label">Today</div><div class="s-value" style="font-size:24px;">${milkToday.toFixed(1)} L</div></div>
      <div class="stat-card" data-goto="milk"><div class="s-label">This Month</div><div class="s-value" style="font-size:24px;">${milkThisMonth.toFixed(0)} L</div></div>
      <div class="stat-card" data-goto="milk"><div class="s-label">Daily Avg</div><div class="s-value" style="font-size:24px;">${milkAvgPerDay.toFixed(1)} L</div></div>
    </div>
    ${topProducer ? `<div class="alert-strip" style="margin-top:10px;">
      <div class="alert-row" data-goto="milk"><div class="a-text">Top producer this month — <b style="color:var(--gold2);">${esc(topProducer)}</b></div><div style="color:var(--gold2);font-size:12px;font-weight:700;">${topProducerAmt.toFixed(0)} L</div></div>
    </div>` : ""}

    <div class="eyebrow" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <span>All-Time Financials</span>

        style="background:none;border:1px solid var(--hair);color:var(--gold2);border-radius:6px;padding:4px 12px;
        font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;">+ Add Additional Cost</button>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(2,1fr);">
      <div class="stat-card"><div class="s-label">Total Revenue</div><div class="s-value">${totalSalesRevenue.toLocaleString("en-IN")}</div><div class="s-sub">From animal sales (agreed price)</div></div>

function renderGlobalSearch(){
  const query = (SEARCH.global||"").trim().toLowerCase();
  const resultsEl = document.getElementById("search-results");
  const normalEl = document.getElementById("normal-home");
  if(!query){
    resultsEl.innerHTML = "";
    normalEl.style.display = "";
    return;
  }
  normalEl.style.display = "none";
  let resultsHtml = "";
  let totalMatches = 0;
  MODULES.forEach(m=>{
    const matches = (DATA[m.id]||[]).filter(r=>
      Object.values(r).some(v=> typeof v==="string" && v.toLowerCase().includes(query))
    );
    if(matches.length){
      totalMatches += matches.length;
      const idKey = m.fields[0].key;
      const rows = matches.slice(0,8).map(r=>`
        <div class="record-card" data-searchgoto="${m.id}" data-searchtag="${esc(r[idKey]||'')}">
          <div class="rc-body"><div class="rc-id">${esc(m.fields[0].type==="date" ? (formatDateDMY(r[idKey]) || "—") : (r[idKey]||"—"))}</div>
          <div class="rc-fields"><div class="f-val">${esc(m.label)}</div></div></div>
        </div>`).join("");
      resultsHtml += `<div class="eyebrow">${esc(m.label)} (${matches.length})</div><div class="record-list" style="margin-bottom:24px;">${rows}</div>`;
    }
  });
  resultsEl.innerHTML = totalMatches===0
    ? `<div class="empty-note" style="margin:0 20px;">No matches for "${esc(SEARCH.global)}".</div>`
    : resultsHtml;
  resultsEl.querySelectorAll("[data-searchgoto]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const mid = el.getAttribute("data-searchgoto");
      if(mid==="animals"){ goTo("profile::"+el.getAttribute("data-searchtag")); return; }
      SEARCH[mid] = SEARCH.global;
      goTo(mid);
    });
  });
}

/* ============================== MODULE LIST ============================== */
function renderModuleList(moduleId){
  const mod = moduleById(moduleId);
  const records = DATA[moduleId] || [];
  const query = (SEARCH[moduleId] || "").toLowerCase();
  const filterField = (moduleId==="purchases")
    ? { key:"__linkedStatus", options:["Sold"] }
    : mod.fields.find(f=> f.key==="status" || f.key==="paymentStatus");
  const activeFilter = FILTERS[moduleId] || "";
  // Every module reads as a date-wise timeline: records are grouped under the
  // date they belong to (using that module's own date field, e.g. Service
  // Date for Breeding, Paid Date for Salary), most recent first, so it's easy
  // to see "on this date, these things happened" rather than one flat list.
  const recordDateKey = (r)=> (moduleId==="animals" ? getEffectiveDOB(r) : r[MODULE_DATE_FIELD[moduleId]]) || (r.createdAt||"").slice(0,10);
  let sorted = [...records].sort((a,b)=> recordDateKey(b).localeCompare(recordDateKey(a)) || (b.createdAt||"").localeCompare(a.createdAt||""));
  if(filterField && activeFilter){
    sorted = sorted.filter(r=> (moduleId==="purchases" ? purchaseLinkedStatus(r) : (r[filterField.key]||"")) === activeFilter);
  }
  if(query.trim()){
    sorted = sorted.filter(r => Object.values(r).some(v => typeof v==="string" && v.toLowerCase().includes(query)));
  }
  const isFeedStock = moduleId === "feedStock";
  const idField = mod.fields[0];
  const secondaryFields = mod.fields.slice(1,3);

  let rowsHtml = "";
  if(sorted.length===0){
    rowsHtml = `<div class="empty-note">No ${esc(mod.label.toLowerCase())} records yet.<br/>Tap "+ Add" above to create one.</div>`;
  } else {
    let lastDateKey = null;
    rowsHtml = `<div class="record-list">` + sorted.map(r=>{
      let dateHeaderHtml = "";
      const dk = recordDateKey(r);
      if(dk !== lastDateKey){
        lastDateKey = dk;
        const label = dk ? new Date(dk+"T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"long", year:"numeric"}) : "No date";
        dateHeaderHtml = `<div class="date-group-label">${esc(label)}</div>`;
      }
      const photo = (r.photos && r.photos[0])
        ? `<img src="${r.photos[0]}" data-lightbox="${r.id}" />`
        : `<span>${esc(mod.label.charAt(0))}</span>`;
      const secondaryText = secondaryFields.map(f=> r[f.key] ? esc(r[f.key]) : "").filter(Boolean);
      const fieldsHtml = secondaryFields.map((f,i)=> secondaryText[i] ? `<div><span class="f-label">${esc(f.label)}: </span><span class="f-val">${secondaryText[i]}</span></div>` : "").join("")
        + ((isFeedStock && r.leftoverBeforeOrder !== undefined && r.leftoverBeforeOrder !== "")
            ? `<div class="f-carryover">Stock left before this order: ${esc(r.leftoverBeforeOrder)} ${esc(r.unit||"")}</div>` : "");
      const morePhotos = (r.photos && r.photos.length>1) ? `<div class="more-photos">+${r.photos.length-1} more photo${r.photos.length-1>1?"s":""}</div>` : "";
      const linkedStatus = (moduleId==="purchases") ? purchaseLinkedStatus(r) : "";
      // Purchase cards now open their own Purchase Detail screen on tap (see
      // renderPurchaseDetail / data-goto="purchase::" below) instead of jumping
      // straight to the linked animal's profile, so purchase-specific data
      // (seller, cost breakdown, payment status) is what's shown, not general
      // animal info.
      const canMarkSale = (moduleId==="animals" && r.status!=="Sold") || (moduleId==="purchases" && (r.animalTag||"").trim() && linkedStatus!=="Sold");
      const statusBadge = (moduleId==="animals" && r.status && r.status!=="Active")
        ? `<span class="status-badge status-${esc(r.status.toLowerCase())}">${esc(r.status)}</span>`
        : (moduleId==="purchases" && linkedStatus==="Sold")
          ? `<span class="status-badge status-sold">Sold</span>` : "";
      return `${dateHeaderHtml}
        <div class="record-card"${moduleId==="animals" ? ` data-goto="profile::${esc(r.tagId)}" style="cursor:pointer;"` : (moduleId==="purchases" ? ` data-goto="purchase::${esc(r.id)}" style="cursor:pointer;"` : (moduleId==="sales" ? ` data-goto="sale::${esc(r.id)}" style="cursor:pointer;"` : ""))}>
          <div class="rc-photo">${photo}</div>
          <div class="rc-body">
            <div class="rc-id">${esc(idField.type==="date" ? (formatDateDMY(r[idField.key]) || "—") : (r[idField.key] || "—"))}${statusBadge}</div>
            <div class="rc-fields">${fieldsHtml}${morePhotos}</div>
          </div>
          <div class="rc-actions">
            ${moduleId==="sales" ? `<button data-goto="receipt::${esc(r.id)}">Receipt</button>` : ""}
            ${canMarkSale ? `<button data-marksale="${r.id}">Mark as Sale</button>` : ""}
            <button data-edit="${r.id}">Edit</button>
            <button data-del="${r.id}" class="del">Delete</button>
          </div>
        </div>`;
    }).join("") + `</div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="module-hero">
      <div class="m-eyebrow">${esc(mod.subtitle)}</div>
      <h1 class="serif">${esc(mod.label)}</h1>
      <div class="m-rule"></div>
    </div>
    <div class="search-wrap">
      <input type="text" placeholder="Search ${esc(mod.label.toLowerCase())}..." id="search-input" value="${esc(SEARCH[moduleId]||'')}" />
      <button id="btn-export-csv" style="margin-top:10px;background:none;border:1px solid var(--hair);color:var(--gold2);
        border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.03em;">⬇ Export as CSV</button>
      ${moduleId==="animals" ? `<button id="btn-print-active" style="margin-top:10px;margin-left:8px;background:none;border:1px solid var(--hair);color:var(--gold2);
        border-radius:6px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.03em;">🖨️ Print Active Animals</button>` : ""}
    </div>
    ${filterField ? `<div class="filter-row">
      <button class="filter-chip ${!activeFilter?'active':''}" data-filter="">All</button>
      ${filterField.options.map(o=>`<button class="filter-chip ${activeFilter===o?'active':''}" data-filter="${esc(o)}">${esc(o)}</button>`).join("")}
    </div>` : ""}
    ${rowsHtml}
  `;

  document.getElementById("search-input").addEventListener("input", (e)=>{
    SEARCH[moduleId] = e.target.value;
    renderModuleList(moduleId);
  });
  document.getElementById("btn-export-csv").addEventListener("click", ()=> exportModuleCSV(moduleId));
  const printActiveBtn = document.getElementById("btn-print-active");
  if(printActiveBtn) printActiveBtn.addEventListener("click", ()=> printActiveAnimals());
  document.querySelectorAll("[data-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{
      FILTERS[moduleId] = el.getAttribute("data-filter");
      renderModuleList(moduleId);
    });
  });
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const rec = records.find(r=>r.id===el.getAttribute("data-edit"));
      openModal(moduleId, rec);
    });
  });
  document.querySelectorAll("[data-marksale]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const rec = records.find(r=>r.id===el.getAttribute("data-marksale"));
      if(!rec) return;
      const tag = moduleId==="animals" ? rec.tagId : rec.animalTag;
      // Opens a fresh Sale entry pre-filled with this animal's tag, using the
      // same tagRef auto-linking logic that already marks the animal "Sold" on save.
      openModal("sales", null, { animalTag: tag||"" });
    });
  });
  document.querySelectorAll("[data-del]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const delId = el.getAttribute("data-del");

      if(moduleId === "animals"){
        const rec = DATA.animals.find(r=>r.id===delId);
        const tag = (rec && rec.tagId || "").trim().toLowerCase();
        const linkedCount = tag ? ["purchases","sales","medical","weight","height","teeth","milk","breeding"].reduce((n,mId)=>
          n + (DATA[mId]||[]).filter(r=>((r.animalTag||r.femaleTag||"").trim().toLowerCase())===tag).length, 0)
          + (DATA.calving||[]).filter(c=>(c.motherTag||"").trim().toLowerCase()===tag || (c.calfTag||"").trim().toLowerCase()===tag).length
          : 0;

        let cascadeLinked = false;
        if(linkedCount>0){
          if(!confirm(`Delete this animal? It has ${linkedCount} linked record${linkedCount>1?"s":""} (purchase/sale/medical/weight/height/teeth/milk/breeding/calving).`)) return;
          cascadeLinked = confirm(`Also permanently delete those ${linkedCount} linked record${linkedCount>1?"s":""}?\n\nOK = delete them too.\nCancel = keep them (they'll just lose the animal link).`);
        } else if(!confirm("Delete this record?")) return;

        DATA.animals = DATA.animals.filter(r=>r.id!==delId);
        saveModule("animals");

        if(cascadeLinked && tag){
          ["purchases","sales","medical","weight","height","teeth","milk","breeding"].forEach(mId=>{
            const before = (DATA[mId]||[]).length;
            DATA[mId] = (DATA[mId]||[]).filter(r=>((r.animalTag||r.femaleTag||"").trim().toLowerCase())!==tag);
            if((DATA[mId]||[]).length !== before) saveModule(mId);
          });
          const beforeCalving = (DATA.calving||[]).length;
          DATA.calving = (DATA.calving||[]).filter(c=>
            (c.motherTag||"").trim().toLowerCase()!==tag && (c.calfTag||"").trim().toLowerCase()!==tag);
          if((DATA.calving||[]).length !== beforeCalving) saveModule("calving");
          showToast("Animal and its linked records deleted");
        } else {
          showToast("Record deleted");
        }
        renderModuleList(moduleId);
        return;
      }

      if(moduleId === "employees"){
        const rec = DATA.employees.find(r=>r.id===delId);
        const name = (rec && rec.name || "").trim().toLowerCase();
        const linkedCount = name ? (DATA.salary||[]).filter(s=>(s.employeeName||"").trim().toLowerCase()===name).length
          + (DATA.tasks||[]).filter(t=>(t.assignedTo||"").trim().toLowerCase()===name).length : 0;

        let cascadeLinked = false;
        if(linkedCount>0){
          if(!confirm(`Delete this employee? They have ${linkedCount} linked record${linkedCount>1?"s":""} (salary/tasks).`)) return;
          cascadeLinked = confirm(`Also permanently delete those ${linkedCount} linked record${linkedCount>1?"s":""}?\n\nOK = delete them too.\nCancel = keep them (they'll just lose the employee link).`);
        } else if(!confirm("Delete this record?")) return;

        DATA.employees = DATA.employees.filter(r=>r.id!==delId);
        saveModule("employees");

        if(cascadeLinked && name){
          const beforeSalary = (DATA.salary||[]).length;
          DATA.salary = (DATA.salary||[]).filter(s=>(s.employeeName||"").trim().toLowerCase()!==name);
          if((DATA.salary||[]).length !== beforeSalary) saveModule("salary");
          const beforeTasks = (DATA.tasks||[]).length;
          DATA.tasks = (DATA.tasks||[]).filter(t=>(t.assignedTo||"").trim().toLowerCase()!==name);
          if((DATA.tasks||[]).length !== beforeTasks) saveModule("tasks");
          showToast("Employee and linked records deleted");
        } else {
          showToast("Record deleted");
        }
        renderModuleList(moduleId);
        return;
      }

      if(!confirm("Delete this record?")) return;
      {
        const deletedRec = DATA[moduleId].find(r=>r.id===delId);
        DATA[moduleId] = DATA[moduleId].filter(r=>r.id!==delId);
        saveModule(moduleId);

        if(moduleId === "purchases"){
          const linkedIdx = (DATA.animals||[]).findIndex(a=> a.autoAdded && a.autoAddedFromPurchaseId===delId);
          const linkedTransportBefore = (DATA.transport||[]).length;
          DATA.transport = (DATA.transport||[]).filter(t=>!(t.autoAdded && t.autoAddedFromPurchaseId===delId));
          const transportRemoved = (DATA.transport||[]).length !== linkedTransportBefore;
          if(transportRemoved) saveModule("transport");
          if(linkedIdx>=0){
            DATA.animals.splice(linkedIdx,1);
            saveModule("animals");
            showToast("Record deleted — auto-added animal"+(transportRemoved?" and transport entry":"")+" removed too");
          } else if(transportRemoved){
            showToast("Record deleted — linked transport entry removed too");
          } else {
            showToast("Record deleted");
          }
        } else if(moduleId === "medical"){
          const linkedDewormBefore = (DATA.deworming||[]).length;
          DATA.deworming = (DATA.deworming||[]).filter(d=>!(d.autoAdded && d.autoAddedFromMedicalId===delId));
          const dewormRemoved = (DATA.deworming||[]).length !== linkedDewormBefore;
          if(dewormRemoved){
            saveModule("deworming");
            showToast("Record deleted — linked deworming entry removed too");
          } else {
            showToast("Record deleted");
          }
        } else if(moduleId === "sales"){
          const linkedIdx = (DATA.animals||[]).findIndex(a=> a.autoAdded && a.autoAddedFromSaleId===delId);
          if(linkedIdx>=0){
            DATA.animals.splice(linkedIdx,1);
            saveModule("animals");
            showToast("Record deleted — auto-added animal removed too");
          } else if(deletedRec && deletedRec.animalTag){
            const tag = deletedRec.animalTag.trim().toLowerCase();
            const otherSaleStillExists = (DATA.sales||[]).some(s=> (s.animalTag||"").trim().toLowerCase()===tag);
            const animalIdx = (DATA.animals||[]).findIndex(a=>(a.tagId||"").trim().toLowerCase()===tag);
            if(!otherSaleStillExists && animalIdx>=0 && DATA.animals[animalIdx].status==="Sold"){
              DATA.animals[animalIdx].status = "Active";
              saveModule("animals");
              showToast("Record deleted — animal marked Active again");
            } else {
              showToast("Record deleted");
            }
          } else {
            showToast("Record deleted");
          }
        } else {
          showToast("Record deleted");
        }
        renderModuleList(moduleId);
      }
    });
  });
  document.querySelectorAll("[data-lightbox]").forEach(img=>{
    img.addEventListener("click", (e)=>{
      e.stopPropagation();
      const rec = records.find(r=>r.id===img.getAttribute("data-lightbox"));
      openLightbox(rec.photos || []);
    });
  });
}

function openLightbox(photos){
  const lb = document.getElementById("lightbox");
  lb.querySelector(".imgs").innerHTML = photos.map(p=>`<img src="${p}" />`).join("");
  lb.classList.add("open");
}
document.getElementById("lightbox").addEventListener("click", ()=> document.getElementById("lightbox").classList.remove("open"));

/* ============================== MODAL (ADD/EDIT) ============================== */
let MODAL_PHOTOS = [];
let MODAL_SCROLL_Y = 0;
function openModal(moduleId, record, prefill){
  const mod = moduleById(moduleId);
  MODAL_PHOTOS = record ? (record.photos || []).slice() : [];

  const todayISO = new Date().toISOString().slice(0,10);
  const noAutoDateFields = new Set(["dob","expectedCalvingDate","followUpDate","expiryDate","joinDate","dueDate"]);
  const currentAnimalType = record
    ? (record.animalType||"")
    : (prefill && prefill.animalType!==undefined ? prefill.animalType : "");
  const fieldsHtml = mod.fields.map(f=>{
    const val = record
      ? (record[f.key]||"")
      : (prefill && prefill[f.key]!==undefined ? prefill[f.key] : (f.type==="date" && !noAutoDateFields.has(f.key) ? todayISO : ""));
    let inputHtml;
    if(f.type==="textarea"){
      inputHtml = `<textarea rows="2" data-field="${f.key}">${esc(val)}</textarea>`;
    } else if(f.type==="select" && f.allowCross){
      // Crossbred support: two chained dropdowns (second one optional) whose
      // combined picks feed a single hidden input — saveModal still just
      // reads one plain value for this field, same as any other select.
      const effectiveOptions = (f.optionsByType && f.optionsByType[currentAnimalType]) || f.options;
      const [partA, partB] = breedValueToParts(val);
      const optionsByTypeAttr = f.optionsByType ? ` data-options-by-type="${esc(JSON.stringify(f.optionsByType))}" data-options-fallback="${esc(JSON.stringify(f.options))}"` : "";
      const optsA = `<option value="">Select...</option>` + effectiveOptions.map(o=>`<option value="${esc(o)}" ${partA===o?"selected":""}>${esc(o)}</option>`).join("");
      const optsB = `<option value="">None — single breed</option>` + effectiveOptions.map(o=>`<option value="${esc(o)}" ${partB===o?"selected":""}>${esc(o)}</option>`).join("");
      inputHtml = `
        <input type="hidden" data-field="${f.key}" value="${esc(val)}" />
        <select class="breed-cross-select" data-cross-role="a"${optionsByTypeAttr}>${optsA}</select>
        <div style="font-size:10.5px;color:var(--muted2);margin:7px 0 4px;">Crossbred? Add a second breed</div>
        <select class="breed-cross-select" data-cross-role="b"${optionsByTypeAttr}>${optsB}</select>
      `;
    } else if(f.type==="select"){
      const effectiveOptions = (f.optionsByType && f.optionsByType[currentAnimalType]) || f.options;
      const opts = `<option value="">Select...</option>` + effectiveOptions.map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("");
      const optionsByTypeAttr = f.optionsByType ? ` data-options-by-type="${esc(JSON.stringify(f.optionsByType))}" data-options-fallback="${esc(JSON.stringify(f.options))}"` : "";
      inputHtml = `<select data-field="${f.key}"${optionsByTypeAttr}>${opts}</select>`;
    } else if(f.type==="tagRef"){
      inputHtml = `<input type="text" list="animal-tags-list" data-field="${f.key}" value="${esc(val)}" placeholder="Type a name, or pick a registered animal" />`;
    } else if(f.type==="employeeRef"){
      inputHtml = `<input type="text" list="employee-names-list" data-field="${f.key}" value="${esc(val)}" placeholder="Type or pick an employee" />`;
    } else if(f.suggestions && f.suggestions.length){
      const dlId = "dl-"+f.key;
      inputHtml = `<input type="text" list="${dlId}" data-field="${f.key}" value="${esc(val)}" />
        <datalist id="${dlId}">${f.suggestions.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
    } else {
      inputHtml = `<input type="${f.type}" data-field="${f.key}" value="${esc(val)}" />`;
    }
    const wideCls = (f.type==="textarea") ? " wide" : "";
    const showIfAttr = f.showIfType ? ` data-showif-type="${esc(f.showIfType)}"` : "";
    const hiddenStyle = (f.showIfType && f.showIfType!==currentAnimalType) ? ` style="display:none;"` : "";
    return `<div class="field-row${wideCls}"${showIfAttr}${hiddenStyle}><label>${esc(f.label)}${f.required?" *":""}</label>${inputHtml}</div>`;
  }).join("");

  const animalOptions = (DATA.animals||[]).map(a=>`<option value="${esc(a.tagId)}">`).join("");
  const employeeOptions = (DATA.employees||[]).map(e=>`<option value="${esc(e.name)}">`).join("");

  document.getElementById("modal").innerHTML = `
    <div class="modal-topbar">
      <button class="m-cancel" id="modal-cancel">✕ Close</button>
      <div class="m-title">${record?"Edit":"New"} ${esc(mod.label)}</div>
      <div style="width:60px;"></div>
    </div>
    <div id="modal-scroll">
      <div id="modal-fields">
        ${fieldsHtml}
        <div class="photo-section-label">Photos (<span id="photo-count">${MODAL_PHOTOS.length}</span>)</div>
        <div class="photo-grid" id="photo-grid"></div>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none" />
      </div>
    </div>
    <div id="modal-footer">
      <button id="modal-save-bottom" style="flex:1; background:var(--gradient-gold); color:#0A0806; border:none;
        border-radius:8px; padding:14px; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
        cursor:pointer;">✓ Save ${record?"Changes":"Entry"}</button>
      <button id="modal-cancel-bottom" style="flex:0 0 auto; background:none; color:var(--muted); border:1px solid var(--hair);
        border-radius:8px; padding:14px 18px; font-size:13px; font-weight:600; cursor:pointer;">Cancel</button>
    </div>
    <datalist id="animal-tags-list">${animalOptions}</datalist>
    <datalist id="employee-names-list">${employeeOptions}</datalist>
  `;
  renderPhotoGrid();
  document.getElementById("modal-cancel").addEventListener("click", closeModal);
  document.getElementById("modal-cancel-bottom").addEventListener("click", closeModal);
  document.getElementById("modal-save-bottom").addEventListener("click", ()=> saveModal(moduleId, record));
  // When "Type" changes, update any select whose option list depends on the
  // animal type (e.g. Breed), and show/hide any field that only applies to
  // a specific type (e.g. Skin Type for Buffalo).
  const animalTypeEl = document.querySelector('[data-field="animalType"]');
  if(animalTypeEl){
    animalTypeEl.addEventListener("change", ()=>{
      const newType = animalTypeEl.value;
      document.querySelectorAll("select[data-options-by-type]:not(.breed-cross-select)").forEach(sel=>{
        const byType = JSON.parse(sel.getAttribute("data-options-by-type"));
        const fallback = JSON.parse(sel.getAttribute("data-options-fallback"));
        const opts = byType[newType] || fallback;
        const prevVal = sel.value;
        sel.innerHTML = `<option value="">Select...</option>` + opts.map(o=>`<option value="${esc(o)}" ${prevVal===o?"selected":""}>${esc(o)}</option>`).join("");
        if(!opts.includes(prevVal)) sel.value = "";
      });
      document.querySelectorAll("[data-showif-type]").forEach(row=>{
        row.style.display = (row.getAttribute("data-showif-type")===newType) ? "" : "none";
      });
      refreshCrossBreedOptions(newType);
    });
  }
  // Crossbred picker: two dropdowns per field marked allowCross (currently
  // just Breed) that combine into one hidden input value, plus keeping their
  // option lists in step with the animal Type dropdown above.
  function refreshCrossBreedOptions(newType){
    document.querySelectorAll('input[type="hidden"][data-field]').forEach(hidden=>{
      const selA = hidden.parentElement.querySelector('.breed-cross-select[data-cross-role="a"]');
      const selB = hidden.parentElement.querySelector('.breed-cross-select[data-cross-role="b"]');
      if(!selA || !selB) return;
      const byType = JSON.parse(selA.getAttribute("data-options-by-type") || "null");
      const fallback = JSON.parse(selA.getAttribute("data-options-fallback") || "[]");
      const opts = (byType && byType[newType]) || fallback;
      [ [selA,"a","Select..."], [selB,"b","None — single breed"] ].forEach(([sel,,placeholder])=>{
        const prevVal = sel.value;
        sel.innerHTML = `<option value="">${placeholder}</option>` + opts.map(o=>`<option value="${esc(o)}" ${prevVal===o?"selected":""}>${esc(o)}</option>`).join("");
        if(!opts.includes(prevVal)) sel.value = "";
      });
      hidden.value = breedPartsToValue(selA.value, selB.value);
    });
  }
  document.querySelectorAll('.breed-cross-select[data-cross-role="a"]').forEach(selA=>{
    const wrapper = selA.parentElement;
    const hidden = wrapper.querySelector('input[type="hidden"][data-field]');
    const selB = wrapper.querySelector('.breed-cross-select[data-cross-role="b"]');
    const sync = ()=>{ hidden.value = breedPartsToValue(selA.value, selB.value); };
    selA.addEventListener("change", sync);
    selB.addEventListener("change", sync);
  });
  // Keep "Amount Unpaid" in sync with the relevant cost field minus "Amount
  // Paid", so the person doesn't have to do the subtraction themselves. Still
  // a normal editable field — this just pre-fills/updates it live.
  function wireAmountUnpaidAutoCalc(costFieldKey){
    const costEl = document.querySelector(`[data-field="${costFieldKey}"]`);
    const paidEl = document.querySelector('[data-field="amountPaid"]');
    const unpaidEl = document.querySelector('[data-field="amountUnpaid"]');
    if(!costEl || !paidEl || !unpaidEl) return;
    const recalc = ()=>{
      const cost = parseFloat(costEl.value);
      const paid = parseFloat(paidEl.value);
      if(!isNaN(cost) && !isNaN(paid)){
        const unpaid = cost - paid;
        unpaidEl.value = unpaid > 0 ? unpaid : 0;
      }
    };
    costEl.addEventListener("input", recalc);
    paidEl.addEventListener("input", recalc);
  }
  if(moduleId === "feedStock") wireAmountUnpaidAutoCalc("cost");
  if(moduleId === "purchases") wireAmountUnpaidAutoCalc("price");
  document.getElementById("modal-backdrop").classList.add("open");
  /* Lock the background page in place while the modal is open. Older
     mobile browsers can mis-render a "position:fixed" overlay if the
     page behind it is scrolled — the overlay can end up offset, showing
     lower than intended or cut off at the bottom. Pinning the body to
     the current scroll position (a well-established mobile-web fix)
     guarantees the modal always renders at the true top of the screen. */
  MODAL_SCROLL_Y = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = "fixed";
  document.body.style.top = (-MODAL_SCROLL_Y) + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
  setAppViewportHeight();
}
function renderPhotoGrid(){
  const grid = document.getElementById("photo-grid");
  let html = MODAL_PHOTOS.map((p,i)=>`
    <div class="photo-thumb"><img src="${p}" /><button class="rm" data-rmphoto="${i}">×</button></div>
  `).join("");
  html += `<button class="photo-add" id="photo-add-btn">+</button>`;
  grid.innerHTML = html;
  document.getElementById("photo-count").textContent = MODAL_PHOTOS.length;
  document.getElementById("photo-add-btn").addEventListener("click", ()=> document.getElementById("photo-input").click());
  grid.querySelectorAll("[data-rmphoto]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      MODAL_PHOTOS.splice(Number(btn.getAttribute("data-rmphoto")),1);
      renderPhotoGrid();
    });
  });
  document.getElementById("photo-input").onchange = async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      try{ const dataUrl = await compressImage(file); MODAL_PHOTOS.push(dataUrl); }catch(err){}
    }
    renderPhotoGrid();
  };
}
function closeModal(){
  document.getElementById("modal-backdrop").classList.remove("open");
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.width = "";
  window.scrollTo(0, MODAL_SCROLL_Y || 0);
}
async function saveModal(moduleId, record){
  const mod = moduleById(moduleId);
  const recId = record ? record.id : uid();
  const form = {};
  let missingField = null;
  mod.fields.forEach(f=>{
    const el = document.querySelector(`[data-field="${f.key}"]`);
    form[f.key] = el ? el.value : "";
    if(f.required && !form[f.key]) missingField = f.label;
  });
  if(missingField){ alert(missingField + " is required."); return; }

  if(moduleId === "animals" && !record){
    const dup = (DATA.animals||[]).find(a=> (a.tagId||"").trim().toLowerCase() === (form.tagId||"").trim().toLowerCase());
    if(dup){
      const proceed = confirm(`An animal named "${form.tagId}" already exists (${dup.animalType||"animal"}, ${dup.breed||""}). Save this as a separate animal anyway?`);
      if(!proceed) return;
    }
  }

  // Keep every linked record in sync if an animal's Name/ID is renamed —
  // otherwise its purchase, sale, breeding, calving, medical, weight, and milk
  // history would silently detach from it (matched by exact tag text).
  if(moduleId === "animals" && record && record.tagId && form.tagId && record.tagId.trim() !== form.tagId.trim()){
    const oldTag = record.tagId.trim().toLowerCase();
    const newTag = form.tagId.trim();
    const relinkFields = [
      ["purchases","animalTag"], ["sales","animalTag"], ["medical","animalTag"],
      ["weight","animalTag"], ["height","animalTag"], ["teeth","animalTag"], ["milk","animalTag"], ["breeding","femaleTag"],
    ];
    relinkFields.forEach(([mId,key])=>{
      let changed = false;
      (DATA[mId]||[]).forEach(r=>{
        if((r[key]||"").trim().toLowerCase() === oldTag){ r[key] = newTag; changed = true; }
      });
      if(changed) saveModule(mId);
    });
    let calvingChanged = false;
    (DATA.calving||[]).forEach(c=>{
      if((c.motherTag||"").trim().toLowerCase() === oldTag){ c.motherTag = newTag; calvingChanged = true; }
      if((c.calfTag||"").trim().toLowerCase() === oldTag){ c.calfTag = newTag; calvingChanged = true; }
    });
    if(calvingChanged) saveModule("calving");
  }

  // Same idea for employees — a renamed employee should stay linked to their salary log and tasks.
  if(moduleId === "employees" && record && record.name && form.name && record.name.trim() !== form.name.trim()){
    const oldName = record.name.trim().toLowerCase();
    const newName = form.name.trim();
    let changed = false;
    (DATA.salary||[]).forEach(s=>{
      if((s.employeeName||"").trim().toLowerCase() === oldName){ s.employeeName = newName; changed = true; }
    });
    if(changed) saveModule("salary");
    let tasksChanged = false;
    (DATA.tasks||[]).forEach(t=>{
      if((t.assignedTo||"").trim().toLowerCase() === oldName){ t.assignedTo = newName; tasksChanged = true; }
    });
    if(tasksChanged) saveModule("tasks");
  }

  if(moduleId === "breeding" && !form.expectedCalvingDate && form.date && form.femaleTag){
    const animal = (DATA.animals||[]).find(a=>a.tagId===form.femaleTag);
    const gestationDays = (animal && animal.animalType === "Buffalo") ? 310 : 283;
    const serviceDate = new Date(form.date);
    if(!isNaN(serviceDate.getTime())){
      const due = new Date(serviceDate.getTime() + gestationDays*24*60*60*1000);
      form.expectedCalvingDate = due.toISOString().slice(0,10);
    }
  }

  // If an existing sale's animal tag is changed, un-mark the old animal (revert to Active)
  // as long as no other sale still references it — keeps "Sold" status mathematically accurate.
  if(moduleId === "sales" && record){
    const oldTag = (record.animalTag||"").trim().toLowerCase();
    const newTag = (form.animalTag||"").trim().toLowerCase();
    if(oldTag && oldTag !== newTag){
      const stillReferenced = (DATA.sales||[]).some(s=> s.id!==recId && (s.animalTag||"").trim().toLowerCase()===oldTag);
      if(!stillReferenced){
        const oldIdx = (DATA.animals||[]).findIndex(a=>(a.tagId||"").trim().toLowerCase()===oldTag);
        if(oldIdx>=0 && DATA.animals[oldIdx].status==="Sold"){
          DATA.animals[oldIdx].status = "Active";
          saveModule("animals");
        }
      }
    }
  }

  let saleAutoCreatedAnimalTag = "";
  if(moduleId === "sales" && form.animalTag && form.animalTag.trim()){
    const cleanTag = form.animalTag.trim();
    const animalIdx = (DATA.animals||[]).findIndex(a=>(a.tagId||"").trim().toLowerCase() === cleanTag.toLowerCase());
    if(animalIdx===-1){
      // No matching animal on record — auto-add it as Sold so the sale has something to point to.
      DATA.animals = DATA.animals || [];
      DATA.animals.push({
        id: uid(), createdAt: new Date().toISOString(),
        tagId: cleanTag, animalType:"", breed:"", gender:"", dob:"", color:"",
        source:"", status:"Sold", notes:"",
        photos: MODAL_PHOTOS.slice(),
        autoAdded: true, autoAddedFromSaleId: recId
      });
      saveModule("animals");
      saleAutoCreatedAnimalTag = cleanTag;
    } else if(DATA.animals[animalIdx].status !== "Sold"){
      DATA.animals[animalIdx].status = "Sold";
      saveModule("animals");
    }
  }

  // Same idea for purchases: if the auto-added animal this purchase created gets renamed,
  // rename the linked animal record too instead of leaving a stale, unreferenced tag behind.
  if(moduleId === "purchases" && record){
    const autoAnimalIdx = (DATA.animals||[]).findIndex(a=>a.autoAdded && a.autoAddedFromPurchaseId===recId);
    const newTag = (form.animalTag||"").trim();
    if(autoAnimalIdx>=0 && newTag && DATA.animals[autoAnimalIdx].tagId.trim() !== newTag){
      DATA.animals[autoAnimalIdx].tagId = newTag;
      saveModule("animals");
    }
  }

  if(moduleId === "purchases" && form.animalTag && form.animalTag.trim()){
    const cleanTag = form.animalTag.trim();
    const animalIdx = (DATA.animals||[]).findIndex(a=>(a.tagId||"").trim().toLowerCase() === cleanTag.toLowerCase());
    if(animalIdx===-1){
      // No matching animal yet — auto-add it to the herd registry as Active.
      DATA.animals = DATA.animals || [];
      DATA.animals.push({
        id: uid(), createdAt: new Date().toISOString(),
        tagId: cleanTag, animalType: form.animalType||"", breed:"", gender:"", dob:"", color:"",
        source:"Purchased", status:"Active", notes:"",
        photos: MODAL_PHOTOS.slice(),
        autoAdded: true, autoAddedFromPurchaseId: recId
      });
      saveModule("animals");
    } else if(!DATA.animals[animalIdx].status){
      DATA.animals[animalIdx].status = "Active";
      saveModule("animals");
    }
  }

  // Whenever a purchase carries a Transport Cost, mirror it into the Transport module so
  // it shows up there too — kept as one linked entry per purchase, updated in place on edit.
  if(moduleId === "purchases"){
    DATA.transport = DATA.transport || [];
    const linkedIdx = DATA.transport.findIndex(t=>t.autoAdded && t.autoAddedFromPurchaseId===recId);
    const cost = toNum(form.transportCost);
    if(cost > 0){
      const tagLabel = (form.animalTag||"").trim();
      if(linkedIdx>=0){
        DATA.transport[linkedIdx].date = form.date || DATA.transport[linkedIdx].date;
        DATA.transport[linkedIdx].cost = form.transportCost;
        DATA.transport[linkedIdx].fromLocation = form.sellerName || DATA.transport[linkedIdx].fromLocation;
        DATA.transport[linkedIdx].notes = tagLabel ? `Auto-linked to purchase of ${tagLabel}` : "Auto-linked to purchase";
      } else {
        DATA.transport.push({
          id: uid(), createdAt: new Date().toISOString(),
          date: form.date || "", purpose:"Purchase Pickup",
          fromLocation: form.sellerName||"", toLocation:"Farm",
          vehicleNumber:"", driverName:"", driverContact:"",
          animalsCount: tagLabel ? "1" : "",
          cost: form.transportCost,
          notes: tagLabel ? `Auto-linked to purchase of ${tagLabel}` : "Auto-linked to purchase",
          autoAdded: true, autoAddedFromPurchaseId: recId
        });
      }
      saveModule("transport");
    } else if(linkedIdx>=0){
      // Transport cost cleared on the purchase — drop the mirrored entry so totals stay accurate.
      DATA.transport = DATA.transport.filter(t=>!(t.autoAdded && t.autoAddedFromPurchaseId===recId));
      saveModule("transport");
    }
  }

  // Whenever a Medicine record uses an Ivermectin Injection, it belongs in the Deworming
  // module instead — Ivermectin is a dewormer, so this routes it there (with the same photos
  // and details captured on the form) rather than keeping a duplicate in Medicine too. Kept as
  // one linked entry per medical record, updated in place on edit, and moved back into Medicine
  // automatically if the medicine used is changed away from it.
  let routeToDewormingOnly = false;
  if(moduleId === "medical"){
    DATA.deworming = DATA.deworming || [];
    const linkedDewormIdx = DATA.deworming.findIndex(d=>d.autoAdded && d.autoAddedFromMedicalId===recId);
    if(form.medicineUsed === "Ivermectin Injection"){
      routeToDewormingOnly = true;
      // Carry over everything captured on the Medicine form that has a home in the
      // Deworming record, plus the original condition/notes so nothing typed is lost.
      let carriedNotes = "Auto-linked from Medicine record (Ivermectin Injection)";
      const extraBits = [];
      if((form.condition||"").trim()) extraBits.push(`Reason: ${form.condition.trim()}`);
      if((form.notes||"").trim()) extraBits.push(form.notes.trim());
      if(extraBits.length) carriedNotes += " — " + extraBits.join(" · ");
      if(linkedDewormIdx>=0){
        DATA.deworming[linkedDewormIdx].date = form.date || DATA.deworming[linkedDewormIdx].date;
        DATA.deworming[linkedDewormIdx].animalTag = form.animalTag || DATA.deworming[linkedDewormIdx].animalTag;
        DATA.deworming[linkedDewormIdx].dewormerUsed = "Ivermectin";
        DATA.deworming[linkedDewormIdx].dosage = form.dosage || DATA.deworming[linkedDewormIdx].dosage;
        DATA.deworming[linkedDewormIdx].administeredBy = form.vetName || DATA.deworming[linkedDewormIdx].administeredBy;
        DATA.deworming[linkedDewormIdx].cost = form.cost || DATA.deworming[linkedDewormIdx].cost;
        DATA.deworming[linkedDewormIdx].nextDueDate = form.followUpDate || DATA.deworming[linkedDewormIdx].nextDueDate;
        DATA.deworming[linkedDewormIdx].notes = carriedNotes;
        DATA.deworming[linkedDewormIdx].photos = MODAL_PHOTOS.slice();
      } else {
        DATA.deworming.push({
          id: uid(), createdAt: new Date().toISOString(),
          date: form.date||"", animalTag: form.animalTag||"",
          dewormerUsed: "Ivermectin", dosage: form.dosage||"",
          administeredBy: form.vetName||"", cost: form.cost||"", nextDueDate: form.followUpDate||"",
          notes: carriedNotes,
          photos: MODAL_PHOTOS.slice(),
          autoAdded: true, autoAddedFromMedicalId: recId
        });
      }
      saveModule("deworming");
    } else if(linkedDewormIdx>=0){
      // Medicine used was changed away from Ivermectin Injection — drop the mirrored entry
      // and let the record fall through to being saved in Medicine as normal below.
      DATA.deworming = DATA.deworming.filter(d=>!(d.autoAdded && d.autoAddedFromMedicalId===recId));
      saveModule("deworming");
    }
  }

  const rec = { id: recId, createdAt: record ? record.createdAt : new Date().toISOString(), ...form, photos: MODAL_PHOTOS.slice() };
  if(!DATA[moduleId]) DATA[moduleId] = [];
  if(routeToDewormingOnly){
    // This entry now lives only in Deworming — make sure no copy (or stale prior-edit
    // copy) is left behind in the Medicine module.
    DATA[moduleId] = DATA[moduleId].filter(r=> r.id !== rec.id);
  } else if(record){ DATA[moduleId] = DATA[moduleId].map(r=> r.id===rec.id ? rec : r); }
  else { DATA[moduleId].push(rec); }

  let saved = await saveModule(moduleId, true);
  let wasQuotaRecovered = false;
  if(!saved){
    // Storage is full. Rather than just failing with an alert and leaving the
    // person to hunt for a fix, offer to compress everything already saved
    // right here and retry immediately — that's almost always enough to free
    // the little bit of room a single new entry needs.
    const wantsCompress = confirm(
      "Could not save — storage is full.\n\n" +
      "Tap OK to automatically compress your saved photos and free up space, " +
      "then this entry will be saved right away.\n\n" +
      "Tap Cancel to go back without saving (nothing will be lost — just reopen this entry to try again)."
    );
    if(wantsCompress){
      await compressAllStoredPhotos();
      saved = await saveModule(moduleId, true);
      wasQuotaRecovered = saved;
      if(!saved){
        alert("Still couldn't save even after compressing photos — storage is genuinely full. Please back up your data (Backup Data on the dashboard) and consider removing some old records.");
      }
    }
    if(!saved){
      // Roll back the in-memory change so the screen doesn't show data that
      // was never actually persisted — reloading would otherwise silently
      // lose it and the person would have no way to know.
      if(routeToDewormingOnly){
        // rec.id was routed to Deworming, not pushed/updated into DATA[moduleId] — only
        // put back the original Medicine record if one existed there before this edit.
        if(record){
          const idx = DATA[moduleId].findIndex(r=> r.id===rec.id);
          if(idx>=0){ DATA[moduleId][idx] = record; } else { DATA[moduleId].push(record); }
        }
      } else if(record){ DATA[moduleId] = DATA[moduleId].map(r=> r.id===rec.id ? record : r); }
      else { DATA[moduleId] = DATA[moduleId].filter(r=> r.id !== rec.id); }
      return;
    }
  }

  closeModal();
  render();
  if(saleAutoCreatedAnimalTag){
    showToast(`No animal matched "${saleAutoCreatedAnimalTag}" — added it as a new Sold animal instead`);
  } else if(routeToDewormingOnly){
    showToast(saved && wasQuotaRecovered ? "Freed up space and saved to Deworming" : (record ? "Changes saved to Deworming" : "Entry added to Deworming"));
  } else {
    showToast(saved && wasQuotaRecovered ? "Freed up space and saved" : (record ? "Changes saved" : "Entry added"));
  }
}

/* ============================== BACKUP / RESTORE ============================== */
function csvEscape(val){
  if(val===undefined||val===null) return "";
  const s = String(val);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
// Printable view of every module's records in one place, built from the
// same field definitions as the rest of the app so it always matches
// whatever's actually stored. Uses the same record-card / label-value
// layout as the on-screen lists (rather than one wide table per module) —
// modules here have up to a dozen fields each, which squeezed into table
// columns on an A4 page becomes unreadably narrow; a stacked card per
// record stays legible no matter how many fields a module has.
function renderPrintAllData(){
  const hasAny = MODULES.some(m=>(DATA[m.id]||[]).length>0);
  const sectionsHtml = MODULES.map(m=>{
    const records = [...(DATA[m.id]||[])].sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
    const primaryField = m.fields[0];
    const restFields = m.fields.slice(1);
    const cardsHtml = records.length ? records.map(r=>{
      const primaryVal = r[primaryField.key];
      const fieldsHtml = restFields
        .filter(f=> r[f.key] !== undefined && r[f.key] !== null && r[f.key] !== "")
        .map(f=> `<div style="margin-top:4px;"><span class="f-label">${esc(f.label)}: </span><span class="f-val">${esc(r[f.key])}</span></div>`)
        .join("");
      return `
      <div class="record-card" style="margin-bottom:12px;">
        <div class="rc-body" style="margin-right:0;">
          <div class="rc-id">${esc(primaryVal) || "—"}</div>
          <div class="rc-fields" style="flex-direction:column; gap:0;">${fieldsHtml || `<div class="f-val">No further details</div>`}</div>
        </div>
      </div>`;
    }).join("") : `<div class="empty-note">No ${esc(m.label).toLowerCase()} records</div>`;
    return `
    <div class="eyebrow" style="margin:0 20px 10px;">${esc(m.label)} (${records.length})</div>
    <div style="margin:0 20px 24px;">${cardsHtml}</div>`;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="module-hero">
      <div class="m-eyebrow">All Modules · S.Z. Dairy Farm</div>
      <h1 class="serif">Print All Data</h1>
      <div class="m-rule"></div>
    </div>
    <div class="no-print" style="padding:0 20px 20px;">
      <button id="print-all-btn" style="width:100%;background:var(--gradient-gold);border:none;color:#0A0806;
        border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;">🖨️ Print</button>
      ${!hasAny ? `<div class="footnote" style="margin-top:14px;">No records yet — add some data first and it'll show up here.</div>` : ""}
    </div>
    ${sectionsHtml}
  `;
  document.getElementById("print-all-btn").addEventListener("click", ()=> window.print());
}

function exportModuleCSV(moduleId){
  const mod = moduleById(moduleId);
  const records = DATA[moduleId] || [];
  if(records.length===0){ alert("No records to export yet."); return; }
  const headers = mod.fields.map(f=>f.label);
  const keys = mod.fields.map(f=>f.key);
  let csv = headers.map(csvEscape).join(",") + "\n";
  const sorted = [...records].sort((a,b)=> (a.createdAt||"").localeCompare(b.createdAt||""));
  sorted.forEach(r=>{
    csv += keys.map(k=>csvEscape(r[k])).join(",") + "\n";
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sz-" + moduleId + "-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast("CSV downloaded");
}

// Print-friendly stand-in for "export the active-animal CSV": forces the
// Animals list onto the Active filter (so what's on screen — and therefore
// what prints — matches the active herd), then opens the browser's print
// dialog. The existing print stylesheet already hides buttons/search/filter
// chips and shows the S.Z. Dairy Farm letterhead (with logo) at the top.
function printActiveAnimals(){
  FILTERS.animals = "Active";
  SEARCH.animals = "";
  renderModuleList("animals");
  setTimeout(()=> window.print(), 50);
}

function handleExport(){
  const payload = { exportedAt: new Date().toISOString(), data: DATA };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sz-dairy-farm-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  localStorage.setItem("lastBackupAt", new Date().toISOString());
  localStorage.removeItem("backupReminderDismissedAt");
  showToast("Backup downloaded");
  if(CURRENT === "home") render();
}
function handleImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const incoming = parsed.data || parsed;
      if(!confirm("This will replace your current data with the backup file. Continue?")) return;
      MODULES.forEach(m=>{ DATA[m.id] = incoming[m.id] || []; saveModule(m.id); });
      render();
      showToast("Backup restored");
    }catch(err){ alert("Could not read that file — make sure it's a valid S.Z. Dairy Farm backup."); }
  };
  reader.readAsText(file);
}

/* ===================== REAL VIEWPORT HEIGHT FIX =====================
   Mobile/tablet browsers resize their visible viewport when the address
   bar or the on-screen keyboard shows/hides, but plain CSS "vh" units
   are notoriously unreliable across devices — they can keep sizing the
   modal against the *full* screen even when a toolbar or keyboard is
   covering part of it. That leaves the Save/Cancel footer (or the last
   fields) rendered off-screen with no way to scroll to them.
   Fix: measure the real visible height in JS (using visualViewport when
   available, since that tracks the keyboard too) and drive all "vh"-style
   sizing in the CSS off this value instead. */
function setAppViewportHeight(){
  var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty("--app-vh", (h * 0.01) + "px");
}
setAppViewportHeight();
window.addEventListener("resize", setAppViewportHeight);
window.addEventListener("resize", function(){
  if(CURRENT === "gallery") renderGallery();
  else if(CURRENT === "showcase") renderShowcase();
});
window.addEventListener("orientationchange", function(){ setTimeout(setAppViewportHeight, 250); });
if(window.visualViewport){ window.visualViewport.addEventListener("resize", setAppViewportHeight); }

/* Delegated listener for any navigation button/card anywhere in the app
   (data-goto="<screenId>"). Same reasoning as the quickadd listener below —
   one shared listener means these work regardless of which screen they're
   rendered on, including new ones like the Profile screen's certificate
   button, instead of quietly doing nothing because that screen never bound
   its own copy of the listener. */
document.addEventListener("click", function(e){
  var el = e.target.closest && e.target.closest("[data-goto]");
  if(!el) return;
  goTo(el.getAttribute("data-goto"));
});

/* Delegated listener for any "+ Add" quick-action button anywhere in the app
   (data-quickadd="<moduleId>", optional data-quickprefill="<json>"). Using a
   single listener on document — instead of re-binding one per screen render —
   means a button works correctly no matter which screen it's rendered on,
   including ones added after the fact like the dashboard's "Add Additional
   Cost" button. */
document.addEventListener("click", function(e){
  var el = e.target.closest && e.target.closest("[data-quickadd]");
  if(!el) return;
  const modId = el.getAttribute("data-quickadd");
  let prefill = {};
  try{ prefill = JSON.parse(el.getAttribute("data-quickprefill")||"{}"); }catch(err){}
  openModal(modId, null, prefill);
});

/* Delegated listener for the "Total Expenses" stat-card — shows what actually
   makes up that number instead of leaving it as one opaque total. */
document.addEventListener("click", function(e){
  var el = e.target.closest && e.target.closest("[data-expense-breakdown]");
  if(!el) return;
  openExpenseBreakdown();
});
// Shared by the dashboard's "Total Expenses" popup and the printable
// Financial Report, so the two can never show different numbers.
function computeExpenseBreakdown(){
  const rows = [
    ["Animal Purchases", (DATA.purchases||[]).reduce((s,r)=>s+(Number(r.price)||0),0)],
    ["Purchase Additional Costs", (DATA.purchases||[]).reduce((s,r)=>s+(Number(r.additionalCost)||0),0)],
    ["Transport", (DATA.transport||[]).reduce((s,r)=>s+(Number(r.cost)||0),0)],
    ["Medical Treatment", (DATA.medical||[]).reduce((s,r)=>s+(Number(r.cost)||0),0)],
    ["Medicine Stock", (DATA.medStock||[]).reduce((s,r)=>s+(Number(r.cost)||0),0)],
    ["Feed Stock", (DATA.feedStock||[]).reduce((s,r)=>s+(Number(r.cost)||0),0)],
    ["Salary Paid", (DATA.salary||[]).filter(s=>s.status==="Paid").reduce((s,r)=>s+(Number(r.amount)||0),0)],
    ["Additional Costs", (DATA.otherExpenses||[]).reduce((s,r)=>s+(Number(r.amount)||0),0)],
  ];
  const total = rows.reduce((s,r)=>s+r[1],0);
  return { rows, total };
}
function openExpenseBreakdown(){
  const { rows, total } = computeExpenseBreakdown();
  const body = document.getElementById("expense-breakdown-body");
  body.innerHTML = rows.map(([label,val])=>
    `<div class="expense-row"><span class="exp-label">${esc(label)}</span><span class="exp-value">${val.toLocaleString("en-IN")}</span></div>`
  ).join("") + `<div class="expense-row exp-total"><span class="exp-label">Total Expenses</span><span class="exp-value">${total.toLocaleString("en-IN")}</span></div>`;
  document.getElementById("expense-breakdown-backdrop").classList.add("open");
}
document.getElementById("expense-breakdown-close").addEventListener("click", ()=>{
  document.getElementById("expense-breakdown-backdrop").classList.remove("open");
});

/* Belt-and-suspenders: when a field inside the modal gets focus (i.e. the
   on-screen keyboard is about to appear), make sure that field — and the
   Save button — actually scroll into view instead of staying hidden. */
/* Fill in today's date on the print-only header right before the browser's
   print dialog opens, so a printed page is dated no matter which screen
   (or which "Print" trigger) it came from. */
window.addEventListener("beforeprint", function(){
  const el = document.getElementById("print-date");
  if(el) el.textContent = formatDateDMY(new Date().toISOString().slice(0,10));
  const logoEl = document.getElementById("print-header-logo");
  if(logoEl && !logoEl.src) logoEl.src = LOGO_SRC;
});

document.addEventListener("focusin", function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  if(!t.closest("#modal")) return;
  if(["INPUT","SELECT","TEXTAREA"].indexOf(t.tagName) === -1) return;
  setTimeout(function(){
    setAppViewportHeight();
    t.scrollIntoView({ block:"center", behavior:"smooth" });
  }, 300);
});

/* ============================== INIT ============================== */
// If either the owner or the Showcase password is set, show the lock
// screen first and hold off loading/rendering the farm data until it's
// unlocked — attemptUnlock() decides, based on which password matched,
// whether to land on the dashboard or on the locked-down Showcase.
// Otherwise start the app immediately, same as before this feature existed.
if(hasAnyPassword()){
  showLockScreen();
} else {
  loadAll().then(render);
}
