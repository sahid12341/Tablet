// ---- IndexedDB storage layer -------------------------------------------
// localStorage caps out around 5MB total per site on most browsers (often
// less on older Android WebViews), and photos fill that up fast. IndexedDB
// on the same devices typically allows anywhere from tens of MB up to a
// large share of free disk space — commonly 100x+ more headroom — so all
// farm-record data now lives there instead. The one-time migration below
// pulls any existing data out of localStorage the first time the app loads
// after this change, then clears it from localStorage to reclaim that space.
const IDB_NAME = "sz_dairy_farm_db";
const IDB_STORE = "modules";
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB unavailable")); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
    tx.onabort = ()=> reject(tx.error);
  }));
}

async function loadAll(){
  for(const m of MODULES){
    const key = "sz_"+m.id;
    try{
      let value = await idbGet(key);
      if(value === undefined){
        // Not in IndexedDB yet — check the old localStorage location and
        // migrate it over automatically, then free that localStorage space.
        const raw = localStorage.getItem(key);
        value = raw ? JSON.parse(raw) : [];
        if(raw){
          await idbSet(key, value);
          localStorage.removeItem(key);
        }
      }
      DATA[m.id] = value || [];
    }catch(e){
      DATA[m.id] = DATA[m.id] || [];
    }
  }
  // Farm-level contact info and story shown on the customer Showcase — a
  // single object, not a per-record module, so it's loaded separately.
  try{
    let fp = await idbGet("sz_farmProfile");
    if(fp === undefined){
      const raw = localStorage.getItem("sz_farmProfile");
      fp = raw ? JSON.parse(raw) : null;
      if(raw){ await idbSet("sz_farmProfile", fp); localStorage.removeItem("sz_farmProfile"); }
    }
    DATA.farmProfile = fp || { phone:"", whatsapp:"", address:"", story:"" };
  }catch(e){
    DATA.farmProfile = DATA.farmProfile || { phone:"", whatsapp:"", address:"", story:"" };
  }
  refreshStorageEstimate();
}
function saveFarmProfile(){
  return idbSet("sz_farmProfile", DATA.farmProfile || {})
    .then(()=>{ refreshStorageEstimate(); return true; })
    .catch(()=>{
      alert("Could not save — storage is full.\n\nGo to the dashboard and tap \"Free Up Space (Compress Photos)\", then try saving this again.");
      return false;
    });
}

function saveModule(moduleId, silent){

    .then(()=>{ refreshStorageEstimate(); return true; })

      return false;
    });
}

// Live estimate of real device storage used/available (IndexedDB-backed
// storage typically shares a much larger quota than the old localStorage
// jail). Cached in STORAGE_INFO and refreshed after loads/saves so render()
// can read it synchronously.
let STORAGE_INFO = { usedKB: 0, quotaKB: null, pct: null };
async function refreshStorageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      STORAGE_INFO = {
        usedKB: Math.round((est.usage||0)/1024),
        quotaKB: est.quota ? Math.round(est.quota/1024) : null,
        pct: est.quota ? (est.usage||0)/est.quota : null
      };
    } else {
      STORAGE_INFO = { usedKB: storageUsedKB(), quotaKB: null, pct: null };
    }
  }catch(e){ /* leave last-known estimate in place */ }
}
// Size (in KB) of the farm data itself (mainly photos), independent of the
// device's total storage quota — used for the "Local storage used" footnote.
function storageUsedKB(){
  let total = 0;
  MODULES.forEach(m=>{ const v = DATA[m.id]; if(v) total += JSON.stringify(v).length; });
  return Math.round(total/1024);
}
// Re-compresses a photo that's ALREADY stored as a data URL — used by "Free
// Up Space" to shrink photos that were saved before compression was added,
// or that came in from a Restore Data file from an older version of the app.
// Only ever keeps the result if it's actually smaller; a photo that's
// already small/simple (e.g. a plain color swatch) is left untouched rather
// than risking making it bigger.
// Photos only ever get shown as small thumbnails in this app (record cards,
// herd grid, certificates) or, at most, in the photo lightbox — nothing here
// needs anywhere near full-resolution detail. This tablet's browser caps
// total on-device storage at only a few MB, and photos are what fill it, so
// compression is tuned deliberately aggressive: 550px / 40% quality keeps
// photos clearly recognizable while using a fraction of the space of a
// "normal" web-quality compression setting.
function compressDataUrl(dataUrl, maxDim, quality){
  maxDim = maxDim || 550; quality = quality || 0.40;
  return new Promise((resolve)=>{
    if(!dataUrl || typeof dataUrl !== "string" || dataUrl.indexOf("data:image") !== 0){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const compressed = canvas.toDataURL("image/jpeg", quality);
      resolve(compressed.length < dataUrl.length ? compressed : dataUrl);
    };
    img.onerror = ()=> resolve(dataUrl); // leave it exactly as-is if it can't be decoded
    img.src = dataUrl;
  });
}

// The actual compression work, usable both from the dashboard's "Free Up
// Space" button (which reports back with an alert) and automatically from
// inside a failed save (which needs to work quietly, then retry the save).
async function compressAllStoredPhotos(){
  let beforeTotal = 0, afterTotal = 0, photosChanged = 0, photosSeen = 0;
  for(const m of MODULES){
    const records = DATA[m.id] || [];
    let moduleChanged = false;
    for(const r of records){
      if(!r.photos || !r.photos.length) continue;
      for(let i=0;i<r.photos.length;i++){
        const original = r.photos[i];
        if(!original) continue;
        photosSeen++;
        beforeTotal += original.length;
        const smaller = await compressDataUrl(original);
        if(smaller !== original){
          r.photos[i] = smaller;
          moduleChanged = true;
          photosChanged++;
        }
        afterTotal += r.photos[i].length;
      }
    }
    if(moduleChanged) await saveModule(m.id);
  }
  return { beforeTotal, afterTotal, photosChanged, photosSeen };
}

async function freeUpSpace(){
  const btn = document.getElementById("row-free-space");
  const originalLabel = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<span class="dg">⏳</span> Compressing photos… please wait`;

  const { beforeTotal, afterTotal, photosChanged, photosSeen } = await compressAllStoredPhotos();

  btn.disabled = false;
  btn.innerHTML = originalLabel;

  const savedKB = Math.max(0, Math.round((beforeTotal - afterTotal) / 1024));
  if(photosSeen === 0){
    alert("No photos found to compress.");
  } else if(photosChanged === 0){
    alert(`Checked ${photosSeen} photo${photosSeen===1?"":"s"} — they're already as small as they can reasonably get.`);
  } else {
    alert(`Compressed ${photosChanged} of ${photosSeen} photos and freed about ${savedKB} KB. Try saving your entry again.`);
  }
  render();
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 550; quality = quality || 0.40;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showToast(msg){

let CERT_RETURN_SCREEN = "home"; // remembers where "Generate Certificate" / a Showcase photo was opened from
function goTo(screen){
  // Hard gate: once unlocked via the Showcase password, the only reachable
  // screens are the Showcase itself and certificates opened from it. Any
  // other destination (dashboard, animal records, sales, settings, etc.)
  // is silently refused — there is no code path back to the owner's side
  // of the app without relocking and entering the owner password.
  if(SHOWCASE_ONLY_MODE){
    const allowed = screen === "showcase" || screen.indexOf("certificate::") === 0 || screen.indexOf("showcase-detail::") === 0;
    if(!allowed) return;
  }
  if(screen.indexOf("certificate::")===0 && CURRENT.indexOf("certificate::")!==0){
    CERT_RETURN_SCREEN = CURRENT;
  }
  CURRENT = screen;
  const isProfile = screen.indexOf("profile::")===0;
  const isCertificate = screen.indexOf("certificate::")===0;
  const isReceipt = screen.indexOf("receipt::")===0;
  const isCustomer = screen.indexOf("customer::")===0;
  const isPurchase = screen.indexOf("purchase::")===0;
  const isSale = screen.indexOf("sale::")===0;
  const isShowcaseDetail = screen.indexOf("showcase-detail::")===0;
  document.getElementById("back-btn").style.display =
    (screen==="home" || (SHOWCASE_ONLY_MODE && screen==="showcase")) ? "none" : "flex";
  document.getElementById("tb-relock").style.display = SHOWCASE_ONLY_MODE ? "flex" : "none";
  document.getElementById("tb-add").style.display = (MODULES.some(m=>m.id===screen)) ? "block" : "none";
  document.getElementById("tb-title").innerHTML = (screen==="home") ? `S.Z. <span class="light">Dairy Farm</span>`
    : isProfile ? `<span>${esc(screen.split("::")[1])}</span>`
    : isCertificate ? `<span>Certificate</span>`
    : isShowcaseDetail ? `<span>${esc(screen.split("::")[1])}</span>`
    : isReceipt ? `<span>Receipt</span>`
    : isCustomer ? `<span>${esc(screen.split("::")[1])}</span>`
    : isPurchase ? `<span>Purchase Details</span>`
    : isSale ? `<span>Sale Details</span>`
    : screen==="customers" ? `<span>Customers</span>`
    : screen==="gallery" ? `<span>Photo Gallery</span>`
    : screen==="financial-report" ? `<span>Financial Report</span>`
    : screen==="print-all-data" ? `<span>Print All Data</span>`
    : screen==="showcase" ? (SHOWCASE_ONLY_MODE ? `S.Z. <span class="light">Dairy Farm</span>` : `<span>Showcase</span>`)
    : `<span>${esc(moduleById(screen).label)}</span>`;
  render();
  window.scrollTo(0,0);
}
document.getElementById("back-btn").addEventListener("click", ()=>{
  if(CURRENT.indexOf("profile::")===0) goTo("animals");
  else if(CURRENT.indexOf("certificate::")===0) goTo(CERT_RETURN_SCREEN);
  else if(CURRENT.indexOf("showcase-detail::")===0) goTo("showcase");
  else if(CURRENT.indexOf("receipt::")===0) goTo("sales");
  else if(CURRENT.indexOf("customer::")===0) goTo("customers");
  else if(CURRENT.indexOf("purchase::")===0) goTo("purchases");
  else if(CURRENT.indexOf("sale::")===0) goTo("sales");
  else if(!SHOWCASE_ONLY_MODE) goTo("home");
});
document.getElementById("tb-add").addEventListener("click", ()=>{ if(MODULES.some(m=>m.id===CURRENT)) openModal(CURRENT, null); });

function render(){
  document.body.classList.toggle("has-doc-header",
    CURRENT.indexOf("certificate::")===0 || CURRENT.indexOf("receipt::")===0);
  if(CURRENT === "home") renderHome();
  else if(CURRENT === "gallery") renderGallery();
  else if(CURRENT === "financial-report") renderFinancialReport();
  else if(CURRENT === "print-all-data") renderPrintAllData();
  else if(CURRENT === "showcase") renderShowcase();
  else if(CURRENT.indexOf("showcase-detail::")===0) renderShowcaseAnimalDetail(CURRENT.split("::")[1]);
  else if(CURRENT === "customers") renderCustomers();
  else if(CURRENT.indexOf("profile::")===0) renderAnimalProfile(CURRENT.split("::")[1]);
  else if(CURRENT.indexOf("certificate::")===0) renderCertificate(CURRENT.split("::")[1]);

  else if(CURRENT.indexOf("purchase::")===0) renderPurchaseDetail(CURRENT.split("::")[1]);

}

/* ============================== CUSTOMERS ============================== */
// Customers aren't a real module with their own records — they're derived by
// grouping the buyer name already on every Sale. Grouped by a normalized
// (trimmed, lowercased) key so "Ravi Patil" and " ravi patil " count as the
// same person, while still displaying whichever exact spelling was typed
// most recently.
function computeCustomers(){
  const groups = {};
  [...(DATA.sales||[])].sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(s=>{
    const raw = (s.buyerName||"").trim();
    if(!raw) return;
    const key = raw.toLowerCase();
    if(!groups[key]) groups[key] = { key, name: raw, contact:"", totalSpent:0, purchaseCount:0, firstDate:s.date, lastDate:s.date, sales:[] };
    const g = groups[key];
    g.name = raw; // keep the most recently-typed spelling/casing
    if(s.buyerContact) g.contact = s.buyerContact;
    g.totalSpent += Number(s.price)||0;
    g.purchaseCount += 1;
    if(!g.firstDate || (s.date||"") < g.firstDate) g.firstDate = s.date;
    if(!g.lastDate || (s.date||"") >= g.lastDate) g.lastDate = s.date;
    g.sales.push(s);
  });
  return Object.values(groups).sort((a,b)=> b.totalSpent - a.totalSpent);
}

function renderCustomers(){
  const customers = computeCustomers();
  const rowsHtml = customers.length ? customers.map(c=>`
    <div class="record-card" data-goto="customer::${esc(c.key)}" style="cursor:pointer;">
      <div class="rc-photo"><span>${esc(c.name.charAt(0).toUpperCase())}</span></div>
      <div class="rc-body">
        <div class="rc-id">${esc(c.name)}</div>
        <div class="rc-fields">
          <div><span class="f-label">Purchases: </span><span class="f-val">${c.purchaseCount}</span></div>
          <div><span class="f-label">Total Spent: </span><span class="f-val">${c.totalSpent.toLocaleString("en-IN")}</span></div>
          <div><span class="f-label">Last Purchase: </span><span class="f-val">${esc(formatDateDMY(c.lastDate)||"—")}</span></div>
        </div>
      </div>
    </div>`).join("") : `<div class="empty-note">No customers yet. Customers appear here automatically once you record a Sale.</div>`;

  document.getElementById("content").innerHTML = `
    <div class="module-hero">
      <div class="m-eyebrow">Buyer Directory</div>
      <h1 class="serif">Customers</h1>
      <div class="m-rule"></div>
    </div>
    <div class="record-list">${rowsHtml}</div>
  `;
}

  document.getElementById("sale-edit-btn").addEventListener("click", ()=> openModal("sales", sale));
}

// A printable receipt for one completed sale — same "hand it to the customer"
// idea as the Certificate, but for the transaction itself.
function renderReceipt(saleId){
  const sale = (DATA.sales||[]).find(s=>s.id===saleId);
  if(!sale){ document.getElementById("content").innerHTML = `<div class="empty-note">Sale record not found.</div>`; return; }

  // A simple, stable invoice number: position of this sale among all sales
  // ordered by date, so numbers stay sequential and meaningful rather than
  // just showing the internal record ID.
  const salesByDate = [...(DATA.sales||[])].sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt||"").localeCompare(b.createdAt||""));
  const invoiceIndex = salesByDate.findIndex(s=>s.id===saleId) + 1;
  const invoiceNumber = "SZ-" + String(invoiceIndex || 1).padStart(4,"0");

  // Look up the animal record (if still on file) so the receipt can show
  // breed/type/gender alongside the tag, not just the bare name typed on the sale.
  const animal = (DATA.animals||[]).find(a=>(a.tagId||"").trim().toLowerCase()===(sale.animalTag||"").trim().toLowerCase());
  const animalDetailBits = animal ? [animal.animalType, animal.breed, animal.gender].filter(Boolean) : [];
  const animalDetail = animalDetailBits.length ? ` (${animalDetailBits.join(", ")})` : "";

  const price = toNum(sale.price);
  const received = toNum(sale.amountReceived);
  const balance = price - received; // can be negative (advance/overpayment) as well as positive (due)
  const issuedDate = formatDateDMY(new Date().toISOString().slice(0,10));
  const amountLabel = balance > 0 ? "Balance Due" : (balance < 0 ? "Advance / Overpaid" : "Paid in Full");
  const amountValue = Math.abs(balance);

  const shareText =
`S.Z. Dairy Farm — Sale Receipt
${invoiceNumber} · ${formatDateDMY(sale.date)||"—"}

Animal: ${sale.animalTag||"—"}${animalDetail}
Buyer: ${sale.buyerName||"—"}${sale.buyerContact ? " ("+sale.buyerContact+")" : ""}
Payment Status: ${sale.paymentStatus||"—"}

Sale Price: ₹${price.toLocaleString("en-IN")}
Amount Received: ₹${received.toLocaleString("en-IN")}
${amountLabel}: ₹${amountValue.toLocaleString("en-IN")}
(${numberToWordsIndian(price)})
${sale.notes ? "\nNotes: "+sale.notes : ""}
Thank you for your business.`;

  document.getElementById("content").innerHTML = `
    <div class="no-print" style="padding:20px;">
      <div class="receipt-actions-row" style="margin-top:14px;">
        <button onclick="window.print()" style="background:var(--gradient-gold);border:none;color:#0A0806;">🖨️ Print</button>
        <button class="receipt-share-btn" id="receipt-share-btn">📤 Share / Copy</button>
      </div>
    </div>

    <div class="certificate-wrap" id="receipt-capture-wrap">
      <div class="certificate-inner">
        <div class="hero-badge" style="width:70px;height:70px;margin:0 auto 10px;"><img src="${LOGO_SRC}" alt="" /></div>
        <div class="certificate-farm-name">S.Z. Dairy Farm</div>
        <div class="certificate-tagline">Where Freshness Meets Nature · Since 2010</div>
        <div class="certificate-divider"></div>
        <div class="certificate-title">Sale Receipt</div>
        <div class="receipt-invoice-no">${esc(invoiceNumber)} &nbsp;·&nbsp; ${esc(formatDateDMY(sale.date)||"—")}</div>

        <div class="receipt-buyer-block">
          <div class="certificate-field-label">Buyer</div>
          <div class="certificate-field-value">${esc(sale.buyerName||"—")}</div>
        </div>

        <div class="certificate-grid" style="margin-top:16px;">
          <div class="certificate-field"><div class="certificate-field-label">Animal</div><div class="certificate-field-value">${esc(sale.animalTag||"—")}${esc(animalDetail)}</div></div>
          ${sale.buyerContact ? `<div class="certificate-field"><div class="certificate-field-label">Contact</div><div class="certificate-field-value">${esc(sale.buyerContact)}</div></div>` : ""}
          <div class="certificate-field"><div class="certificate-field-label">Payment Status</div><div class="certificate-field-value">${esc(sale.paymentStatus||"—")}</div></div>
        </div>

        <div class="receipt-amount-box">
          <div class="receipt-amount-row"><span>Sale Price</span><span>₹${price.toLocaleString("en-IN")}</span></div>
          <div class="receipt-amount-row"><span>Amount Received</span><span>₹${received.toLocaleString("en-IN")}</span></div>
          <div class="receipt-amount-row receipt-amount-total"><span>${amountLabel}</span><span>₹${amountValue.toLocaleString("en-IN")}</span></div>
        </div>
        <div class="receipt-words">Amount in words: ${esc(numberToWordsIndian(price))}</div>

        ${sale.notes ? `<div class="certificate-statement">${esc(sale.notes)}</div>` : ""}

        <div class="certificate-statement" style="margin-top:${sale.notes?"10":"20"}px;">
          Thank you for your business.
        </div>

        <div class="receipt-sign-grid">
          <div class="certificate-signature">
            <div class="certificate-sig-line"></div>
            <div class="certificate-sig-label">Buyer</div>
            <div class="certificate-sig-date">${esc(sale.buyerName||"")}</div>
          </div>
          <div class="certificate-signature">
            <div class="certificate-sig-line"></div>
            <div class="certificate-sig-label">S.Z. Dairy Farm</div>
            <div class="certificate-sig-date">Issued ${issuedDate}</div>
          </div>
        </div>
      </div>
    </div>
  `;

  const shareBtn = document.getElementById("receipt-share-btn");
  if(shareBtn){
    shareBtn.addEventListener("click", async ()=>{
      const originalLabel = shareBtn.textContent;
      shareBtn.disabled = true;
      shareBtn.textContent = "Preparing…";
      try{
        // Render the whole printed receipt (logo, fields, amounts, photo,
        // signatures — everything visible on paper) into both a PNG and a
        // PDF, so sharing sends the text caption plus the receipt in both
        // an easy-to-view image and a proper document format, rather than
        // just the animal photo or plain text.
        const baseName = "Receipt-"+invoiceNumber.replace(/[^a-z0-9-_]+/gi,"_");
        const captureEl = document.getElementById("receipt-capture-wrap");
        const receiptFile = await renderReceiptToImageFile(captureEl, baseName+".png");
        const receiptPdfFile = await renderReceiptToPDFFile(captureEl, baseName+".pdf");
        const shareFiles = [receiptFile, receiptPdfFile];

        if(navigator.share && navigator.canShare && navigator.canShare({ files:shareFiles })){
          try{
            await navigator.share({ title: "Sale Receipt "+invoiceNumber, text: shareText, files:shareFiles });
            return;
          }catch(e){ /* user cancelled the share sheet, or it failed — fall through to download */ }
        }

        // No multi-file share support here (e.g. desktop browser, or a
        // share sheet that only accepts one file at a time) — offer both
        // the image and the PDF as downloads instead, so the user still
        // gets a receipt they can send manually. Text is copied alongside
        // them as a caption they can paste.
        for(const f of shareFiles){
          const url = URL.createObjectURL(f);
          const a = document.createElement("a");
          a.href = url;
          a.download = f.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(()=>URL.revokeObjectURL(url), 4000);
        }
        try{ await navigator.clipboard.writeText(shareText); }catch(e){ /* clipboard optional */ }
        showToast("Receipt image & PDF downloaded (caption text copied to clipboard)");
      }catch(err){
        // Rendering the image failed (very old browser, etc.) — fall back
        // to sharing/copying plain text so the button still does something.
        if(navigator.share){
          try{ await navigator.share({ title: "Sale Receipt "+invoiceNumber, text: shareText }); return; }
          catch(e){ /* user cancelled or share failed — fall through to clipboard */ }
        }
        try{
          await navigator.clipboard.writeText(shareText);
          showToast("Couldn't generate the receipt image — text copied instead");
        }catch(e){
          showToast("Couldn't share or copy — please print instead");
        }
      }finally{
        shareBtn.disabled = false;
        shareBtn.textContent = originalLabel;
      }
    });
  }
}

// Renders a DOM element (with all of the page's own <style> rules, so fonts
// and colours match what's printed) onto a <canvas>, entirely client-side —
// no external library or CDN call, so it keeps working offline. Uses the
// standard SVG <foreignObject> trick: wrap the element's HTML in an SVG,
// draw that SVG onto a canvas. Shared by both the PNG and PDF exporters
// below so the two formats always show exactly the same receipt.
async function renderElementToCanvas(el, scale){
  if(!el) throw new Error("Nothing to render");

  // Every <style> block already in the page — carrying them into the SVG
  // is what makes the captured image look like the real, styled receipt
  // instead of unstyled HTML.
  const styles = Array.from(document.querySelectorAll("style")).map(s=>s.textContent).join("\n");

  const rect = el.getBoundingClientRect();
  const width = Math.ceil(rect.width) || el.scrollWidth;
  const height = Math.ceil(el.scrollHeight);

  const clone = el.cloneNode(true);
  clone.style.margin = "0";

  const svgMarkup =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
    `<foreignObject width="100%" height="100%">` +
    `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;">` +
    `<style>${styles}</style>` +
    clone.outerHTML +
    `</div></foreignObject></svg>`;

  const svgUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgMarkup);

  const img = await new Promise((resolve, reject)=>{
    const image = new Image();
    image.onload = ()=>resolve(image);
    image.onerror = ()=>reject(new Error("Could not render receipt image"));
    image.src = svgUrl;
  });

  const canvas = document.createElement("canvas");
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext("2d");
  // White background so the export isn't transparent (the receipt card
  // itself may have rounded corners / shadow that would otherwise show as
  // holes).
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas;
}

// Renders the receipt into a PNG File — a crisp, print-quality snapshot for
// sharing/downloading as an image.
async function renderReceiptToImageFile(el, filename){
  const canvas = await renderElementToCanvas(el, 2);
  const blob = await new Promise((resolve, reject)=>{
    canvas.toBlob(b=> b ? resolve(b) : reject(new Error("Could not export receipt image")), "image/png");
  });
  return new File([blob], filename, { type: "image/png" });
}

// Renders the receipt into a single-page PDF File. There's no PDF library
// on this page (and no CDN calls, so it has to keep working offline), so
// this builds the smallest valid PDF by hand: one page whose only content
// is the receipt rendered as a full-bleed JPEG image. That's enough to give
// people a proper, printable PDF document rather than just a picture.
async function renderReceiptToPDFFile(el, filename){
  const canvas = await renderElementToCanvas(el, 2);

  const jpegDataUrl = canvas.toDataURL("image/jpeg", 0.92);
  const base64 = jpegDataUrl.slice(jpegDataUrl.indexOf(",") + 1);
  const jpegBytes = base64ToBytes(base64);

  // PDF page size in points (1pt = 1/72in); 96px = 1in on our canvas's
  // logical (unscaled) size, so convert canvas pixels -> points that way.
  const pxToPt = 72 / 96;
  const renderScale = 2; // matches the scale passed to renderElementToCanvas above
  const pageWidthPt = canvas.width * pxToPt / renderScale;
  const pageHeightPt = canvas.height * pxToPt / renderScale;

  const pdfBytes = buildSinglePageJpegPDF(jpegBytes, canvas.width, canvas.height, pageWidthPt, pageHeightPt);
  return new File([pdfBytes], filename, { type: "application/pdf" });
}

function base64ToBytes(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Hand-rolled minimal PDF: Catalog -> Pages -> one Page with a JPEG
// XObject (DCTDecode — a JPEG's own compressed bytes can be embedded as-is,
// no re-encoding needed) drawn to fill the page. Good enough for a
// one-image receipt document with no external dependency.
function buildSinglePageJpegPDF(jpegBytes, jpegPxWidth, jpegPxHeight, widthPt, heightPt){
  const enc = new TextEncoder();
  const parts = []; // array of Uint8Array chunks, concatenated at the end
  let offset = 0;
  const offsets = [0]; // 1-indexed by object number; offsets[0] unused

  function push(chunk){
    const bytes = (typeof chunk === "string") ? enc.encode(chunk) : chunk;
    parts.push(bytes);
    offset += bytes.length;
  }
  function startObj(n){
    offsets[n] = offset;
    push(n + " 0 obj\n");
  }

  push("%PDF-1.4\n");

  startObj(1);
  push("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");

  startObj(2);
  push("<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n");

  startObj(3);
  push(
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + widthPt.toFixed(2) + " " + heightPt.toFixed(2) + "] " +
    "/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n"
  );

  startObj(4);
  push(
    "<< /Type /XObject /Subtype /Image /Width " + jpegPxWidth + " /Height " + jpegPxHeight +
    " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpegBytes.length + " >>\nstream\n"
  );
  push(jpegBytes);
  push("\nendstream\nendobj\n");

  const contentStream = "q " + widthPt.toFixed(2) + " 0 0 " + heightPt.toFixed(2) + " 0 0 cm /Im0 Do Q";
  startObj(5);
  push("<< /Length " + contentStream.length + " >>\nstream\n" + contentStream + "\nendstream\nendobj\n");

  const xrefStart = offset;
  const objCount = 6;
  push("xref\n0 " + objCount + "\n0000000000 65535 f \n");
  for(let i=1; i<objCount; i++){
    push(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
  }
  push("trailer\n<< /Size " + objCount + " /Root 1 0 R >>\nstartxref\n" + xrefStart + "\n%%EOF");

  const total = parts.reduce((n,p)=>n+p.length, 0);
  const out = new Uint8Array(total);
  let pos = 0;
  for(const p of parts){ out.set(p, pos); pos += p.length; }
  return out;
}

/* ============================== CERTIFICATE ============================== */
// A print-friendly "Certificate of Health & Care" for one animal — meant to
// be handed to a buyer as a trust document. Everything on it, including the
// health-record summary, is pulled straight from that animal's real farm
// records, so it can never say something the data doesn't back up: a field
// or row only appears when there's an actual record behind it.
function renderCertificate(tagId){
  const animal = (DATA.animals||[]).find(a=>a.tagId===tagId);
  if(!animal){ document.getElementById("content").innerHTML = `<div class="empty-note">Animal "${esc(tagId)}" not found.</div>`; return; }

  const purchase = (DATA.purchases||[]).find(p=>p.animalTag===tagId);
  const birthRecord = (DATA.calving||[]).find(c=>c.calfTag===tagId);
  const issuedDate = formatDateDMY(new Date().toISOString().slice(0,10));

  // A stable certificate number: every animal in creation order gets one,
  // so it stays the same across re-prints instead of changing each time.
  const animalsByCreated = [...(DATA.animals||[])].sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||""));
  const certIndex = animalsByCreated.findIndex(a=>a.tagId===tagId) + 1;
  const certNumber = "SZ-CERT-" + String(certIndex || 1).padStart(4,"0");
  // Not a cryptographic signature — just a short reference code derived from
  // this animal's own tag and certificate number, so two printouts of the
  // same certificate carry a matching code and a mismatch is easy to spot.
  const refCode = simpleHash(tagId + certNumber).slice(1, 7).toUpperCase();

  const animalPhoto = animal.photos && animal.photos[0];

  // ---- Real health-record summary, most recent of each kind ----
  const inspections = (DATA.inspection||[]).filter(r=>r.animalTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const dewormings = (DATA.deworming||[]).filter(r=>r.animalTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const medicals = (DATA.medical||[]).filter(r=>r.animalTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const vaccinations = medicals.filter(m=>m.condition==="Vaccination");
  const lastInspection = inspections[0];
  const lastDeworming = dewormings[0];
  const lastVaccination = vaccinations[0];
  const totalHealthRecords = inspections.length + dewormings.length + medicals.length;

  const healthItems = [];
  if(lastInspection) healthItems.push({ label:"Last Inspection", value:formatDateDMY(lastInspection.date), sub:lastInspection.result||"" });
  if(lastDeworming) healthItems.push({ label:"Last Deworming", value:formatDateDMY(lastDeworming.date), sub:lastDeworming.dewormerUsed||"" });
  if(lastVaccination) healthItems.push({ label:"Last Vaccination", value:formatDateDMY(lastVaccination.date), sub:lastVaccination.medicineUsed||"" });
  const healthHtml = healthItems.length ? `
    <div class="cert2-health-title">Health &amp; Care Record</div>
    <div class="cert2-health" style="grid-template-columns:repeat(${healthItems.length},1fr);">
      ${healthItems.map(h=>`<div class="cert2-health-item"><div class="ch-label">${esc(h.label)}</div>
        <div class="ch-value">${esc(h.value)}</div>
        ${h.sub ? `<div class="ch-sub">${esc(h.sub)}</div>` : ""}</div>`).join("")}
    </div>` : "";

  // ---- Supporting facts grid — only fields the record actually has ----
  const factRows = [
    ["Date of Birth", formatDateDMY(animal.dob)],
    ["Color / Marks", animal.color],
    ["Birth Weight", birthRecord && birthRecord.calfWeight ? birthRecord.calfWeight + " kg" : ""],
    ["Mother", animal.motherTag],
    ["Father / Sire", animal.fatherTag],
    ["Source", animal.source],
  ].filter(([,v])=>v);
  const factsHtml = factRows.length ? `
    <div class="cert2-grid">
      ${factRows.map(([label,value])=>`<div class="cert2-field">
        <div class="cert2-field-label">${esc(label)}</div>
        <div class="cert2-field-value">${esc(value)}</div></div>`).join("")}
    </div>` : "";

  // The certifying statement only claims an "ongoing health record" when
  // there's actually at least one inspection/deworming/medical entry on
  // file for this animal — otherwise it says something equally true but
  // more modest, instead of overstating what the farm has recorded so far.
  const statement = totalHealthRecords > 0
    ? `This certifies that <b>${esc(tagId)}</b> is individually tracked and cared for at S.Z. Dairy Farm,
       with an ongoing record of health inspections, deworming, and medical treatment as summarized above.`
    : `This certifies that <b>${esc(tagId)}</b> is individually tracked and cared for at S.Z. Dairy Farm,
       with health and care activity logged in the farm's records as it occurs.`;

  document.getElementById("content").innerHTML = `
    <div class="no-print" style="padding:20px;">
      <div style="margin-top:14px;">
        <button onclick="window.print()" style="width:100%;background:var(--gradient-gold);border:none;color:#0A0806;
          border-radius:8px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;">🖨️ Print Certificate</button>
      </div>
    </div>

    <div class="cert2-wrap">
      <div class="cert2-card">
        <div class="cert2-corner tl"></div><div class="cert2-corner tr"></div>
        <div class="cert2-corner bl"></div><div class="cert2-corner br"></div>
        <div class="cert2-watermark">S.Z. DAIRY FARM</div>

        <div class="cert2-content">
          <div class="cert2-header">
            <div class="cert2-meta-row">
              <div class="cert2-meta">
                <div class="cert2-meta-label">Issued</div>
                <div class="cert2-meta-value">${esc(issuedDate)}</div>
              </div>
              <div class="cert2-meta right">
                <div class="cert2-meta-label">Certificate No.</div>
                <div class="cert2-meta-value">${esc(certNumber)}</div>
                <div class="cert2-meta-sub">Ref ${esc(refCode)}</div>
              </div>
            </div>

            <div class="cert2-logo"><img src="${LOGO_SRC}" alt="" /></div>
            <div class="cert2-farm-name">S.Z. Dairy Farm</div>
            <div class="cert2-tagline">Where Freshness Meets Nature · Since 2010</div>
            ${animalPhoto ? `<div class="cert2-photo" style="margin-top:14px;"><img src="${animalPhoto}" alt="" /></div>` : ""}
            <div class="cert2-divider"></div>
            <div class="cert2-eyebrow">Certificate of Health &amp; Care</div>
            <div class="cert2-certify-line">This is to certify that</div>
            <div class="cert2-animal-name">${esc(tagId)}</div>
            <div class="cert2-animal-sub">${esc(animal.animalType||"Animal")}${animal.breed?" · "+esc(animal.breed):""}${animal.gender?" · "+esc(animal.gender):""}</div>
            ${purchase ? `<div class="cert2-care-since">In our care since ${esc(formatDateDMY(purchase.date))}</div>` : ""}
          </div>

          <div class="cert2-facts">
            <div class="cert2-stats">
              <div class="cert2-stat"><div class="cs-label">Status</div><div class="cs-value">${esc(animal.status||"Active")}</div></div>
              <div class="cert2-stat"><div class="cs-label">Age</div><div class="cs-value">${calcAge(getEffectiveDOB(animal)) || "—"}</div></div>
            </div>
            ${factsHtml}
            ${healthHtml}
          </div>

          <div class="cert2-body">
            <div class="cert2-statement">${statement}</div>
            <div class="cert2-footnote">This certificate reflects S.Z. Dairy Farm's own records as of the issue date above and is provided for the buyer's reference.</div>
          </div>

          <div class="cert2-signature">
            <div>
              <div class="cert2-sig-line"></div>
              <div class="cert2-sig-label">S.Z. Dairy Farm</div>
              <div class="cert2-sig-title">Authorized Signatory</div>
              <div class="cert2-sig-date">Issued ${esc(issuedDate)}</div>
            </div>
            <div class="cert2-seal"><span class="cert2-seal-inner">Certified<br/>Authentic</span></div>
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ============================== SHOWCASE ============================== */
// A polished, non-technical screen meant to be handed to a customer — no
// data entry, no edit buttons, just the farm's story, live-feeling numbers,
// the herd, and a trust checklist. Everything on it is computed fresh from
// real records, so nothing here can drift out of date or need separate upkeep.
function renderShowcase(){
  const activeAnimals = (DATA.animals||[]).filter(a=> a.status==="Active" || !a.status);
  const yearsOfTrust = new Date().getFullYear() - 2010;

  // How an animal reads to a customer: Sold overrides everything else, then
  // whatever the farm has explicitly marked; anything unmarked defaults to
  // Not for Sale rather than being silently omitted.
  const saleStatus = (a)=> a.status==="Sold" ? "Sold" : (a.forSale==="Available for Sale" ? "Available for Sale" : "Not for Sale");
  // Deceased/Transferred animals aren't part of the story shown to a guest.
  const herdEligible = (DATA.animals||[]).filter(a=> a.status!=="Deceased" && a.status!=="Transferred");
  const availableCount = herdEligible.filter(a=> saleStatus(a)==="Available for Sale").length;
  let herdFiltered = SHOWCASE_FILTER ? herdEligible.filter(a=> saleStatus(a)===SHOWCASE_FILTER) : herdEligible;
  const searchTerm = SHOWCASE_SEARCH.trim().toLowerCase();
  if(searchTerm){
    herdFiltered = herdFiltered.filter(a=>
      (a.tagId||"").toLowerCase().includes(searchTerm) ||
      (a.animalType||"").toLowerCase().includes(searchTerm) ||
      (a.breed||"").toLowerCase().includes(searchTerm)
    );
  }
  // "Entry date" — when the animal joined the farm's records — most recent first.
  // "Entry date" — birth date when known (an animal's real start with the
  // farm), falling back to when the record was added — most recent first.
  const entryDateKey = (a)=> getEffectiveDOB(a) || (a.createdAt||"").slice(0,10);
  const herdSorted = [...herdFiltered].sort((a,b)=> entryDateKey(b).localeCompare(entryDateKey(a)) || (b.createdAt||"").localeCompare(a.createdAt||""));

  const contentEl = document.getElementById("content");
  const availWidth = (contentEl.clientWidth || window.innerWidth) - 40;
  const herdCols = availWidth >= 480 ? 3 : 2;
  const herdSpacing = 10;
  // Same fix as the record-card photo spacing issue found earlier on this
  // tablet's browser: flexbox "gap" isn't reliably supported here, so tiles
  // can end up touching with no visible space between them. Use margins
  // instead, skipping the margin on the last tile in each row.
  const herdTileSize = Math.floor((availWidth - herdSpacing*(herdCols-1)) / herdCols);
  const cardPadding = 16; // 8px each side, kept square relative to the card's own content box
  const photoSize = herdTileSize - cardPadding;

  const filterOptions = ["Available for Sale","Not for Sale","Sold"];
  const searchRowHtml = `<div class="search-wrap" style="padding:0 20px 14px;">
    <input type="text" id="showcase-search-input" placeholder="Search by tag, type, or breed…" value="${esc(SHOWCASE_SEARCH)}" />
  </div>`;
  const filterRowHtml = `<div class="showcase-filter-row">
    <button class="filter-chip ${!SHOWCASE_FILTER?'active':''}" data-showcase-filter="">All</button>
    ${filterOptions.map(o=>`<button class="filter-chip ${SHOWCASE_FILTER===o?'active':''}" data-showcase-filter="${esc(o)}">${esc(o)}</button>`).join("")}
  </div>`;

  let herdHtml;
  if(!herdSorted.length){
    herdHtml = `<div class="empty-note" style="margin:0 20px;">${searchTerm ? "No animals match your search." : "No animals match this filter yet."}</div>`;
  } else {
    let lastDateKey = null;
    let rows = "";
    let rowBuf = [];
    const flushRow = ()=>{
      if(!rowBuf.length) return;
      rows += `<div style="display:flex; flex-wrap:wrap; padding:0 20px;">${rowBuf.join("")}</div>`;
      rowBuf = [];
    };
    herdSorted.forEach((a,i)=>{
      const dk = entryDateKey(a);
      if(dk !== lastDateKey){
        flushRow();
        lastDateKey = dk;
        const label = dk ? new Date(dk+"T00:00:00").toLocaleDateString("en-IN", {day:"numeric", month:"long", year:"numeric"}) : "Date Unrecorded";
        rows += `<div class="showcase-date-divider"><span class="showcase-date-divider-line"></span><span class="showcase-date-divider-text">${esc(label)}</span><span class="showcase-date-divider-line"></span></div>`;
      }
      const status = saleStatus(a);
      const badgeHtml = status==="Available for Sale"
        ? `<span class="showcase-herd-badge for-sale">For Sale</span>`
        : status==="Sold" ? `<span class="showcase-herd-badge sold">Sold</span>` : "";
      // Sold animals aren't relisted from here — that's the Sales workflow's job.
      const saleToggleHtml = status!=="Sold"
        ? `<button class="showcase-sale-toggle" data-sale-toggle="${esc(a.tagId)}"
             data-sale-target="${status==='Available for Sale' ? 'Not for Sale' : 'Available for Sale'}">
             ${status==='Available for Sale' ? '✦ Remove from Sale' : '✦ List for Sale'}
           </button>`
        : "";
      const photoInner = (a.photos && a.photos[0])
        ? `<img src="${a.photos[0]}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;" />`
        : `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--surface2);">
             <span style="font-family:'Cormorant Garamond',serif; font-size:26px; color:var(--gold3);">${esc((a.animalType||a.tagId||"?").charAt(0))}</span>
           </div>`;
      const isLastInRow = (rowBuf.length % herdCols === herdCols - 1);
      rowBuf.push(`
        <div class="showcase-herd-card" data-goto="showcase-detail::${esc(a.tagId)}"
          style="width:${herdTileSize}px; margin-right:${isLastInRow ? 0 : herdSpacing}px; margin-bottom:${herdSpacing}px;">
          <div style="position:relative; width:100%; height:${photoSize}px; border-radius:8px; overflow:hidden; border:1px solid var(--gold3);">
            ${photoInner}
            ${badgeHtml}
          </div>
          <div class="showcase-herd-name">${esc(a.tagId||"—")}</div>
          <div class="showcase-herd-breed">${esc(a.animalType||"")}${a.breed ? " · "+esc(a.breed) : ""}</div>
          ${saleToggleHtml}
        </div>`);
      if(rowBuf.length === herdCols) flushRow();
    });
    flushRow();
    herdHtml = rows;
  }

  const fp = DATA.farmProfile || {};

  // The farm's own words, shown only when actually entered on the Home
  // screen — no stand-in copy when it hasn't been written yet.
  const storyText = (fp.story && fp.story.trim()) ? fp.story.trim() : "";
  const quoteHtml = storyText ? `
    <div class="showcase-quote">
      <span class="showcase-quote-mark">&ldquo;</span>
      <p>${esc(storyText)}</p>
      <div class="m-rule"></div>
    </div>` : "";

  // Only appears once the farm has entered a phone/WhatsApp/address —
  // otherwise the showcase would end in a button that leads nowhere.
  const contactHtml = (fp.phone || fp.whatsapp || fp.address) ? `
    <div class="showcase-contact">
      <div class="showcase-contact-title">Visit or Get in Touch</div>
      ${fp.address ? `<div class="showcase-contact-address">${esc(fp.address)}</div>` : ""}
      <div class="showcase-contact-row">
        ${fp.phone ? `<a class="showcase-contact-btn primary" href="tel:${esc(fp.phone.replace(/\s+/g,""))}">📞 Call Farm</a>` : ""}
        ${fp.whatsapp ? `<a class="showcase-contact-btn secondary" href="https://wa.me/${esc(fp.whatsapp.replace(/[^0-9]/g,""))}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ""}
      </div>
    </div>` : "";

  document.getElementById("content").innerHTML = `
    <div class="showcase-hero">
      <div class="showcase-hero-glow"></div>
      <div class="hero-badge" style="width:120px;height:120px;"><img src="${LOGO_SRC}" alt="" /></div>
      <h1 class="serif" style="font-size:32px; margin-top:16px;">S.Z. Dairy Farm</h1>
      <div class="tagline">Where Freshness Meets Nature</div>
      <div class="showcase-trust-badge">✦ Trusted Since 2010 ✦</div>
      <div class="showcase-intro">A family tradition of ethical animal care, raised with patience on the soil of Gujarat.</div>
    </div>

    <div class="showcase-signature">
      <div class="showcase-signature-stat">
        <div class="showcase-signature-value" id="sc-years">0</div>
        <div class="showcase-signature-label">Years of Trust</div>
      </div>
      <div class="showcase-signature-divider"></div>
      <div class="showcase-signature-stat">
        <div class="showcase-signature-value" id="sc-animals">0</div>
        <div class="showcase-signature-label">Animals Cared For</div>
      </div>
      <div class="showcase-signature-divider"></div>
      <div class="showcase-signature-stat">
        <div class="showcase-signature-value" id="sc-available">0</div>
        <div class="showcase-signature-label">Available Now</div>
      </div>
    </div>

    ${quoteHtml}

    <div class="eyebrow" style="margin-top:6px;">Meet Our Herd</div>
    ${searchRowHtml}
    ${filterRowHtml}
    ${herdHtml}

    ${contactHtml}

    <div class="showcase-footer">
      <div class="m-rule"></div>
      S.Z. Dairy Farm · Since 2010 · Where Freshness Meets Nature
    </div>
  `;

  document.querySelectorAll("[data-showcase-filter]").forEach(el=>{
    el.addEventListener("click", ()=>{
      SHOWCASE_FILTER = el.getAttribute("data-showcase-filter");
      renderShowcase();
    });
  });
  const showcaseSearchInput = document.getElementById("showcase-search-input");
  if(showcaseSearchInput){
    showcaseSearchInput.addEventListener("input", ()=>{
      SHOWCASE_SEARCH = showcaseSearchInput.value;
      renderShowcase();
      const el = document.getElementById("showcase-search-input");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
  document.querySelectorAll("[data-sale-toggle]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      openSaleAuthModal(el.getAttribute("data-sale-toggle"), el.getAttribute("data-sale-target"));
    });
  });

  // Kick off the count-up animations once the numbers are actually in the DOM.
  animateCountUp(document.getElementById("sc-years"), yearsOfTrust);
  animateCountUp(document.getElementById("sc-animals"), activeAnimals.length);
  animateCountUp(document.getElementById("sc-available"), availableCount);
}

/* ============================== SHOWCASE ANIMAL DETAIL ============================== */
// Tapping an animal in the Showcase lands here first — every non-financial
// fact about the animal, all of its photos, and (only on this screen) the
// button to open its certificate. No purchase/sale/cost figures ever show
// up here; that data simply isn't included when building this screen.
function renderShowcaseAnimalDetail(tagId){
  const animal = (DATA.animals||[]).find(a=>a.tagId===tagId);
  if(!animal){ document.getElementById("content").innerHTML = `<div class="empty-note">Animal "${esc(tagId)}" not found.</div>`; return; }
  const isMale = (animal.gender||"").trim().toLowerCase() === "male";

  const breeding = (DATA.breeding||[]).filter(b=>b.femaleTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const calvingAsMother = (DATA.calving||[]).filter(c=>c.motherTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const calvingAsCalf = (DATA.calving||[]).filter(c=>c.calfTag===tagId);
  const medical = (DATA.medical||[]).filter(m=>m.animalTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const weights = (DATA.weight||[]).filter(w=>w.animalTag===tagId).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const heights = (DATA.height||[]).filter(h=>h.animalTag===tagId).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const teethRecords = (DATA.teeth||[]).filter(t=>t.animalTag===tagId).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const milkRecords = (DATA.milk||[]).filter(m=>m.animalTag===tagId).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const totalMilkAllTime = milkRecords.reduce((s,m)=>s+(Number(m.quantity)||0),0);

  // Only link a parent/offspring to its own Showcase page when that animal
  // is itself part of the public herd (same eligibility as the herd list) —
  // otherwise show the tag as plain text.
  const showcaseEligible = a => a && a.status!=="Deceased" && a.status!=="Transferred";
  const findAnimalByTag = (t)=> (t||"").trim() ? (DATA.animals||[]).find(a=>(a.tagId||"").trim().toLowerCase()===(t||"").trim().toLowerCase()) : null;
  const motherAnimal = findAnimalByTag(animal.motherTag);
  const fatherAnimal = findAnimalByTag(animal.fatherTag);
  const offspring = (DATA.animals||[]).filter(a=>
    a.tagId!==tagId && (
      (a.motherTag && a.motherTag.trim().toLowerCase()===tagId.trim().toLowerCase()) ||
      (a.fatherTag && a.fatherTag.trim().toLowerCase()===tagId.trim().toLowerCase())
    )
  ).sort((a,b)=>(a.dob||"").localeCompare(b.dob||""));

  const photos = animal.photos || [];
  const mainPhoto = photos[0]
    ? `<img src="${photos[0]}" alt="" />`
    : `<div class="profile-photo-fallback"><span>${esc(tagId.charAt(0))}</span></div>`;
  const statusKey = (animal.status||"Active").trim().toLowerCase();
  const statusPill = `<span class="status-badge status-${esc(statusKey)}">${esc(animal.status||"Active")}</span>`;

  // Extra photos (beyond the hero shot) as a tappable strip — tapping any
  // one opens the full set in the lightbox so a customer can browse them all.
  const extraPhotosHtml = photos.length > 1 ? `
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin:0 20px 28px;">
      ${photos.map((p,i)=>`
        <div data-showcase-photo-idx="${i}" style="width:76px; height:76px; border-radius:8px; overflow:hidden;
          border:1px solid var(--hair); cursor:pointer; flex-shrink:0;">
          <img src="${p}" style="width:100%; height:100%; object-fit:cover;" />
        </div>`).join("")}
    </div>` : "";

  const section = (title, rows) => `
    <div class="eyebrow">${esc(title)}</div>
    ${rows.length ? `<div class="record-list" style="margin-bottom:28px;">${rows}</div>`
      : `<div class="empty-note" style="margin-bottom:28px;">No records yet.</div>`}`;

  const breedingRows = breeding.map(b=>`
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(b.date)||"—")} · ${esc(b.method||"")}</div>
      <div class="rc-fields"><div><span class="f-label">Sire/Source: </span><span class="f-val">${esc(b.bullOrSemenSource||"—")}</span></div>
      <div><span class="f-label">Expected calving: </span><span class="f-val">${esc(formatDateDMY(b.expectedCalvingDate)||"—")}</span></div>
      <div><span class="f-label">Status: </span><span class="f-val">${esc(b.status||"—")}</span></div></div>
    </div></div>`).join("");

  const calvingRows = calvingAsMother.map(c=>`
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(c.date)||"—")} · Calf ${esc(c.calfTag||"—")}</div>
      <div class="rc-fields"><div><span class="f-label">Gender: </span><span class="f-val">${esc(c.calfGender||"—")}</span></div>
      <div><span class="f-label">Weight: </span><span class="f-val">${esc(c.calfWeight||"—")} kg</span></div></div>
    </div></div>`).join("");

  const medicalRows = medical.map(m=>`
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(m.date)||"—")} · ${esc(m.condition||"Treatment")}</div>
      <div class="rc-fields"><div><span class="f-label">Medicine: </span><span class="f-val">${esc(m.medicineUsed||"—")}</span></div>
      <div><span class="f-label">Vet: </span><span class="f-val">${esc(m.vetName||"—")}</span></div></div>
    </div></div>`).join("");

  const weightRows = weights.map((w,i)=>{
    const prev = weights[i-1];
    const delta = prev ? (Number(w.weight)-Number(prev.weight)) : null;
    const deltaText = delta===null ? "" : (delta>=0 ? ` (+${delta.toFixed(1)} ${w.unit||"Kg"} since last)` : ` (${delta.toFixed(1)} ${w.unit||"Kg"} since last)`);
    return `
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(w.date)||"—")}</div>
      <div class="rc-fields"><div><span class="f-val">${esc(w.weight)} ${esc(w.unit||"Kg")}${deltaText}</span></div></div>
    </div></div>`;
  }).join("");


  const heightRows = heights.map((hRec,i)=>{
    const prev = heights[i-1];
    const delta = prev ? (Number(hRec.height)-Number(prev.height)) : null;
    const deltaText = delta===null ? "" : (delta>=0 ? ` (+${delta.toFixed(1)} ${hRec.unit||"cm"} since last)` : ` (${delta.toFixed(1)} ${hRec.unit||"cm"} since last)`);
    return `
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(hRec.date)||"—")}</div>
      <div class="rc-fields"><div><span class="f-val">${esc(hRec.height)} ${esc(hRec.unit||"cm")}${deltaText}</span></div></div>
    </div></div>`;
  }).join("");
  const teethRows = teethRecords.map(t=>`
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(t.date)||"—")}</div>
      <div class="rc-fields"><div><span class="f-val">${esc(t.teeth||"—")}</span></div></div>
    </div></div>`).join("");
  const milkRows = milkRecords.slice(0,30).map(m=>`
    <div class="record-card"><div class="rc-body">
      <div class="rc-id">${esc(formatDateDMY(m.date)||"—")} · ${esc(m.session||"")}</div>
      <div class="rc-fields"><div><span class="f-val">${esc(m.quantity)} L${m.fatContent?` · ${esc(m.fatContent)}% fat`:""}</span></div></div>
    </div></div>`).join("");

  const parentHtml = (animal.motherTag || animal.fatherTag) ? `
    <div class="eyebrow">Parentage</div>
    <div class="stat-grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr); margin:0 20px 30px;">
      ${animal.motherTag ? `<div class="stat-card"${motherAnimal && showcaseEligible(motherAnimal) ? ` data-goto="showcase-detail::${esc(motherAnimal.tagId)}" style="cursor:pointer;"` : ""}>
        <div class="s-label">Mother</div><div class="s-value" style="font-size:18px;">${esc(animal.motherTag)}</div>
        ${motherAnimal && showcaseEligible(motherAnimal) ? `<div class="s-sub">Tap to view</div>` : ""}</div>` : ""}
      ${animal.fatherTag ? `<div class="stat-card"${fatherAnimal && showcaseEligible(fatherAnimal) ? ` data-goto="showcase-detail::${esc(fatherAnimal.tagId)}" style="cursor:pointer;"` : ""}>
        <div class="s-label">Father / Sire</div><div class="s-value" style="font-size:18px;">${esc(animal.fatherTag)}</div>
        ${fatherAnimal && showcaseEligible(fatherAnimal) ? `<div class="s-sub">Tap to view</div>` : ""}</div>` : ""}
    </div>` : "";

  const visibleOffspring = offspring.filter(showcaseEligible);
  const offspringHtml = visibleOffspring.length ? `
    <div class="eyebrow">Offspring (${visibleOffspring.length})</div>
    <div class="record-list" style="margin-bottom:28px;">
      ${visibleOffspring.map(o=>`
        <div class="record-card" data-goto="showcase-detail::${esc(o.tagId)}" style="cursor:pointer;">
          <div class="rc-body">
            <div class="rc-id">${esc(o.tagId)}</div>
            <div class="rc-fields"><div><span class="f-val">${esc(o.animalType||"Animal")}${o.breed?" · "+esc(o.breed):""}${o.dob?" · Born "+esc(formatDateDMY(o.dob)):""}</span></div></div>
          </div>
        </div>`).join("")}
    </div>` : "";

  document.getElementById("content").innerHTML = `
    <div class="profile-hero">
      <div class="profile-photo-frame">
        ${mainPhoto}
        <div class="profile-photo-overlay">
          <div class="profile-photo-eyebrow">${esc(animal.animalType||"Animal")}${animal.breed?" · "+esc(animal.breed):""}</div>
          <div class="profile-photo-name">${esc(tagId)}${statusPill}</div>
        </div>
      </div>
      <div class="profile-actions">
        <button data-goto="certificate::${esc(tagId)}" class="profile-action-btn primary">🏅 View Certificate</button>
      </div>
    </div>
    ${extraPhotosHtml}
    <div class="stat-grid" style="margin:24px 20px 30px;">
      <div class="stat-card"><div class="s-label">Status</div><div class="s-value" style="font-size:20px;">${esc(animal.status||"Active")}</div></div>
      <div class="stat-card"><div class="s-label">Gender</div><div class="s-value" style="font-size:20px;">${esc(animal.gender||"—")}</div></div>
      <div class="stat-card"><div class="s-label">Age</div><div class="s-value" style="font-size:20px;">${calcAge(getEffectiveDOB(animal)) || "—"}</div><div class="s-sub">${animal.dob ? "Born" : "Since arrival"} ${esc(formatDateDMY(getEffectiveDOB(animal))||"—")}</div></div>
      <div class="stat-card"><div class="s-label">Current Weight</div><div class="s-value" style="font-size:20px;">${weights.length ? esc(weights[weights.length-1].weight)+" "+esc(weights[weights.length-1].unit||"Kg") : "—"}</div></div>
      <div class="stat-card"><div class="s-label">Current Height</div><div class="s-value" style="font-size:20px;">${heights.length ? esc(heights[heights.length-1].height)+" "+esc(heights[heights.length-1].unit||"cm") : "—"}</div></div>
      ${teethRecords.length ? `<div class="stat-card"><div class="s-label">Teeth</div><div class="s-value" style="font-size:20px;">${esc(teethRecords[teethRecords.length-1].teeth)}</div><div class="s-sub">as of ${esc(formatDateDMY(teethRecords[teethRecords.length-1].date)||"—")}</div></div>` : ""}
      ${!isMale ? `<div class="stat-card"><div class="s-label">Lifetime Milk</div><div class="s-value" style="font-size:20px;">${totalMilkAllTime.toFixed(0)} L</div></div>` : ""}
    </div>
    ${parentHtml}
    ${offspringHtml}
    ${!isMale ? section("Breeding History", breedingRows) : ""}
    ${calvingAsCalf.length ? `<div class="eyebrow">Born From</div><div class="record-list" style="margin-bottom:28px;">${calvingAsCalf.map(c=>`<div class="record-card"><div class="rc-body"><div class="rc-id">Mother: ${esc(c.motherTag)}</div><div class="rc-fields"><div><span class="f-val">Born ${esc(formatDateDMY(c.date)||"—")}</span></div></div></div></div>`).join("")}</div>` : ""}
    ${!isMale ? section("Calving Records", calvingRows) : ""}
    ${section("Medical History", medicalRows)}
    ${!isMale ? section("Milk Production (last 30 entries)", milkRows) : ""}
    ${buildWeightChartSVG(weights)}
    ${section("Weight History", weightRows)}
    ${buildHeightChartSVG(heights)}
    ${section("Height History", heightRows)}
    ${section("Teeth History", teethRows)}
  `;

  document.querySelectorAll("[data-showcase-photo-idx]").forEach(el=>{
    el.addEventListener("click", ()=>{ openLightbox(photos); });
  });
}

/* Owner-only gate: changing an animal's sale listing directly from the
   customer-facing Showcase always requires the app password, regardless of
   whether the device happens to be unlocked at the moment — a customer
   browsing the tablet can tap the control but can't act on it. */
let SALE_AUTH_TAG = null;
let SALE_AUTH_TARGET = null;
function openSaleAuthModal(tagId, targetValue){
  SALE_AUTH_TAG = tagId;
  SALE_AUTH_TARGET = targetValue;
  document.getElementById("sale-auth-subtitle").textContent =
    targetValue === "Available for Sale"
      ? `Enter the app password to list "${tagId}" for sale.`
      : `Enter the app password to remove "${tagId}" from sale.`;
  document.getElementById("sale-auth-input").value = "";
  document.getElementById("sale-auth-error").textContent = "";
  document.getElementById("sale-auth-backdrop").classList.add("open");
  setTimeout(()=> document.getElementById("sale-auth-input").focus(), 100);
}
function closeSaleAuthModal(){
  document.getElementById("sale-auth-backdrop").classList.remove("open");
  SALE_AUTH_TAG = null;
  SALE_AUTH_TARGET = null;
}
function confirmSaleAuth(){
  const errEl = document.getElementById("sale-auth-error");
  if(!hasAppPassword()){
    errEl.textContent = "Set an app password in Settings first to protect this action.";
    return;
  }
  const entered = document.getElementById("sale-auth-input").value;
  if(!entered || simpleHash(entered) !== getEffectivePasswordHash()){
    errEl.textContent = "Incorrect password";
    return;
  }
  const animal = (DATA.animals||[]).find(a=>a.tagId===SALE_AUTH_TAG);
  if(animal){
    animal.forSale = SALE_AUTH_TARGET;
    saveModule("animals", true);
  }
  const listed = SALE_AUTH_TARGET === "Available for Sale";
  closeSaleAuthModal();
  renderShowcase();
  showToast(listed ? "Animal listed for sale" : "Animal removed from sale");
}
document.getElementById("sale-auth-confirm").addEventListener("click", confirmSaleAuth);
document.getElementById("sale-auth-cancel").addEventListener("click", closeSaleAuthModal);
document.getElementById("sale-auth-input").addEventListener("keydown", (e)=>{ if(e.key==="Enter") confirmSaleAuth(); });

/* ============================== FINANCIAL REPORT ============================== */
function renderFinancialReport(){
  const totalSalesRevenue = (DATA.sales||[]).reduce((s,r)=>s+(Number(r.price)||0),0);
  const pendingReceivables = (DATA.sales||[]).reduce((s,r)=>{
    const outstanding = (Number(r.price)||0) - (Number(r.amountReceived)||0);
    return s + Math.max(0, outstanding);
  }, 0);
  const { rows: expenseRows, total: totalExpenses } = computeExpenseBreakdown();
  const netPosition = totalSalesRevenue - totalExpenses;

  // Per-animal profit ledger: every sale, paired with the matching purchase
  // (by animalTag) so its cost breakdown and the resulting profit sit side
  // by side, the same way the Animal Profile's "Purchase / Sale" section
  // already pairs them for a single animal.

/* ============================== PHOTO GALLERY ============================== */
function renderGallery(){
  let items = [];
  // If the exact same photo was attached to more than one record (e.g. the same
  // picture added to both a Purchase and a Sale for one animal), only show it once
  // in the gallery instead of once per record it's attached to.
  const seenSrc = new Set();
  MODULES.forEach(m=>{
    (DATA[m.id]||[]).forEach(r=>{
      (r.photos||[]).forEach(p=>{
        if(seenSrc.has(p)) return;
        seenSrc.add(p);
        items.push({ src:p, caption:(r[m.fields[0].key]||m.label), moduleLabel:m.label, allPhotos:r.photos });
      });
    });
  });
  items.sort(()=>0); // preserve module order
  // Old tablet browsers can badly miscompute a percentage-padding "square tile"
  // trick when it's combined with CSS Grid's 1fr column sizing — the two need
  // each other's size to resolve, and a weaker engine can get that circular
  // dependency wrong, producing wildly oversized tiles instead of clean squares
  // (this is exactly what made the gallery look "stuck"/unscrollable). Sidestep
  // it entirely: measure the real available width in JS and lay out the grid
  // with plain flexbox and literal pixel sizes, so there's nothing left for
  // any browser to get wrong.
  const contentEl = document.getElementById("content");
  const availWidth = (contentEl.clientWidth || window.innerWidth) - 40; // minus 20px side padding
  const cols = availWidth >= 480 ? 4 : 3;
  const gap = 6;
  const tileSize = Math.floor((availWidth - gap*(cols-1)) / cols);
  document.getElementById("content").innerHTML = `
    <div class="module-hero">
      <div class="m-eyebrow">${items.length} Photo${items.length!==1?"s":""}</div>
      <h1 class="serif">Photo Gallery</h1>
      <div class="m-rule"></div>
    </div>
    ${items.length===0 ? `<div class="empty-note">No photos saved yet. Add photos to any record and they will appear here.</div>` : `
    <div style="display:flex; flex-wrap:wrap; gap:${gap}px; padding:0 20px;">
      ${items.map((it,i)=>`
        <div style="position:relative; width:${tileSize}px; height:${tileSize}px; flex-shrink:0; border-radius:8px; overflow:hidden; border:1px solid var(--hair); cursor:pointer;" data-gallery-idx="${i}">
          <img src="${it.src}" style="position:absolute; top:0; left:0; width:100%;height:100%;object-fit:cover;" />
        </div>`).join("")}
    </div>`}
  `;
  document.querySelectorAll("[data-gallery-idx]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const it = items[Number(el.getAttribute("data-gallery-idx"))];
      openLightbox(it.allPhotos && it.allPhotos.length ? it.allPhotos : [it.src]);
    });
  });
}

// Many animals on the farm were bought in, not born here, so they may have
// no recorded Date of Birth. Rather than showing a blank age everywhere,
// fall back to the date the animal was purchased (from its purchase record)
// so age/sorting/certificates still have something meaningful to work with.
function getEffectiveDOB(animal){
  if(!animal) return "";
  if(animal.dob) return animal.dob;
  const purchase = (DATA.purchases||[]).find(p=>p.animalTag===animal.tagId);
  return (purchase && purchase.date) || "";
}

function calcAge(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr);
  if(isNaN(dob.getTime())) return null;
  const now = new Date();
  let years = now.getFullYear() - dob.getFullYear();
  let months = now.getMonth() - dob.getMonth();
  if(now.getDate() < dob.getDate()) months--;
  if(months < 0){ years--; months += 12; }
  if(years<=0) return months+" mo";
  return years+"y "+months+"mo";
}

  let profitHtml = "";
  if(purchase && sale){
    const acquireCost = (Number(purchase.price)||0) + (Number(purchase.transportCost)||0) + (Number(purchase.additionalCost)||0);
    const salePrice = Number(sale.price)||0;

        <div><span class="f-label">Sale price ${salePrice.toLocaleString("en-IN")} minus total acquire cost ${acquireCost.toLocaleString("en-IN")}</span></div></div>
      </div>
    </div>`;
  }

  document.getElementById("content").innerHTML = `
    <div class="profile-hero">

        ${photo}

          <div class="profile-photo-eyebrow">${esc(animal.animalType||"Animal")}${animal.breed?" · "+esc(animal.breed):""}</div>
