<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SZ Dairy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000; --surface:#141210; --surface2:#1C1916; --surface3:#242019;
    --border:#3A331F; --hair:#2A2419;
    --gold:#D4AF37; --gold2:#F0D584; --gold3:#9C7A22;
    --text:#F5F0E6; --muted:#A69A82; --muted2:#6E6551;
    --danger:#C0574B; --ok:#6FA07E;
    --gradient-gold: linear-gradient(135deg, #F0D584 0%, #D4AF37 45%, #B8860B 100%);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:radial-gradient(ellipse 900px 500px at 50% -10%, #1E1A12 0%, #000000 60%) fixed, #000;
    color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .serif{ font-family:'Cormorant Garamond', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  ::placeholder{ color:var(--muted2); }
  button, input, select, textarea{ font-family:inherit; }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .hero, .stat-card, .catalog-card, .alert-row, .record-card{ animation:fadeInUp .45s cubic-bezier(.2,.8,.2,1) both; }
  .stat-card, .catalog-card, .alert-row, .record-card, .data-btn, .m-save, .m-cancel, #tb-add{
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .stat-card:active, .catalog-card:active, .alert-row:active, .record-card:active, .data-btn:active{ transform:scale(.97); }

  #topbar{ position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; background:#0A0806; border-bottom:1px solid var(--hair); }
  #tb-left{ display:flex; align-items:center; gap:4px; min-width:44px; }
  #back-btn{ background:none; border:none; color:var(--gold); font-size:15px; cursor:pointer; padding:4px 2px;
    display:none; align-items:center; gap:3px; font-weight:600; }
  #tb-relock{ background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:4px 2px;
    display:none; align-items:center; gap:3px; font-weight:600; }
  #tb-relock:hover{ color:var(--gold2); }
  #tb-title{ font-size:20px; font-weight:600; letter-spacing:.02em; flex:1; text-align:center; color:var(--gold2); }
  #tb-title .light{ color:var(--gold2); font-weight:500; }
  #tb-right{ min-width:44px; display:flex; justify-content:flex-end; }
  #tb-add{ background:none; border:1px solid var(--gold3); color:var(--gold2); font-size:12px; font-weight:700;
    cursor:pointer; padding:6px 12px; border-radius:3px; display:none; text-transform:uppercase; letter-spacing:.08em; }

  #content{ padding:0 0 60px; max-width:720px; margin:0 auto; }

  /* Hero */
  .hero{ text-align:center; padding:40px 20px 34px; position:relative; }
  .hero::before{ content:""; position:absolute; top:10px; left:50%; transform:translateX(-50%); width:200px; height:200px;
    background:radial-gradient(circle, rgba(212,175,55,.14) 0%, transparent 70%); pointer-events:none; }
  .hero::after{ content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:120px; height:1px;
    background:linear-gradient(90deg, transparent, var(--gold3), transparent); }
  .hero-badge{ width:88px; height:88px; border-radius:50%; margin:0 auto 18px; overflow:hidden; position:relative;
    border:1.5px solid var(--gold3); box-shadow:0 0 0 5px rgba(0,0,0,.9), 0 0 0 6px rgba(212,175,55,.25), 0 20px 40px rgba(0,0,0,.6); }
  .hero-badge img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero h1{ font-size:38px; font-weight:600; margin:0; letter-spacing:.01em; }
  .hero .tagline{ color:var(--muted); font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; margin-top:8px; }
  .hero .est{ color:var(--gold3); font-size:11px; letter-spacing:.15em; margin-top:14px; }

  .eyebrow{ color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    padding:0 20px; margin-bottom:2px; display:flex; align-items:center; gap:10px; }
  .eyebrow::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--hair), transparent); }
  .eyebrow:not(:first-of-type){ margin-top:8px; }
  .section-title{ font-size:22px; font-weight:600; padding:0 20px; margin:0 0 16px; }

  /* Editorial stat grid */
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--hair);
    margin:0 20px 34px; border:1px solid var(--hair); border-radius:8px; overflow:hidden; }
  .stat-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); padding:20px 18px;
    cursor:pointer; position:relative; box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03); }
  .stat-card::before{ content:""; position:absolute; top:0; left:0; width:26px; height:2px; background:var(--gradient-gold); }
  .stat-card .s-label{ color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
  .stat-card .s-value{ font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; color:var(--gold2);
    margin-top:8px; line-height:1; }
  .stat-card .s-sub{ color:var(--muted2); font-size:11px; margin-top:5px; }
  .status-badge{ display:inline-block; margin-left:8px; padding:2px 9px; border-radius:20px; font-size:9px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; vertical-align:middle; border:1px solid; }
  .status-badge.status-active{ background:rgba(111,160,126,.14); color:#6FA07E; border-color:rgba(111,160,126,.4); }
  .status-badge.status-sold{ background:rgba(224,92,92,.14); color:#e05c5c; border-color:rgba(224,92,92,.4); }
  .status-badge.status-deceased{ background:rgba(150,150,150,.14); color:#999; border-color:rgba(150,150,150,.4); }
  .status-badge.status-transferred{ background:rgba(92,158,224,.14); color:#5c9ee0; border-color:rgba(92,158,224,.4); }

  /* Animal Profile — a distinct, editorial-style header for the profile
     screen only (module list headers keep using .module-hero unchanged). */
  .profile-hero{ padding:24px 0 6px; }
  .profile-photo-frame{ width:100%; max-width:440px; aspect-ratio:4/3; margin:0 auto; border-radius:18px;
    overflow:hidden; position:relative; border:1px solid var(--hair);
    box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03);
    background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); }
  .profile-photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .profile-photo-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .profile-photo-fallback span{ font-family:'Cormorant Garamond',serif; font-size:96px; font-weight:700; color:var(--gold3); opacity:.45; }
  .profile-photo-overlay{ position:absolute; left:0; right:0; bottom:0; padding:20px 22px 16px; text-align:left;
    background:linear-gradient(to top, rgba(5,4,3,.92) 12%, rgba(5,4,3,.5) 58%, transparent 100%); }
  .profile-photo-eyebrow{ color:var(--gold2); font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.9; }
  .profile-photo-name{ font-family:'Cormorant Garamond',serif; font-size:32px; font-weight:700; color:var(--text);
    margin-top:4px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; line-height:1.15; }
  .profile-actions{ display:flex; justify-content:center; gap:10px; margin-top:18px; padding:0 20px; flex-wrap:wrap; }
  .profile-action-btn{ background:none; border:1px solid var(--hair); color:var(--gold2); border-radius:999px; padding:10px 20px;
    font-size:12.5px; font-weight:700; letter-spacing:.03em; cursor:pointer; }
  .profile-action-btn.primary{ background:var(--gradient-gold); border:none; color:#0A0806; }

  /* Alert strip */
  .alert-strip{ margin:0 20px 34px; }
  .alert-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--surface);
    box-shadow:0 3px 10px rgba(0,0,0,.3);
    border:1px solid var(--hair); border-left:2px solid var(--gold3); border-radius:6px; margin-bottom:8px; cursor:pointer; }
  .alert-row .a-text{ flex:1; font-size:13.5px; color:var(--text); }
  .alert-row .a-count{ background:var(--gradient-gold); color:#141108; font-size:11px; font-weight:800;
    padding:3px 9px; border-radius:999px; }
  .alert-row .a-chev{ color:var(--gold3); }

  /* Catalog grid (editorial cards) */
  .catalog-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:0 20px; }
  .catalog-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid var(--hair);
    border-radius:10px; padding:18px 16px; cursor:pointer; position:relative; overflow:hidden; text-align:left;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03); }
  .catalog-card::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--gradient-gold); }
  .catalog-card:nth-child(3n+2)::before{ opacity:.75; }
  .catalog-card:nth-child(3n+3)::before{ opacity:.55; }
  .catalog-card:active{ border-color:var(--gold3); box-shadow:0 4px 14px rgba(0,0,0,.35), 0 0 0 1px rgba(212,175,55,.3); }
  .catalog-card .c-index{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--gold3); letter-spacing:.05em; }
  .catalog-card .c-name{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; margin-top:6px; color:#928B78; }
  .catalog-card .c-sub{ color:var(--muted); font-size:10.5px; margin-top:2px; letter-spacing:.02em; }
  .catalog-card .c-count{ margin-top:14px; color:var(--gold2); font-size:12px; font-weight:600; }

  .data-row{ display:flex; gap:12px; margin:24px 20px 0; }
  .data-btn{ flex:1; background:var(--surface); border:1px solid var(--hair); color:var(--text); border-radius:8px;
    padding:14px; cursor:pointer; font-size:12.5px; font-weight:600; letter-spacing:.02em; }
  .data-btn .dg{ color:var(--gold2); }
  .footnote{ color:var(--muted2); font-size:11.5px; padding:16px 20px 0; line-height:1.7; text-align:center; }
  .footnote b{ color:var(--gold3); }

  /* Module list header */
  .module-hero{ padding:28px 20px 20px; text-align:center; }
  .module-hero .m-eyebrow{ color:var(--gold); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.18em; }
  .module-hero h1{ font-size:34px; font-weight:600; margin:6px 0 0; }
  .module-hero .m-rule{ width:60px; height:1px; background:linear-gradient(90deg, transparent, var(--gold3), transparent);
    margin:14px auto 0; }

  .search-wrap{ padding:0 20px 18px; }
  .search-wrap input{ width:100%; background:var(--surface); border:1px solid var(--hair); border-radius:8px;
    color:var(--text); padding:12px 16px; font-size:14.5px; outline:none; }
  .search-wrap input:focus{ border-color:var(--gold3); }

  .filter-row{ display:flex; gap:8px; overflow-x:auto; padding:0 20px 16px; -webkit-overflow-scrolling:touch; }
  .filter-chip{ flex-shrink:0; background:var(--surface); border:1px solid var(--hair); color:var(--muted);
    border-radius:999px; padding:7px 15px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .filter-chip.active{ background:var(--gradient-gold); color:#141108; border-color:transparent; }

  .empty-note{ margin:0 20px; background:var(--surface); border:1px dashed var(--hair); border-radius:10px;
    padding:52px 20px; text-align:center; color:var(--muted); font-size:13.5px; }

  .weight-chart-wrap{ margin:0 20px 24px; background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
    border:1px solid var(--hair); border-radius:10px; padding:16px 12px 8px; box-shadow:0 3px 10px rgba(0,0,0,.3); }
  .weight-chart-svg{ width:100%; height:auto; display:block; overflow:visible; }
  .chart-grid{ stroke:var(--hair); stroke-width:1; }
  .chart-axis-label{ fill:var(--muted); font-size:10px; }
  .chart-line{ stroke:var(--gold2); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round; }
  .chart-area{ fill:var(--gold2); opacity:.1; }
  .chart-dot{ fill:var(--gold2); stroke:var(--surface2); stroke-width:1.5; }

  .ledger-wrap{ margin:0 20px 24px; overflow-x:auto; border:1px solid var(--hair); border-radius:10px; }
  .ledger-table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:560px; }
  .ledger-table th{ background:var(--surface2); color:var(--gold3); text-align:left; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; padding:10px 12px; border-bottom:1px solid var(--hair); white-space:nowrap; }
  .ledger-table td{ padding:9px 12px; border-bottom:1px solid var(--hair); color:var(--text); white-space:nowrap; }
  .ledger-table tr:last-child td{ border-bottom:none; }
  .ledger-table .num{ text-align:right; font-variant-numeric:tabular-nums; }
  .ledger-empty{ text-align:center; color:var(--muted); padding:20px !important; white-space:normal !important; }
  .expense-breakdown-card{ margin:0 20px 24px; background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
    border:1px solid var(--hair); border-radius:10px; padding:6px 16px; }

  /* Showcase — meant to be handed to a customer, so it stays visually calm
     and premium rather than dense/functional like the rest of the app. */
  .showcase-hero{ text-align:center; padding:36px 20px 20px; position:relative; }
  .showcase-hero-glow{ position:absolute; top:6px; left:50%; transform:translateX(-50%); width:220px; height:220px;
    background:radial-gradient(circle, rgba(212,175,55,.16) 0%, transparent 70%); pointer-events:none; z-index:0; }
  .showcase-hero .hero-badge{ position:relative; z-index:1; }
  .showcase-hero h1, .showcase-hero .tagline, .showcase-hero .showcase-trust-badge{ position:relative; z-index:1; }
  .showcase-trust-badge{ display:inline-block; margin-top:14px; padding:6px 18px; border:1px solid var(--gold3);
    border-radius:20px; color:var(--gold2); font-size:12px; letter-spacing:.08em; font-weight:600; }
  .showcase-intro{ position:relative; z-index:1; max-width:340px; margin:16px auto 0; color:var(--muted);
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:16.5px; line-height:1.65; }
  .showcase-signature{ display:flex; align-items:center; justify-content:center; padding:8px 20px 34px; }
  .showcase-signature-stat{ text-align:center; padding:0 16px; }
  .showcase-signature-divider{ width:1px; height:44px; background:linear-gradient(180deg, transparent, var(--gold3), transparent); }
  .showcase-signature-value{ font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:700; color:var(--gold2); line-height:1; }
  .showcase-signature-label{ margin-top:9px; font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-weight:600; }
  .showcase-herd-card{ text-align:center; cursor:pointer; background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%);
    border:1px solid var(--hair); border-radius:12px; padding:8px 8px 10px; box-shadow:0 3px 10px rgba(0,0,0,.3);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .showcase-herd-card:active{ transform:scale(.97); }
  .showcase-herd-card:hover{ border-color:var(--gold3); box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .showcase-herd-name{ margin-top:8px; font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:700; color:var(--text); }
  .showcase-herd-breed{ font-size:10.5px; color:var(--muted); margin-top:1px; }
  .showcase-sale-toggle{ display:block; width:100%; margin-top:7px; background:none; border:none; color:var(--gold3);
    font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; padding:2px 0; }
  .showcase-sale-toggle:hover{ color:var(--gold2); text-decoration:underline; }
  .showcase-herd-badge{ position:absolute; top:6px; right:6px; padding:3px 9px; border-radius:20px; font-size:9px;
    font-weight:800; letter-spacing:.06em; text-transform:uppercase; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .showcase-herd-badge.for-sale{ background:var(--gradient-gold); color:#141108; }
  .showcase-herd-badge.sold{ background:rgba(10,8,6,.85); color:var(--muted); border:1px solid var(--hair); }
  .showcase-filter-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:0 20px 18px; }
  .showcase-date-divider{ display:flex; align-items:center; margin:26px 20px 14px; }
  .showcase-date-divider:first-child{ margin-top:2px; }
  .showcase-date-divider-line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold3), transparent); }
  .showcase-date-divider-text{ padding:0 14px; color:var(--gold2); font-family:'Cormorant Garamond',serif;
    font-style:italic; font-size:14px; letter-spacing:.03em; white-space:nowrap; }
  .showcase-quote{ text-align:center; padding:34px 30px 4px; font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:19px; color:var(--gold2); line-height:1.6; }
  .showcase-quote-attr{ margin-top:12px; font-size:10.5px; color:var(--gold3); letter-spacing:.14em; text-transform:uppercase; font-style:normal; }
  .showcase-footer{ text-align:center; padding:20px 20px 40px; color:var(--muted); font-size:11px; letter-spacing:.05em; }
  .showcase-footer .m-rule{ margin:0 auto 16px; }

  /* Farm story — only rendered when the farm has actually written one, set
     as a proper pull-quote (oversized mark, serif italic) rather than a
     boxed paragraph, so an empty story never falls back to stock copy. */
  .showcase-quote{ margin:0 20px 36px; padding:2px 8px; text-align:center; position:relative; }
  .showcase-quote-mark{ font-family:'Cormorant Garamond',serif; font-size:56px; line-height:1; color:var(--gold3);
    opacity:.55; display:block; margin-bottom:-14px; }
  .showcase-quote p{ font-family:'Cormorant Garamond',serif; font-size:21px; line-height:1.6; color:var(--text);
    font-style:italic; font-weight:500; max-width:460px; margin:0 auto; }
  .showcase-quote .m-rule{ margin:18px auto 0; }

  /* Contact card — only appears once the farm has entered a phone/WhatsApp/
     address, so an unconfigured showcase never shows a dead-end button. */
  .showcase-contact{ margin:6px 20px 30px; padding:22px 20px; border:1px solid var(--gold3); border-radius:14px;
    text-align:center; background:linear-gradient(160deg, rgba(212,175,55,.09) 0%, rgba(212,175,55,.02) 100%); }
  .showcase-contact-title{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:700; color:var(--gold2); }
  .showcase-contact-address{ margin-top:7px; color:var(--muted); font-size:12.5px; line-height:1.6; white-space:pre-line; }
  .showcase-contact-row{ display:flex; gap:10px; margin-top:16px; }
  .showcase-contact-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:12px;
    border-radius:9px; font-size:12.5px; font-weight:700; letter-spacing:.03em; text-decoration:none; cursor:pointer;
    border:none; }
  .showcase-contact-btn.primary{ background:var(--gradient-gold); color:#141108; }
  .showcase-contact-btn.secondary{ background:none; border:1px solid var(--gold3); color:var(--gold2); }

  /* Certificate — a decorative double border gives it a "document" feel even
     though it's plain HTML/CSS, no image assets needed. */
  .certificate-wrap{ padding:0 20px 40px; }
  .certificate-inner{ border:2px solid var(--gold3); border-radius:4px; padding:14px; position:relative; overflow-x:hidden; }
  .certificate-inner::before{ content:""; position:absolute; inset:6px; border:1px solid var(--gold3); border-radius:2px;
    pointer-events:none; }
  .certificate-farm-name{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700; text-align:center;
    color:var(--text); margin-top:6px; }
  .certificate-tagline{ text-align:center; color:var(--muted); font-size:10.5px; letter-spacing:.06em; margin-top:2px; }
  .certificate-photo{ width:96px; height:96px; margin:0 auto 10px; border-radius:50%; overflow:hidden; border:2px solid var(--gold3); }
  .certificate-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* Receipt buyer block — pulled out of the two-column grid and pushed
     fully to the right edge so the buyer's name reads as the clear
     "who this receipt is for" line rather than one field among many. */
  .receipt-buyer-block{ text-align:right; margin:14px 14px 0; }
  .receipt-buyer-block .certificate-field-label{ display:block; }
  .receipt-buyer-block .certificate-field-value{ font-size:15px; }
  .certificate-care-since{ text-align:center; color:var(--muted); font-size:11px; margin-top:8px; font-style:italic; }
  .certificate-divider{ width:60px; height:1px; background:var(--gold3); margin:18px auto; }
  .certificate-title{ text-align:center; font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600;
    color:var(--gold2); letter-spacing:.02em; padding:0 20px; }
  .certificate-animal-name{ text-align:center; font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:700;
    color:var(--text); margin-top:14px; }
  .certificate-animal-sub{ text-align:center; color:var(--muted); font-size:12px; margin-top:2px; }
  .certificate-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px 14px; margin:26px 10px; }
  .certificate-field-label{ color:var(--gold3); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .certificate-field{ min-width:0; }
  .certificate-field-value{ color:var(--text); font-size:13px; font-weight:600; margin-top:3px; word-break:break-word; }
  .certificate-statement{ text-align:center; color:var(--muted); font-size:12px; line-height:1.6; padding:0 14px;
    margin-top:6px; }
  .certificate-signature{ text-align:center; margin-top:32px; padding-bottom:10px; }
  .certificate-sig-line{ width:140px; height:1px; background:var(--hair); margin:0 auto 8px; }
  .certificate-sig-label{ font-family:'Cormorant Garamond',serif; font-size:15px; font-weight:700; color:var(--text); }
  .certificate-sig-date{ color:var(--muted); font-size:10.5px; margin-top:2px; }

  /* Certificate v2 — the formal "printable document" look is now the one and
     only design, used identically on screen and on paper (previously screen
     used the app's dark card style and only print used this design; now
     they're unified so what you see in the app is exactly what prints).
     Sized to fit a real A4 page: content width ~190mm, seal fixed at the
     standard 66×22mm rectangular stamp size. */
  .cert2-wrap{ max-width:190mm; margin:0 auto; padding:0 20px 40px; }
  .cert2-card{ background:#0c0b09; border:2px solid var(--gold3); border-radius:6px;
    padding:34px 30px 26px; position:relative; box-shadow:0 3px 14px rgba(0,0,0,.6); overflow:hidden; }
  .cert2-card::after{ content:""; position:absolute; inset:7px; border:1px solid var(--gold3);
    border-radius:3px; pointer-events:none; z-index:2; }
  /* Bracket-style corner marks — the classic "framed document" cue, sitting
     just inside the double border. */
  .cert2-corner{ position:absolute; width:22px; height:22px; border:2px solid var(--gold3); z-index:2; pointer-events:none; }
  .cert2-corner.tl{ top:13px; left:13px; border-right:none; border-bottom:none; }
  .cert2-corner.tr{ top:13px; right:13px; border-left:none; border-bottom:none; }
  .cert2-corner.bl{ bottom:13px; left:13px; border-right:none; border-top:none; }
  .cert2-corner.br{ bottom:13px; right:13px; border-left:none; border-top:none; }
  /* Faint diagonal watermark — sits behind all real content, purely
     decorative (a printed-document cue), never obscures the facts. */
  .cert2-watermark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Cormorant Garamond',serif; font-size:58px; font-weight:700; color:var(--gold); opacity:.05;
    transform:rotate(-26deg); letter-spacing:.06em; text-align:center; pointer-events:none; z-index:0;
    white-space:nowrap; }
  .cert2-content{ position:relative; z-index:1; }
  .cert2-facts{ margin-top:0; }
  .cert2-body{ margin-top:0; }
  .cert2-meta-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:16px; }
  .cert2-meta{ display:flex; flex-direction:column; min-width:0; }
  .cert2-meta.right{ align-items:flex-end; text-align:right; }
  .cert2-meta-label{ color:var(--gold3); font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }
  .cert2-meta-value{ color:var(--muted); font-size:11.5px; font-family:'JetBrains Mono',monospace; margin-top:2px; letter-spacing:.02em; }
  .cert2-meta-sub{ color:var(--muted2); font-size:9px; font-family:'JetBrains Mono',monospace; margin-top:2px; letter-spacing:.02em; }
  .cert2-photo{ width:200px; height:160px; margin:0 auto 14px; border-radius:10px; overflow:hidden; }
  .cert2-photo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .cert2-logo{ width:64px; height:64px; margin:0 auto 10px; }
  .cert2-logo img{ width:100%; height:100%; object-fit:contain; display:block; }
  .cert2-farm-name{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:700;
    text-align:center; color:var(--text); margin-top:4px; }
  .cert2-tagline{ text-align:center; color:var(--muted); font-size:10.5px; letter-spacing:.06em; margin-top:2px; }
  .cert2-divider{ width:50px; height:1px; background:var(--gold3); margin:16px auto; opacity:.8; }
  .cert2-eyebrow{ display:flex; align-items:center; justify-content:center; gap:12px;
    color:var(--gold); font-size:14px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  .cert2-eyebrow::before, .cert2-eyebrow::after{ content:""; flex:1; max-width:46px; height:1px; background:var(--gold3); }
  .cert2-certify-line{ text-align:center; color:var(--muted); font-size:11.5px; font-style:italic; letter-spacing:.03em; margin-top:16px; }
  .cert2-animal-name{ text-align:center; font-family:'Cormorant Garamond',serif; font-size:32px;
    font-weight:700; color:var(--gold2); letter-spacing:.01em; margin-top:6px; }
  .cert2-animal-sub{ text-align:center; color:var(--muted); font-size:12px; margin-top:2px; }
  .cert2-care-since{ text-align:center; color:var(--muted); font-size:11px; margin-top:6px; font-style:italic; }
  .cert2-stats{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--gold3);
    border-bottom:1px solid var(--gold3); padding:14px 0; margin:22px 0 0; break-inside:avoid; page-break-inside:avoid; }
  .cert2-stat{ text-align:center; min-width:0; border-right:1px solid var(--hair); }
  .cert2-stat:last-child{ border-right:none; }
  .cert2-stat .cs-label{ color:var(--gold3); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }
  .cert2-stat .cs-value{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600;
    color:var(--text); margin-top:4px; word-break:break-word; }
  /* Supporting-facts grid (parentage, DOB, colour, etc.) — pulled straight
     from the animal's record, so a field only appears here if the farm
     actually has that data. */
  .cert2-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 18px; margin:18px 4px 0; }
  .cert2-field{ min-width:0; border-left:2px solid var(--hair); padding-left:9px; }
  .cert2-field-label{ color:var(--gold3); font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
  .cert2-field-value{ color:var(--text); font-size:12.5px; font-weight:600; margin-top:2px; word-break:break-word; }
  /* Health & Care record strip — same visual language as the stats bar
     above, but only rendered at all when there's at least one real
     inspection, deworming, or medical record behind it. */
  .cert2-health-title{ text-align:center; color:var(--gold3); font-size:9px; font-weight:700; text-transform:uppercase;
    letter-spacing:.14em; margin:22px 0 8px; }
  .cert2-health{ display:grid; border-top:1px solid var(--gold3); border-bottom:1px solid var(--gold3);
    padding:12px 0; break-inside:avoid; page-break-inside:avoid; }
  .cert2-health-item{ text-align:center; min-width:0; border-right:1px solid var(--hair); padding:0 4px; }
  .cert2-health-item:last-child{ border-right:none; }
  .cert2-health-item .ch-label{ color:var(--gold3); font-size:8.5px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
  .cert2-health-item .ch-value{ color:var(--text); font-size:12px; font-weight:600; margin-top:4px; word-break:break-word; }
  .cert2-health-item .ch-sub{ color:var(--muted); font-size:9.5px; margin-top:1px; }
  .cert2-statement{ text-align:center; color:var(--muted); font-style:italic; font-size:13px; line-height:1.6; padding:0 10px; margin-top:22px; }
  .cert2-footnote{ text-align:center; color:var(--muted2); font-size:9px; line-height:1.5; padding:0 16px; margin-top:14px; }
  .cert2-signature{ display:flex; align-items:center; justify-content:center; gap:28px; margin-top:28px; flex-wrap:wrap;
    break-inside:avoid; page-break-inside:avoid; }
  .cert2-sig-line{ width:120px; height:1px; background:var(--gold3); margin:0 auto 8px; }
  .cert2-sig-label{ font-family:'Cormorant Garamond',serif; font-size:14px; font-weight:700; color:var(--text); }
  .cert2-sig-title{ color:var(--muted); font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }
  .cert2-sig-date{ color:var(--muted); font-size:10.5px; margin-top:4px; }
  /* Standard rectangular business-stamp proportions: 66mm × 22mm. */
  .cert2-seal{ display:flex; align-items:center; justify-content:center; width:66mm; height:22mm;
    max-width:100%; border:2px solid var(--gold3); border-radius:4px; position:relative; flex-shrink:0; }
  .cert2-seal::before{ content:""; position:absolute; inset:5px; border:1px solid var(--gold3); border-radius:2px; }
  .cert2-seal-inner{ font-family:'Cormorant Garamond',serif; font-size:9.5px; font-weight:700;
    letter-spacing:.05em; text-transform:uppercase; color:var(--gold2); text-align:center; line-height:1.35; }

  .receipt-invoice-no{ text-align:center; color:var(--muted); font-size:12px; letter-spacing:.04em; margin-top:6px; }
  .receipt-amount-box{ margin:24px 10px 0; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); padding:14px 4px; }
  .receipt-amount-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; color:var(--text); font-size:13.5px; }
  .receipt-amount-total{ margin-top:4px; padding-top:12px; border-top:1px dashed var(--hair); font-weight:700; font-size:16px; color:var(--gold2); }
  .receipt-words{ margin:10px 10px 0; font-size:11.5px; color:var(--muted); font-style:italic; line-height:1.5; }
  .receipt-sign-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:34px; }
  .receipt-sign-grid .certificate-signature{ margin-top:0; }
  .receipt-actions-row{ display:flex; gap:10px; }
  .receipt-actions-row button{ flex:1; border-radius:8px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; }
  .receipt-share-btn{ background:none; border:1px solid var(--gold3); color:var(--gold2); }

  .record-list{ padding:0 20px; display:grid; gap:12px; }
  .date-group-label{ grid-column:1/-1; color:var(--gold3); font-size:11px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; margin:14px 0 -2px; padding-bottom:8px; border-bottom:1px solid var(--hair); }
  .record-list > .date-group-label:first-child{ margin-top:0; }
  .f-carryover{ color:var(--muted2); font-size:11px; margin-top:4px; font-style:italic; }
  .record-card{ background:linear-gradient(160deg, var(--surface2) 0%, var(--surface) 100%); border:1px solid var(--hair);
    border-radius:10px; padding:16px; box-shadow:0 3px 10px rgba(0,0,0,.3);
    display:flex; align-items:flex-start; }
  .rc-photo{ width:60px; height:60px; flex-shrink:0; margin-right:14px; border-radius:8px; overflow:hidden; border:1px solid var(--gold3);
    display:flex; align-items:center; justify-content:center; background:var(--surface3); }
  .rc-photo img{ width:100%; height:100%; object-fit:cover; cursor:pointer; }
  .rc-photo span{ font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--gold3); }
  .rc-body{ flex:1; min-width:0; margin-right:14px; }
  /* Safety net: on older/weaker browsers a flex or grid item can refuse to shrink
     below its content's natural width, spilling into the next column instead of
     wrapping. Forcing min-width:0 on anything that sits in a multi-column layout
     guarantees it shrinks with its track instead of overlapping a neighbor. */
  .stat-card, .catalog-card, .record-card, .alert-row, .field-row,
  .field-row input, .field-row select, .field-row textarea{ min-width:0; }
  .rc-id{ font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; color:var(--gold2); }
  .rc-fields{ display:flex; flex-wrap:wrap; gap:2px 16px; margin-top:5px; }
  .rc-fields .f-label{ color:var(--muted2); font-size:10.5px; font-weight:600; }
  .rc-fields .f-val{ color:var(--text); font-size:13px; font-weight:500; }
  .more-photos{ color:var(--muted2); font-size:11px; margin-top:4px; width:100%; }
  .rc-actions{ display:flex; flex-direction:column; gap:8px; flex-shrink:0; }
  .rc-actions button{ background:none; border:none; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer;
    letter-spacing:.03em; }
  .rc-actions button:hover{ color:var(--gold2); }
  .rc-actions button.del:hover{ color:var(--danger); }

  /* App lock screen */
  #lock-screen{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100);
    background:#050403; z-index:500; display:none; align-items:center; justify-content:center; padding:24px; }
  #lock-screen.open{ display:flex; }
  .lock-box{ width:100%; max-width:340px; text-align:center; }
  .lock-box .hero-badge{ width:88px; height:88px; margin:0 auto 18px; }
  .lock-title{ font-size:26px; margin:0 0 4px; color:var(--text); }
  .lock-sub{ color:var(--muted); font-size:13px; margin:0 0 22px; }
  .lock-input{ width:100%; background:var(--surface2); border:1px solid var(--hair); color:var(--text);
    border-radius:10px; padding:14px 16px; font-size:16px; text-align:center; letter-spacing:.15em; margin-bottom:8px;
    box-sizing:border-box; min-width:0; }
  .lock-input:focus{ outline:none; border-color:var(--gold3); }
  .lock-error{ color:var(--danger); font-size:12px; min-height:16px; margin-bottom:10px; }
  .lock-unlock-btn{ width:100%; background:var(--gradient-gold); color:#0A0806; border:none; border-radius:10px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:14px; }
  .lock-shake{ animation:lockShake .3s ease; }
  @keyframes lockShake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-8px); } 75%{ transform:translateX(8px); } }

  /* Set / change app password modal */
  #pw-modal-backdrop, #fp-modal-backdrop{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100);
    background:rgba(0,0,0,.7); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
  #pw-modal-backdrop.open, #fp-modal-backdrop.open{ display:flex; }
  #fp-modal{ max-width:400px; max-height:86vh; overflow-y:auto; }
  #pw-modal, .pw-modal-box{ width:100%; max-width:360px; background:#0A0806; border:1px solid var(--gold3); border-radius:16px;
    padding:24px; box-sizing:border-box; }
  .pw-modal-title{ font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:600; margin-bottom:16px; color:var(--text); }
  .pw-modal-label{ display:block; color:var(--gold3); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; margin:12px 0 6px; }
  .pw-modal-actions{ display:flex; gap:10px; margin-top:14px; }
  .pw-modal-save-btn{ flex:1; background:var(--gradient-gold); color:#0A0806; border:none; border-radius:8px;
    padding:12px; font-size:14px; font-weight:700; cursor:pointer; }
  .pw-modal-cancel-btn{ flex:1; background:none; border:1px solid var(--hair); color:var(--muted); border-radius:8px;
    padding:12px; font-size:14px; font-weight:600; cursor:pointer; }

  /* Owner-only sale-listing gate on the customer Showcase (reuses the
     pw-modal look-and-feel) */
  #sale-auth-backdrop{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100);
    background:rgba(0,0,0,.7); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
  #sale-auth-backdrop.open{ display:flex; }
  #sale-auth-modal{ width:100%; max-width:360px; background:#0A0806; border:1px solid var(--gold3); border-radius:16px;
    padding:24px; box-sizing:border-box; }

  /* Total Expenses breakdown (reuses the pw-modal look-and-feel) */
  #expense-breakdown-backdrop{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100);
    background:rgba(0,0,0,.7); z-index:400; display:none; align-items:center; justify-content:center; padding:20px; }
  #expense-breakdown-backdrop.open{ display:flex; }
  #expense-breakdown-modal{ width:100%; max-width:380px; max-height:calc(var(--app-vh, 1vh) * 80); overflow-y:auto;
    background:#0A0806; border:1px solid var(--gold3); border-radius:16px; padding:24px; box-sizing:border-box; }
  .expense-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--hair); gap:12px; }
  .expense-row .exp-label{ color:var(--text); font-size:13.5px; min-width:0; }
  .expense-row .exp-value{ color:var(--muted); font-size:13.5px; font-weight:600; flex-shrink:0; }
  .expense-row.exp-total{ border-bottom:none; margin-top:6px; padding-top:14px; border-top:2px solid var(--gold3); }
  .expense-row.exp-total .exp-label, .expense-row.exp-total .exp-value{ color:var(--gold2); font-size:15px; font-weight:700; }
  .stat-card.clickable{ cursor:pointer; }

  /* Modal */
  #modal-backdrop{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100); background:rgba(0,0,0,0); z-index:100; display:flex;
    align-items:flex-end; justify-content:center; pointer-events:none; transition:background .25s ease; }
  #modal-backdrop.open{ background:rgba(0,0,0,.7); pointer-events:auto; }
  #modal{ background:#0A0806; width:100%; max-width:720px; max-height:calc(var(--app-vh, 1vh) * 92);
    display:flex; flex-direction:column; overflow:hidden;
    border-radius:16px 16px 0 0; border-top:1px solid var(--gold3); transform:translateY(100%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  #modal-backdrop.open #modal{ transform:translateY(0); }
  #modal .modal-topbar{ flex-shrink:0; background:#0A0806; display:flex; align-items:center;
    justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--hair); }
  #modal .modal-topbar .m-title{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
  #modal .modal-topbar button{ background:none; border:none; font-size:14px; cursor:pointer; padding:4px; font-weight:600; }
  #modal .m-cancel{ color:var(--muted); }
  #modal-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; min-height:0; }
  #modal-footer{ flex-shrink:0; display:flex; gap:10px; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:#0A0806; border-top:1px solid var(--hair); }
  #modal-fields{ padding:20px; }

  .field-row{ margin-bottom:16px; }
  .field-row label{ display:block; font-size:11px; color:var(--gold3); margin-bottom:6px; font-weight:700;
    text-transform:uppercase; letter-spacing:.06em; }
  .field-row input, .field-row select, .field-row textarea{ width:100%; background:var(--surface); border:1px solid var(--hair);
    border-radius:8px; color:var(--text); padding:11px 13px; font-size:14.5px; outline:none; font-family:'Inter',sans-serif; }
  .field-row input:focus, .field-row select:focus, .field-row textarea:focus{ border-color:var(--gold3); }
  .field-row textarea{ resize:vertical; }
  .field-row select option{ background:var(--surface); }

  .photo-section-label{ color:var(--gold3); font-size:11px; margin:0 0 8px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
  .photo-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
  .photo-thumb{ position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--gold3); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; }
  .photo-thumb .rm{ position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; border:none;
    border-radius:50%; width:18px; height:18px; cursor:pointer; font-size:11px; line-height:1; }
  .photo-add{ width:72px; height:72px; border-radius:8px; border:1px dashed var(--gold3); background:var(--surface);
    color:var(--gold2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:300; }

  /* ============================ TABLET (e.g. Galaxy Tab / SM-T231, ~600px+) ============================ */
  /* ======================================================================
     TABLET LAYOUT — tuned for the Galaxy Tab 4 7.0 (SM-T231, 1024x600) and
     similar small/mid tablets. Kicks in at 600px+ (covers the T231's short
     side in portrait) with extra rules for its 1024px landscape width and
     the tight 600px landscape height.
     ====================================================================== */
  @media (min-width:600px){
    #topbar{ padding:16px 28px; }
    #tb-title{ font-size:22px; }
    #tb-right button, #tb-left button{ font-size:14px; padding:6px 4px; }
    .showcase-signature-stat{ padding:0 44px; }

    /* Let content breathe instead of staying phone-narrow with dead margins */
    #content{ max-width:920px; }

    /* Home hero a little grander on the extra canvas */
    .hero{ padding:48px 20px 40px; }
    .hero-badge{ width:104px; height:104px; }
    .hero h1{ font-size:44px; }
    .profile-photo-frame{ max-width:520px; }
    .profile-photo-name{ font-size:38px; }

    .search-wrap input{ padding:14px 16px; font-size:15.5px; }

    /* Stat grids: fill available width instead of a fixed 2-col phone layout.
       auto-fit collapses unused tracks, so 2-card, 3-card, 4-card and 5-card
       grids all still look intentional (not stretched to 4 empty columns). */
    .stat-grid{ grid-template-columns:repeat(auto-fit, minmax(190px,1fr)) !important; }
    .stat-card{ padding:22px 18px; }
    .stat-card .s-value{ font-size:32px; }

    /* Recent activity / alerts: two columns so the list doesn't run on forever */
    .alert-strip{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:8px 14px; }
    .alert-row{ margin-bottom:0; }

    /* Module catalog: more columns to use the width, still readable cards */
    .catalog-grid{ grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:14px; }

    /* Record lists (search results within a module): flow into columns */
    .record-list{ grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); }
    .rc-photo{ width:72px; height:72px; }

    .data-row{ max-width:600px; margin-left:auto; margin-right:auto; }
    .footnote{ max-width:600px; margin-left:auto; margin-right:auto; }

    /* Modal becomes a proper centered dialog instead of a bottom sheet */
    #modal-backdrop{ align-items:center; padding:24px; }
    #modal{ max-width:820px; width:100%; max-height:calc(var(--app-vh, 1vh) * 88); border-radius:18px; border:1px solid var(--gold3);
      border-top:1px solid var(--gold3); transform:translateY(16px) scale(.98); opacity:0; transition:transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
    #modal-backdrop.open #modal{ transform:translateY(0) scale(1); opacity:1; }
    #modal .modal-topbar{ padding:20px 28px; }
    #modal .modal-topbar .m-title{ font-size:24px; }

    /* Two-column field layout to use the extra width */
    #modal-fields{ padding:24px 28px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:6px 24px; }
    .field-row{ margin-bottom:10px; }
    .field-row.wide{ grid-column:1 / -1; }
    .photo-section-label, .photo-grid, #photo-input{ grid-column:1 / -1; }

    /* Larger touch targets for fields and buttons */
    .field-row label{ font-size:12px; }
    .field-row input, .field-row select, .field-row textarea{ padding:13px 15px; font-size:15.5px; }
    #modal-footer{ padding:18px 28px calc(18px + env(safe-area-inset-bottom)); gap:14px; }
    #modal-footer button{ padding:16px !important; font-size:15px !important; }
    #modal-cancel-bottom{ padding:16px 24px !important; }

    /* Bigger photo thumbnails, more breathing room */
    .photo-thumb, .photo-add{ width:96px; height:96px; }
    .photo-thumb .rm{ width:22px; height:22px; font-size:13px; }

    /* Bigger lightbox images now that there's room */
    #lightbox .imgs{ max-width:880px; }
  }

  /* Wide landscape (e.g. SM-T231 at 1024x600): push a 3rd column where it helps */
  @media (min-width:900px) and (orientation:landscape){
    #modal{ max-width:920px; max-height:calc(var(--app-vh, 1vh) * 92); }
    #modal-fields{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .field-row.wide{ grid-column:1 / -1; }
    .catalog-grid{ grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); }
    .record-list{ grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); }
  }

  /* Short-height landscape (a wide-but-short tablet screen): trim
     vertical padding so the modal's header/footer don't eat the screen,
     and cap the modal against the JS-measured real viewport height so a
     mobile browser's address bar / keyboard can never push the footer
     (Save/Cancel) off-screen with no way to reach it. */
  @media (min-width:600px) and (max-height:640px) and (orientation:landscape){
    #modal{ max-height:calc(var(--app-vh, 1vh) * 96); }
    #modal .modal-topbar{ padding:12px 24px; }
    #modal .modal-topbar .m-title{ font-size:19px; }
    #modal-fields{ padding:14px 24px; }
    .field-row{ margin-bottom:6px; }
    #modal-footer{ padding:10px 24px calc(10px + env(safe-area-inset-bottom)); }
    #modal-footer button{ padding:12px !important; }
    .hero{ padding:24px 20px 20px; }
    .hero-badge{ width:72px; height:72px; }
    .hero h1{ font-size:32px; }
    .module-hero{ padding:16px 20px 12px; }
  }

  #lightbox{ position:fixed; top:0; right:0; bottom:0; left:0; width:100%; height:calc(var(--app-vh, 1vh) * 100); background:rgba(0,0,0,.95); z-index:200; display:none; align-items:center;
    justify-content:center; padding:20px; }
  #lightbox.open{ display:flex; }
  #lightbox .imgs{ display:flex; gap:10px; flex-wrap:wrap; max-width:700px; }
  #lightbox img{ max-height:calc(var(--app-vh, 1vh) * 70); max-width:100%; border-radius:10px; border:1px solid var(--gold3); }

  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); z-index:300;
    background:#171310; border:1px solid var(--gold3); color:var(--text); padding:12px 20px; border-radius:999px;
    font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; display:flex; align-items:center; gap:8px; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex-shrink:0; }

  .print-header{ display:none; }
  .print-header-logo{ display:none; }
  @media print{
    @page{ size:A4; margin:2.5cm; }
    /* Without this, browsers silently drop background colors/images when
       printing (their default "save ink" behavior), which would turn the
       certificate's black card into a plain white box on paper. Forcing
       exact color output here is what makes the black theme actually print. */
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    /* Hide everything that's only useful on-screen: navigation, buttons,
       search, filters, backup/security controls, and any overlay that
       might happen to be open. What's left is just the actual farm data. */
    #topbar, .data-row, .footnote, button, .search-wrap, .filter-row,
    #lock-screen, #pw-modal-backdrop, #fp-modal-backdrop, #expense-breakdown-backdrop, #sale-auth-backdrop,
    #modal-backdrop, #lightbox, .catalog-grid, .photo-add, .no-print{ display:none !important; }

    .print-header{ display:flex !important; align-items:center; gap:14px; margin-bottom:20px; padding-bottom:14px; border-bottom:2px solid #a9791c; }
    .print-header-logo{ display:block !important; width:52px; height:52px; object-fit:contain; flex-shrink:0; }
    .print-header-title{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:700; color:#1a1208 !important; }
    .print-header-sub{ font-size:11px; color:#8a7550 !important; margin-top:4px; }
    /* The Certificate and Receipt carry their own letterhead, so the
       generic page header would just duplicate the farm name above it. */
    body.has-doc-header .print-header{ display:none !important; }

    body{ background:#fff !important; color:#1a1208 !important; }
    *{ box-shadow:none !important; text-shadow:none !important; }

    /* Warm dark-ink fallback for anything not given a specific accent color
       below — guarantees nothing renders as invisible light-on-white text,
       regardless of which on-screen class it happens to carry. Specific
       overrides further down (same !important weight) win on specificity,
       so this only fills in what isn't deliberately colored. */
    body *{ color:#1a1208 !important; }

    /* Bring back the app's gold identity for headings and labels — the
       actual data (names, dates, values) stays high-contrast dark ink so
       it's the easiest thing on the page to read; labels and section
       titles get the gold accent so the page still feels like *this* app. */
    .eyebrow, .section-title, h1.serif, .tagline, .est, .m-eyebrow,
    .modal-topbar .m-title{ color:#96751a !important; }
    .stat-card .s-label, .rc-fields .f-label, .c-sub, .lock-sub{ color:#8a7550 !important; }
    .stat-card .s-value, .rc-fields .f-val, .rc-id{ color:#1a1208 !important; font-weight:700; }

    .stat-card, .record-card, .alert-row, #pw-modal, #expense-breakdown-modal{
      background:#fff !important; border:1px solid #d8c48a !important; }
    .stat-grid{ background:#fff !important; }
    .empty-note{ background:#fff !important; border:1px dashed #d8c48a !important; color:#8a7550 !important; }
    .rc-photo{ background:#fdf8ec !important; border-color:#a9791c !important; }
    .rc-photo span{ color:#96751a !important; }

    /* Animal Profile photo banner — the dark gradient overlay only reads
       correctly with light text on it, so it keeps its own colors here
       instead of the page's dark-ink fallback above. */
    .profile-photo-frame{ border-color:#c9a13b !important; background:#fdf8ec !important; box-shadow:none !important; }
    .profile-photo-overlay{ background:linear-gradient(to top, rgba(5,4,3,.92) 12%, rgba(5,4,3,.5) 58%, transparent 100%) !important; }
    .profile-photo-name{ color:#F5F0E6 !important; }
    .profile-photo-eyebrow{ color:#F0D584 !important; }
    .profile-photo-fallback span{ color:#c9a13b !important; }
    .m-rule, hr{ background:#d8c48a !important; border-color:#d8c48a !important; }

    /* Don't let a card get sliced across a page break. */
    .stat-card, .record-card, .catalog-card, .alert-row{ break-inside:avoid; page-break-inside:avoid; }

    /* Status badges keep their meaning in print — a light tint background
       with a matching dark border/text reads clearly on paper, the same
       way a printed "stamp" would, instead of collapsing to plain text. */
    .status-badge{ border:1px solid currentColor !important; font-weight:700; background:#fff !important; }
    .status-badge.status-sold{ background:#fbeaea !important; color:#a33333 !important; }
    .status-badge.status-deceased{ background:#f1f1ee !important; color:#5a5346 !important; }
    .status-badge.status-transferred{ background:#e8f0fb !important; color:#2f5fa3 !important; }

    .weight-chart-wrap{ background:#fff !important; border:1px solid #d8c48a !important; break-inside:avoid; page-break-inside:avoid; }
    .chart-grid{ stroke:#d8c48a !important; }
    .chart-axis-label{ fill:#8a7550 !important; }
    .chart-line{ stroke:#96751a !important; }
    .chart-area{ fill:#96751a !important; opacity:.12; }
    .chart-dot{ fill:#96751a !important; stroke:#fff !important; }

    .ledger-wrap{ overflow-x:visible !important; border:1px solid #d8c48a !important; }
    .ledger-table{ min-width:0 !important; width:100% !important; table-layout:fixed; }
    .ledger-table th{ background:#fdf8ec !important; color:#96751a !important; border-bottom:1px solid #d8c48a !important;
      white-space:normal !important; }
    .ledger-table td{ border-bottom:1px solid #eee2c4 !important; white-space:normal !important; word-break:break-word; }
    .ledger-table thead{ display:table-header-group; }
    .ledger-table tr{ break-inside:avoid; page-break-inside:avoid; }
    .expense-breakdown-card{ background:#fff !important; border:1px solid #d8c48a !important; }

    /* Certificate — keep its branded gold/dark-ink look on paper instead of
       falling back to plain black, since this one's meant to be handed to
       a customer and should look intentional when printed. */
    .certificate-farm-name, .certificate-animal-name, .certificate-field-value, .certificate-sig-label{ color:#1a1208 !important; }
    .certificate-tagline, .certificate-sig-date, .certificate-care-since{ color:#8a7550 !important; }
    .certificate-photo{ border-color:#96751a !important; }
    .certificate-title, .certificate-field-label{ color:#96751a !important; }
    .certificate-statement{ color:#5a4d38 !important; }
    .certificate-inner, .certificate-inner::before{ border-color:#96751a !important; }
    .certificate-divider{ background:#96751a !important; }
    .certificate-sig-line{ background:#ccc !important; }

    /* Certificate v2 (the animal Certificate of Health & Care). The design
       itself is identical on screen and paper (see .cert2-* rules above);
       print just needs the box-shadow removed and the card stretched to
       at least fill the A4 page (minus the 2.5cm @page margin) so a short
       certificate doesn't leave dead space — but height is a floor, not a
       ceiling, so a certificate with a longer health record simply grows
       onto a second sheet instead of ever having facts silently clipped. */
    .cert2-wrap{ max-width:none !important; width:100% !important; margin:0 !important; padding:0 !important; }
    #content{ padding:0 !important; max-width:none !important; margin:0 !important; }
    .cert2-card{ box-shadow:none !important; width:100% !important; min-height:245mm !important;
      box-sizing:border-box !important; padding:36px 44px !important; }
    .cert2-content{ display:flex !important; flex-direction:column !important; justify-content:space-between !important;
      min-height:calc(245mm - 72px) !important; }
    .cert2-header{ flex-shrink:0; }
    .cert2-facts{ flex-shrink:0; }
    .cert2-body{ flex-shrink:0; }
    .cert2-signature{ margin-top:0 !important; flex-shrink:0; }

    /* The page-wide dark-ink fallback above (body *{color:#1a1208}) would
       otherwise flatten this card's light-on-black theme to unreadable
       dark text on a dark background, so every cert2 text role gets its
       own explicit color here at the same !important weight. */
    .cert2-card{ background:#0c0b09 !important; }
    .cert2-farm-name, .cert2-sig-label{ color:#F5F0E6 !important; }
    .cert2-animal-name{ color:#F0D584 !important; }
    .cert2-tagline, .cert2-meta-value, .cert2-certify-line, .cert2-animal-sub, .cert2-care-since,
    .cert2-statement, .cert2-sig-title, .cert2-sig-date, .cert2-health-item .ch-sub{ color:#A69A82 !important; }
    .cert2-meta-sub, .cert2-footnote{ color:#6E6551 !important; }
    .cert2-meta-label, .cert2-eyebrow, .cert2-stat .cs-label, .cert2-field-label,
    .cert2-health-title, .cert2-health-item .ch-label, .cert2-seal-inner{ color:#9C7A22 !important; }
    .cert2-stat .cs-value, .cert2-field-value, .cert2-health-item .ch-value{ color:#F5F0E6 !important; }
    .cert2-watermark{ color:#D4AF37 !important; }
    .cert2-card, .cert2-card::after, .cert2-corner{ border-color:#9C7A22 !important; }
    .cert2-photo{ background:transparent !important; }
    .cert2-divider, .cert2-eyebrow::before, .cert2-eyebrow::after, .cert2-stats, .cert2-health,
    .cert2-sig-line, .cert2-seal, .cert2-seal::before{ border-color:#9C7A22 !important; background:#9C7A22 !important; }
    .cert2-stat{ border-right-color:#2A2419 !important; }
    .cert2-field{ border-left-color:#2A2419 !important; }
    .cert2-health-item{ border-right-color:#2A2419 !important; }
    /* Reset the two rules above that shouldn't get a background fill —
       .cert2-stats/.cert2-health are containers (border only), and the
       seal/divider selectors above only need border color repeated for
       .cert2-sig-line and .cert2-divider (thin bars, so background IS
       the visible line) while .cert2-seal keeps a transparent center. */
    .cert2-stats, .cert2-health{ background:transparent !important; }
    .cert2-seal{ background:transparent !important; }
    .cert2-seal::before{ background:transparent !important; }

    /* Sale Receipt reuses the certificate's styling — same overrides apply. */
    .receipt-invoice-no{ color:#8a7550 !important; }
    .receipt-amount-box{ border-color:#d8c48a !important; }
    .receipt-amount-row{ color:#1a1208 !important; }
    .receipt-amount-total{ color:#96751a !important; border-color:#d8c48a !important; }
    .receipt-words{ color:#5a4d38 !important; }

    /* Defensive: if the Showcase screen is ever printed by accident, don't
       let its dark-theme card backgrounds turn into unreadable black boxes —
       the same bug class fixed elsewhere in this stylesheet. */
    .showcase-herd-card{ background:#fff !important; border-color:#d8c48a !important; }
    .showcase-trust-badge{ border-color:#96751a !important; color:#96751a !important; }
    .showcase-signature-value{ color:#1a1208 !important; }
  }
</style>
</head>
<body>

<div class="print-header">
  <img class="print-header-logo" id="print-header-logo" alt="" />
  <div>
    <div class="print-header-title">S.Z. Dairy Farm</div>
    <div class="print-header-sub">Printed on <span id="print-date"></span></div>
  </div>
</div>

<div id="lock-screen">
  <div class="lock-box">
    <div class="hero-badge" id="lock-logo-badge"></div>
    <h1 class="serif lock-title">S.Z. Dairy Farm</h1>
    <p class="lock-sub">Enter password to continue</p>
    <input type="password" id="lock-password-input" class="lock-input" placeholder="Password" autocomplete="off" inputmode="text" />
    <div id="lock-error" class="lock-error"></div>
    <button id="lock-unlock-btn" class="lock-unlock-btn">Unlock</button>
  </div>
</div>

<div id="pw-modal-backdrop">
  <div id="pw-modal">
    <div class="pw-modal-title" id="pw-modal-title">Set App Password</div>
    <div id="pw-current-row" style="display:none;">
      <label class="pw-modal-label">Current Password</label>
      <input type="password" id="pw-current-input" class="lock-input" autocomplete="off" />
    </div>
    <label class="pw-modal-label">New Password</label>
    <input type="password" id="pw-new-input" class="lock-input" autocomplete="off" />
    <label class="pw-modal-label">Confirm New Password</label>
    <input type="password" id="pw-confirm-input" class="lock-input" autocomplete="off" />
    <div id="pw-modal-error" class="lock-error"></div>
    <div class="pw-modal-actions">
      <button id="pw-modal-cancel" class="pw-modal-cancel-btn">Cancel</button>
      <button id="pw-modal-save" class="pw-modal-save-btn">Save</button>
    </div>
  </div>
</div>

<div id="fp-modal-backdrop">
  <div id="fp-modal" class="pw-modal-box">
    <div class="pw-modal-title">Showcase Contact &amp; Story</div>
    <label class="pw-modal-label">Phone (for "Call Farm" button)</label>
    <input type="tel" id="fp-phone-input" class="lock-input" style="letter-spacing:normal;text-align:left;" autocomplete="off" placeholder="e.g. +91 98765 43210" />
    <label class="pw-modal-label">WhatsApp Number (for "WhatsApp" button)</label>
    <input type="tel" id="fp-whatsapp-input" class="lock-input" style="letter-spacing:normal;text-align:left;" autocomplete="off" placeholder="e.g. 919876543210" />
    <label class="pw-modal-label">Address / Visiting Info</label>
    <textarea id="fp-address-input" class="lock-input" style="letter-spacing:normal;text-align:left;min-height:60px;resize:vertical;" placeholder="Village / Taluka / District, Gujarat"></textarea>
    <label class="pw-modal-label">Farm Story (shown on the Showcase — leave blank to use the default)</label>
    <textarea id="fp-story-input" class="lock-input" style="letter-spacing:normal;text-align:left;min-height:90px;resize:vertical;" placeholder="A short paragraph about the farm, its care standards, and what makes it trustworthy"></textarea>
    <div id="fp-modal-error" class="lock-error"></div>
    <div class="pw-modal-actions">
      <button id="fp-modal-cancel" class="pw-modal-cancel-btn">Cancel</button>
      <button id="fp-modal-save" class="pw-modal-save-btn">Save</button>
    </div>
  </div>
</div>

<!-- Owner-only gate for changing an animal's sale listing from the customer-
     facing Showcase screen — a customer browsing the tablet can see this
     control but cannot act on it without the app password. -->
<div id="sale-auth-backdrop">
  <div id="sale-auth-modal">
    <div class="pw-modal-title" id="sale-auth-title">Confirm Password</div>
    <div id="sale-auth-subtitle" style="color:var(--muted); font-size:12.5px; margin:-10px 0 16px; line-height:1.5;"></div>
    <label class="pw-modal-label">App Password</label>
    <input type="password" id="sale-auth-input" class="lock-input" autocomplete="off" />
    <div id="sale-auth-error" class="lock-error"></div>
    <div class="pw-modal-actions">
      <button id="sale-auth-cancel" class="pw-modal-cancel-btn">Cancel</button>
      <button id="sale-auth-confirm" class="pw-modal-save-btn">Confirm</button>
    </div>
  </div>
</div>


<div id="expense-breakdown-backdrop">
  <div id="expense-breakdown-modal">
    <div class="pw-modal-title">Total Expenses — Breakdown</div>
    <div id="expense-breakdown-body"></div>
    <div class="pw-modal-actions">
      <button id="expense-breakdown-close" class="pw-modal-cancel-btn" style="flex:1;">Close</button>
    </div>
  </div>
</div>

<div id="topbar">
  <div id="tb-left"><button id="back-btn">‹ Back</button><button id="tb-relock" title="Lock and return to the password screen">🔒 Lock</button></div>
  <div id="tb-title" class="serif">S.Z. <span class="light">Dairy Farm</span></div>
  <div id="tb-right"><button id="tb-add">+ Add</button></div>
</div>

<div id="content"></div>

<div id="modal-backdrop"><div id="modal"></div></div>
<div id="lightbox"><div class="imgs"></div></div>
<div id="toast"><span class="dot"></span><span id="toast-text"></span></div>

function esc(s){ if(s===undefined||s===null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// A crossbred animal's breed is still stored as one plain string (so every
// existing display, search, and export that reads `animal.breed` keeps
// working unchanged) — it's just joined from up to two picks, e.g.
// "Jaffrabadi + Murrah". These two helpers convert between that stored
// string and the two dropdown values shown in the Animals form.
function breedValueToParts(val){
  if(!val) return ["", ""];
  const parts = String(val).split(" + ").map(s=>s.trim()).filter(Boolean);
  return [parts[0]||"", parts[1]||""];
}
function breedPartsToValue(a, b){
  const parts = [a, b].map(s=>(s||"").trim()).filter(Boolean);
  // Guard against picking the same breed twice.
  if(parts.length===2 && parts[0]===parts[1]) return parts[0];
  return parts.join(" + ");
}

// Plain SVG line chart — no charting library needed, and SVG's viewBox scales
// cleanly to any screen size with nothing to recalculate in JS (unlike a CSS
// grid/percentage trick, this has caused no compatibility problems on this
// tablet's browser in testing). Colors are applied via CSS classes rather
// than inline attributes so both the on-screen dark theme and the print
// black/gold theme can style it the normal way.
// Animates a number counting up from 0 to its real value — used on the
// Showcase screen so the stats feel alive instead of just appearing static.
// Respects the visitor's OS-level "reduce motion" preference by jumping
// straight to the final number for anyone who's asked for less animation.
function animateCountUp(el, target, opts){
  opts = opts || {};
  const duration = opts.duration || 1400;
  const suffix = opts.suffix || "";
  const prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(prefersReducedMotion || !target){
    el.textContent = Math.round(target).toLocaleString("en-IN") + suffix;
    return;
  }
  const startTime = performance.now();
  function step(now){
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic — starts fast, settles gently
    const val = Math.round(target * eased);
    el.textContent = val.toLocaleString("en-IN") + suffix;
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function buildWeightChartSVG(weights){
  return buildGrowthChartSVG(weights, "weight", "unit", "Kg");
}
function buildHeightChartSVG(heights){
  return buildGrowthChartSVG(heights, "height", "unit", "cm");
}
function buildGrowthChartSVG(records, valueKey, unitKey, defaultUnit){
  const weights = records;
  if(!weights || weights.length < 2) return "";
  const w = 600, h = 220, padL = 44, padR = 16, padT = 16, padB = 30;
  const vals = weights.map(r=>Number(r[valueKey])||0);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = (maxV - minV) || 1;
  const stepX = (w - padL - padR) / (weights.length - 1);
  const unit = weights[weights.length-1][unitKey] || defaultUnit;
  const pts = weights.map((r,i)=>{
    const x = padL + i*stepX;
    const y = padT + (h - padT - padB) * (1 - ((Number(r[valueKey])||0) - minV) / range);
    return { x, y, date: r.date, value: r[valueKey] };
  });
  const pathD = pts.map((p,i)=> (i===0?"M":"L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const baseY = (h - padB).toFixed(1);
  const areaD = pathD + ` L${pts[pts.length-1].x.toFixed(1)},${baseY} L${pts[0].x.toFixed(1)},${baseY} Z`;

  const gridLines = [0, 0.5, 1].map(f=>{
    const y = padT + (h - padT - padB) * f;
    const val = Math.round(maxV - range * f);
    return `<line class="chart-grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" />
      <text class="chart-axis-label" x="${padL - 8}" y="${(y + 4).toFixed(1)}" text-anchor="end">${val}</text>`;
  }).join("");

  const labelIdxs = new Set([0, pts.length - 1, Math.floor(pts.length / 2)]);
  const xLabels = pts.filter((_, i) => labelIdxs.has(i)).map(p=>
    `<text class="chart-axis-label" x="${p.x.toFixed(1)}" y="${h - padB + 16}" text-anchor="middle">${esc(formatDateDMY(p.date))}</text>`
  ).join("");

  const dots = pts.map(p=>
    `<circle class="chart-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5"><title>${esc(formatDateDMY(p.date))}: ${esc(p.value)} ${esc(unit)}</title></circle>`
  ).join("");

  return `
    <div class="weight-chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" class="weight-chart-svg" preserveAspectRatio="xMidYMid meet">
        ${gridLines}
        <path class="chart-area" d="${areaD}" />
        <path class="chart-line" d="${pathD}" fill="none" />
        ${dots}
        ${xLabels}
      </svg>
    </div>`;
}

// The farm wants dates read day-first (DD/MM/YYYY) everywhere they're displayed,
// regardless of the device's browser/locale. Date <input> fields still store and
// submit plain ISO "YYYY-MM-DD" strings (that's what type="date" always uses under
// the hood, and changing that would break the native calendar picker) — this just
// controls how a stored date is *shown* as text elsewhere in the app.
function formatDateDMY(isoDate){
  if(!isoDate) return "";
  const parts = String(isoDate).slice(0,10).split("-");
  if(parts.length!==3) return isoDate;
  const [y,m,d] = parts;
  if(!y || !m || !d) return isoDate;
  return `${d}/${m}/${y}`;
}
// Tolerant numeric parser: strips ₹ signs, thousands commas, and stray spaces before
// parsing, so a price typed as "50,000" or "₹ 50,000" is read as 50000, not silently
// dropped to 0 (which is what plain Number("50,000") -> NaN -> ||0 would do).
function toNum(v){
  if(v===undefined || v===null || v==="") return 0;
  if(typeof v === "number") return isNaN(v) ? 0 : v;
  const cleaned = String(v).replace(/[₹,\s]/g,"");
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

// Converts a rupee amount to words using the Indian numbering system (lakh/crore),
// e.g. 152500 -> "One Lakh Fifty Two Thousand Five Hundred Rupees Only". Used on the
// sale receipt so the written amount can't be silently misread the way digits can.
function numberToWordsIndian(num){
  num = Math.round(Math.abs(toNum(num)));
  if(num===0) return "Zero Rupees Only";
  const ones = ["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
    "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const tens = ["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function twoDigits(n){
    if(n===0) return "";
    if(n<20) return ones[n]+" ";
    return tens[Math.floor(n/10)]+" "+(n%10 ? ones[n%10]+" " : "");
  }
  function threeDigits(n){
    let s = "";
    if(n>=100){ s += ones[Math.floor(n/100)]+" Hundred "; n %= 100; }
    s += twoDigits(n);
    return s;
  }
  let n = num;
  const crore = Math.floor(n/10000000); n %= 10000000;
  const lakh = Math.floor(n/100000); n %= 100000;
  const thousand = Math.floor(n/1000); n %= 1000;
  const hundred = n;
  let words = "";
  if(crore) words += threeDigits(crore)+"Crore ";
  if(lakh) words += threeDigits(lakh)+"Lakh ";
  if(thousand) words += threeDigits(thousand)+"Thousand ";
  if(hundred) words += threeDigits(hundred);
  return (words.trim()+" Rupees Only").replace(/\s+/g," ");
}

/* ===================== APP PASSWORD LOCK =====================
   This is a simple on-device lock (like a screen lock), not real encryption —
   there's no server, so it can't stop someone determined and technical from
   getting at the data underneath. What it does do is stop a casual person who
   picks up the tablet from opening the app and poking around, which is what
   was asked for. The password itself isn't stored in plain text, just a
   scrambled fingerprint of it, so it isn't sitting there readable in storage.

   There's one common password baked into this file itself (as a hashed
   fingerprint, not the plain text) so it's the same no matter which device
   opens the app — since browser storage never carries over between devices,
   that's the only way to guarantee it matches everywhere. Changing the
   password from the dashboard only overrides it on that one device; other
   devices keep using the baked-in one until they're changed too, or until
   this file is updated with a new default and redeployed. */
const DEFAULT_APP_PASSWORD_HASH = "hvv2xzwa";
function simpleHash(str){
  let hash = 5381;
  for(let i=0;i<str.length;i++){
    hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = hash & hash;
  }
  return "h" + Math.abs(hash).toString(36) + str.length.toString(36);
}
// The password actually in effect on THIS device: a custom one set here, if
// any; otherwise the common baked-in default — unless the lock has been
// deliberately turned off here, in which case there's no password at all.
function getEffectivePasswordHash(){
  if(localStorage.getItem("sz_app_password_disabled") === "1") return null;
  return localStorage.getItem("sz_app_password_hash") || DEFAULT_APP_PASSWORD_HASH;
}
function hasCustomPassword(){ return !!localStorage.getItem("sz_app_password_hash"); }
function hasAppPassword(){ return getEffectivePasswordHash() !== null; }

/* ---- Second, customer-facing "Showcase" password ----
   Entirely separate from the owner password above. There's no baked-in
   default for it — it only exists once the owner sets one from Settings —
   so until then the lock screen only recognizes the owner password.
   Entering this password on the lock screen drops straight into the
   Showcase screen in a locked-down mode that can't reach the dashboard,
   animal records, sales, or Settings; see SHOWCASE_ONLY_MODE below. */
function getShowcasePasswordHash(){
  return localStorage.getItem("sz_showcase_password_hash") || null;
}
function hasShowcasePassword(){ return getShowcasePasswordHash() !== null; }
function hasAnyPassword(){ return hasAppPassword() || hasShowcasePassword(); }

// True for the remainder of this session once the visitor unlocked the app
// with the Showcase password rather than the owner password. While this is
// true, goTo() refuses to navigate anywhere except the Showcase screen (and
// certificates opened from it), and the dashboard/back-to-home routes stay
// unreachable until the device is relocked and the owner password is
// entered again.
let SHOWCASE_ONLY_MODE = false;

function showLockScreen(){
  const badge = document.getElementById("lock-logo-badge");
  if(badge && !badge.querySelector("img")) badge.innerHTML = `<img src="${LOGO_SRC}" alt="" />`;
  document.getElementById("lock-screen").classList.add("open");

  const errEl = document.getElementById("lock-error");

  errEl.style.color = "";
  setTimeout(()=> document.getElementById("lock-password-input").focus(), 100);
}

  document.getElementById("lock-screen").classList.remove("open");
}
function attemptUnlock(){
  const input = document.getElementById("lock-password-input");
  const entered = input.value;
  const ownerHash = getEffectivePasswordHash();
  const showcaseHash = getShowcasePasswordHash();
  if(entered && ownerHash && simpleHash(entered) === ownerHash){
    // Owner password — full app, starting at the dashboard.
    SHOWCASE_ONLY_MODE = false;
    hideLockScreen();
    loadAll().then(()=> goTo("home"));
  } else if(entered && showcaseHash && simpleHash(entered) === showcaseHash){
    // Showcase password — straight into the Showcase, locked to it.
    SHOWCASE_ONLY_MODE = true;
    hideLockScreen();
    loadAll().then(()=> goTo("showcase"));
  } else {
    const errEl = document.getElementById("lock-error");
    errEl.style.color = "";
    errEl.textContent = "Incorrect password — try again";
    const box = document.querySelector(".lock-box");
    box.classList.remove("lock-shake"); void box.offsetWidth; box.classList.add("lock-shake");
    input.value = "";
    input.focus();
  }
}

function savePasswordModal(){
  const errEl = document.getElementById("pw-modal-error");
  const current = document.getElementById("pw-current-input").value;
  const isShowcase = PW_MODAL_TARGET === "showcase";
  const noun = isShowcase ? "Showcase password" : "App password";
  const effectiveHash = isShowcase ? getShowcasePasswordHash() : getEffectivePasswordHash();
  if((PW_MODAL_MODE === "change" || PW_MODAL_MODE === "remove")){
    if(!current || simpleHash(current) !== effectiveHash){
      errEl.textContent = "Current password is incorrect";
      return;
    }
  }
  if(PW_MODAL_MODE === "remove"){
    if(isShowcase){
      localStorage.removeItem("sz_showcase_password_hash");
    } else {
      localStorage.setItem("sz_app_password_disabled", "1");
      localStorage.removeItem("sz_app_password_hash");
    }
    closePasswordModal();
    render();
    showToast(isShowcase ? "Showcase password removed" : "Password lock turned off on this device");
    return;
  }
  const newVal = document.getElementById("pw-new-input").value;
  const confirmVal = document.getElementById("pw-confirm-input").value;
  if(newVal.length < 4){ errEl.textContent = "Password must be at least 4 characters"; return; }
  if(newVal !== confirmVal){ errEl.textContent = "Passwords don't match"; return; }
  const newHash = simpleHash(newVal);
  // Keep the two passwords distinct — if they matched, entering it on the
  // lock screen would always resolve to whichever check runs first.
  if(isShowcase && newHash === getEffectivePasswordHash()){
    errEl.textContent = "Choose a password different from the app password";
    return;
  }
  if(!isShowcase && hasShowcasePassword() && newHash === getShowcasePasswordHash()){
    errEl.textContent = "Choose a password different from the showcase password";
    return;
  }
  if(isShowcase){
    localStorage.setItem("sz_showcase_password_hash", newHash);
  } else {
    localStorage.setItem("sz_app_password_hash", newHash);
    localStorage.removeItem("sz_app_password_disabled");
  }
  closePasswordModal();
  render();
  showToast(PW_MODAL_MODE === "set" ? noun + " set" : noun + " changed");
}
